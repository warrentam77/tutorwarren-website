<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>18th Edition Study App — BS 7671:2018+A4:2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800;900&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#161b24; --ink-soft:#3c4452; --line:#e3ddd2;
    --paper:#f6f3ec; --card:#ffffff; --navy:#0f1623; --navy-2:#172234;
    --copper:#bd6a32; --copper-d:#a3551f; --copper-soft:#f3e2d4;
    --amber:#f2c14e; --amber-d:#caa024;
    --green:#3f7d54; --red:#c0392b; --redbg:#fbe9e7; --greenbg:#e7f3ea;
    --shadow:0 1px 2px rgba(20,27,36,.06),0 8px 24px rgba(20,27,36,.07);
    --shadow-lg:0 12px 40px rgba(15,22,35,.18);
    --radius:14px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{
    font-family:'IBM Plex Sans',sans-serif; color:var(--ink);
    background:var(--paper);
    background-image:radial-gradient(circle at 12% 10%,rgba(189,106,50,.05),transparent 40%),
                     radial-gradient(circle at 88% 0%,rgba(15,22,35,.04),transparent 35%);
    line-height:1.6; -webkit-font-smoothing:antialiased;
  }
  code,.mono{font-family:'IBM Plex Mono',monospace}
  h1,h2,h3,h4,.disp{font-family:'Archivo',sans-serif;line-height:1.1;letter-spacing:-.01em}

  /* ---------- HEADER ---------- */
  header{
    background:var(--navy);
    background-image:linear-gradient(135deg,#0f1623,#1b2740 70%,#243453);
    color:#fff; position:sticky; top:0; z-index:50;
    border-bottom:3px solid var(--copper);
    box-shadow:0 6px 30px rgba(0,0,0,.25);
  }
  .topbar{max-width:1180px;margin:0 auto;padding:14px 22px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
  .brand{display:flex;align-items:center;gap:13px;cursor:pointer}
  .bolt{
    width:42px;height:42px;flex:none;border-radius:11px;
    background:linear-gradient(145deg,var(--amber),var(--copper));
    display:grid;place-items:center;box-shadow:0 4px 14px rgba(189,106,50,.4);
  }
  .bolt svg{width:24px;height:24px}
  .brand-txt b{font-family:'Archivo';font-weight:900;font-size:1.18rem;display:block;letter-spacing:-.02em}
  .brand-txt span{font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--amber);font-weight:600}

  .site-home{
    font-family:'Archivo';font-weight:700;font-size:.84rem;letter-spacing:.02em;
    background:var(--amber);color:var(--navy);text-decoration:none;
    padding:9px 15px;border-radius:9px;box-shadow:0 4px 12px rgba(242,193,78,.25);
    display:inline-flex;align-items:center;gap:7px;white-space:nowrap;transition:.18s;
  }
  .site-home:hover{background:#ffd76a;transform:translateY(-1px)}
  nav{margin-left:auto;display:flex;gap:4px;flex-wrap:wrap}
  .site-logo-link{margin-left:auto;display:block;line-height:0;align-self:center}
  .site-logo{height:46px;width:auto;display:block;border-radius:10px;border:1px solid rgba(255,255,255,.35);box-shadow:0 2px 10px rgba(0,0,0,.28)}
  nav{flex-basis:100%}
  nav button{
    font-family:'Archivo';font-weight:600;font-size:.84rem;letter-spacing:.01em;
    background:transparent;color:#cdd6e4;border:0;padding:9px 14px;border-radius:9px;
    cursor:pointer;transition:.18s;white-space:nowrap;
  }
  nav button:hover{background:rgba(255,255,255,.09);color:#fff}
  nav button.active{background:var(--copper);color:#fff;box-shadow:0 4px 12px rgba(189,106,50,.4)}

  /* ---------- LAYOUT ---------- */
  main{max-width:1180px;margin:0 auto;padding:34px 22px 80px}
  .view{display:none;animation:fade .4s ease}
  .view.show{display:block}
  @keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  .crumb{font-size:.82rem;color:var(--ink-soft);margin-bottom:14px;font-weight:500}
  .crumb b{color:var(--copper-d)}

  /* ---------- HERO ---------- */
  .hero{
    background:var(--navy);background-image:linear-gradient(120deg,#0f1623,#1d2c47);
    color:#fff;border-radius:var(--radius);padding:46px 40px;position:relative;overflow:hidden;
    box-shadow:var(--shadow-lg);margin-bottom:30px;
  }
  .hero::after{content:"";position:absolute;right:-60px;top:-60px;width:280px;height:280px;
    background:radial-gradient(circle,rgba(242,193,78,.22),transparent 70%);border-radius:50%}
  .hero .tag{display:inline-block;font-size:.72rem;letter-spacing:.18em;text-transform:uppercase;
    color:var(--amber);font-weight:600;border:1px solid rgba(242,193,78,.4);padding:4px 12px;border-radius:30px;margin-bottom:18px}
  .hero h1{font-size:clamp(1.9rem,4.5vw,3.1rem);font-weight:900;max-width:680px;margin-bottom:14px}
  .hero h1 em{color:var(--amber);font-style:normal}
  .hero p{max-width:620px;color:#c7d0de;font-size:1.04rem}
  .hero .pills{margin-top:24px;display:flex;gap:10px;flex-wrap:wrap}
  .hero .pills span{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);
    padding:7px 14px;border-radius:30px;font-size:.8rem;font-weight:500}

  .sec-title{font-size:1.5rem;font-weight:800;margin:38px 0 6px;display:flex;align-items:center;gap:11px}
  .sec-title .n{font-family:'IBM Plex Mono';font-size:.85rem;background:var(--copper);color:#fff;
    width:30px;height:30px;display:grid;place-items:center;border-radius:8px;flex:none}
  .sec-sub{color:var(--ink-soft);margin-bottom:20px;font-size:.96rem}

  /* ---------- PART TILES ---------- */
  .grid{display:grid;gap:16px}
  .parts-grid{grid-template-columns:repeat(auto-fill,minmax(255px,1fr))}
  .ptile{
    background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    padding:22px;cursor:pointer;transition:.2s;box-shadow:var(--shadow);position:relative;overflow:hidden;
  }
  .ptile::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--copper);transform:scaleY(0);transform-origin:top;transition:.25s}
  .ptile:hover{transform:translateY(-4px);box-shadow:var(--shadow-lg);border-color:var(--copper-soft)}
  .ptile:hover::before{transform:scaleY(1)}
  .ptile .num{font-family:'Archivo';font-weight:900;font-size:2.4rem;color:var(--copper-soft);line-height:.9}
  .ptile-head{display:flex;align-items:center;gap:12px;margin-bottom:2px}
  .pemoji{font-size:2rem;line-height:1}
  .ptile:hover .num{color:var(--copper)}
  .ptile h3{font-size:1.12rem;font-weight:800;margin:8px 0 6px}
  .ptile .tag{font-size:.78rem;color:var(--copper-d);font-weight:600;letter-spacing:.02em}
  .ptile .meta{margin-top:14px;font-size:.8rem;color:var(--ink-soft);display:flex;align-items:center;gap:6px}
  .ptile .meta svg{width:15px;height:15px;flex:none;color:var(--copper-d)}

  /* ---------- FEATURE CARDS ---------- */
  .feat-grid{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
  .feat{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:24px;
    cursor:pointer;transition:.2s;box-shadow:var(--shadow)}
  .feat:hover{transform:translateY(-4px);box-shadow:var(--shadow-lg)}
  .feat .ic{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;margin-bottom:14px;
    background:var(--copper-soft);color:var(--copper-d)}
  .feat .ic svg{width:24px;height:24px}
  .feat h3{font-size:1.08rem;font-weight:800;margin-bottom:6px}
  .feat p{font-size:.88rem;color:var(--ink-soft)}

  /* ---------- CHAPTER / EXPLANATION ---------- */
  .chapter{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    padding:26px 28px;margin-bottom:18px;box-shadow:var(--shadow)}
  .chapter h3{font-size:1.22rem;font-weight:800;margin-bottom:4px}
  .chapter .ch-num{font-family:'IBM Plex Mono';font-size:.78rem;color:var(--copper-d);font-weight:600;
    text-transform:uppercase;letter-spacing:.08em;margin-bottom:10px;display:block}
  .chapter .body{font-size:.97rem;color:var(--ink-soft)}
  .chapter .body em{color:var(--ink);font-style:italic;font-weight:500}
  .chapter .body strong{color:var(--ink)}
  .regbox{margin-top:18px;border-top:1px dashed var(--line);padding-top:16px}
  .regbox .lbl{font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-soft);font-weight:600;margin-bottom:10px}
  .reg{border-bottom:1px solid #f0ece3;cursor:pointer;transition:background .15s}
  .reg:last-child{border-bottom:0}
  .reg:hover{background:#faf7f1}
  .reg-head{display:flex;gap:12px;padding:11px 8px 11px 0;align-items:center}
  .reg .ref{font-family:'IBM Plex Mono';font-weight:600;font-size:.86rem;color:#fff;background:var(--navy-2);
    padding:3px 9px;border-radius:6px;flex:none;white-space:nowrap}
  .reg .what{font-size:.92rem;color:var(--ink);font-weight:500;flex:1}
  .reg-chev{color:var(--ink-soft);flex:none;transition:transform .25s}
  .reg.open .reg-chev{transform:rotate(90deg)}
  .reg.open{background:#faf7f1}
  .reg-detail{max-height:0;overflow:hidden;transition:max-height .35s ease}
  .reg.open .reg-detail{max-height:2000px}
  .reg-detail-inner{padding:2px 10px 16px 10px;font-size:.92rem;line-height:1.6;color:var(--ink-soft);
    border-left:3px solid var(--copper);margin:0 0 6px 2px;padding-left:16px}
  .reg-detail-inner b{color:var(--ink);font-weight:600}
  .a4-status{background:rgba(189,106,50,.07);border:1px solid var(--copper-soft);border-left:4px solid var(--copper);border-radius:12px;padding:14px 18px;margin-top:14px;font-size:.92rem;color:var(--ink);line-height:1.55}
  .a4-status b{color:var(--copper-d)}
  .a4-status ul{margin:8px 0 0;padding-left:20px}
  .a4-status li{margin-bottom:5px;color:var(--ink-soft)}
  .a4-banner{display:flex;align-items:center;gap:14px;background:linear-gradient(120deg,#bd6a32,#e0954f);color:#fff;border-radius:var(--radius);padding:15px 18px;margin-bottom:18px;cursor:pointer;box-shadow:var(--shadow);transition:transform .15s}
  .a4-banner:hover{transform:translateY(-2px)}
  .a4-banner .em{font-size:1.7rem;flex:none}
  .a4-banner .bt{font-weight:700;font-family:'Archivo'}
  .a4-banner .bs{font-size:.84rem;opacity:.92}
  .a4-banner .go{margin-left:auto;font-weight:700;flex:none}
  .reg-detail-inner .newtag{margin-bottom:0}

  /* ---------- INDEX ---------- */
  .searchwrap{position:relative;margin-bottom:18px}
  .searchwrap svg{position:absolute;left:16px;top:50%;transform:translateY(-50%);width:20px;height:20px;color:var(--ink-soft)}
  #idxSearch,#kwGoInput{width:100%;font-family:'IBM Plex Sans';font-size:1rem;padding:15px 16px 15px 48px;
    border:1px solid var(--line);border-radius:12px;background:var(--card);box-shadow:var(--shadow)}
  #idxSearch:focus{outline:none;border-color:var(--copper);box-shadow:0 0 0 4px var(--copper-soft)}
  .idx-count{font-size:.82rem;color:var(--ink-soft);margin-bottom:14px}
  .idx-list{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow)}
  .idx-row{display:flex;align-items:center;gap:14px;padding:13px 20px;border-bottom:1px solid #f0ece3;transition:.12s}
  .idx-row:last-child{border-bottom:0}
  .idx-row:hover{background:#faf7f1}
  .idx-row .term{flex:1;font-weight:500;font-size:.94rem}
  .idx-row .term .hl{background:var(--amber);border-radius:3px;padding:0 2px}
  .idx-row .ppart{font-size:.74rem;color:var(--ink-soft);white-space:nowrap}
  .idx-row .ref{font-family:'IBM Plex Mono';font-weight:600;font-size:.84rem;color:var(--copper-d);
    background:var(--copper-soft);padding:3px 10px;border-radius:6px;white-space:nowrap}

  /* ---------- DEFINITIONS ---------- */
  .def-letter{font-family:'Archivo';font-weight:900;font-size:1.1rem;color:var(--copper);
    margin:18px 0 8px;padding-bottom:5px;border-bottom:2px solid var(--copper-soft)}
  .def-group{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    overflow:hidden;box-shadow:var(--shadow);margin-bottom:6px}
  .def-row{padding:14px 20px;border-bottom:1px solid #f0ece3}
  .def-row:last-child{border-bottom:0}
  .def-head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:4px}
  .def-term{font-family:'Archivo';font-weight:700;font-size:1rem;color:var(--ink)}
  .def-term .hl,.def-text .hl{background:var(--amber);border-radius:3px;padding:0 2px}
  .def-cat{font-family:'IBM Plex Mono';font-size:.66rem;font-weight:600;letter-spacing:.04em;text-transform:uppercase;
    color:var(--navy-2);background:#eef1f6;border:1px solid var(--line);padding:1px 8px;border-radius:20px}
  .def-text{font-size:.92rem;line-height:1.55;color:var(--ink-soft)}

  /* ---------- FLASH CARDS ---------- */
  .toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:20px}
  .chip{font-family:'Archivo';font-weight:600;font-size:.8rem;padding:8px 14px;border-radius:30px;
    border:1px solid var(--line);background:var(--card);cursor:pointer;transition:.15s;color:var(--ink-soft)}
  .chip:hover{border-color:var(--copper)}
  .chip.on{background:var(--navy);color:#fff;border-color:var(--navy)}
  .fc-stage{display:grid;place-items:center;margin:10px 0 22px}
  .flashcard{width:100%;max-width:640px;height:340px;perspective:1600px;cursor:pointer}
  .fc-inner{position:relative;width:100%;height:100%;transition:transform .6s cubic-bezier(.4,.2,.2,1);transform-style:preserve-3d}
  .flashcard.flip .fc-inner{transform:rotateY(180deg)}
  .fc-face{position:absolute;inset:0;backface-visibility:hidden;border-radius:18px;padding:36px;
    display:flex;flex-direction:column;justify-content:center;box-shadow:var(--shadow-lg)}
  .fc-front{background:var(--card);border:1px solid var(--line)}
  .fc-back{background:var(--navy);background-image:linear-gradient(140deg,#0f1623,#20304c);color:#fff;transform:rotateY(180deg)}
  .fc-face .kicker{font-size:.72rem;letter-spacing:.16em;text-transform:uppercase;font-weight:600;margin-bottom:16px}
  .fc-front .kicker{color:var(--copper-d)}
  .fc-back .kicker{color:var(--amber)}
  .fc-front .q{font-family:'Archivo';font-weight:700;font-size:1.35rem;line-height:1.25}
  .fc-back .a{font-size:1rem;line-height:1.55;color:#dde4ef}
  .fc-back .a strong{color:#fff}.fc-back .a em{color:var(--amber);font-style:normal;font-weight:600}
  .fc-hint{position:absolute;bottom:16px;left:0;right:0;text-align:center;font-size:.74rem;opacity:.55}
  .fc-controls{display:flex;align-items:center;justify-content:center;gap:14px}
  .btn{font-family:'Archivo';font-weight:600;font-size:.9rem;padding:11px 20px;border-radius:10px;border:0;cursor:pointer;transition:.15s}
  .btn-primary{background:var(--copper);color:#fff;box-shadow:0 4px 12px rgba(189,106,50,.3)}
  .btn-primary:hover{background:var(--copper-d)}
  .btn-ghost{background:var(--card);border:1px solid var(--line);color:var(--ink)}
  .btn-ghost:hover{border-color:var(--copper)}
  .btn:disabled{opacity:.4;cursor:not-allowed}
  .fc-progress{font-family:'IBM Plex Mono';font-size:.84rem;color:var(--ink-soft);min-width:60px;text-align:center}

  /* ---------- QUIZ ---------- */
  .quiz-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    padding:30px;box-shadow:var(--shadow);max-width:720px;margin:0 auto}
  .quiz-meta{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;
    font-family:'IBM Plex Mono';font-size:.82rem;color:var(--ink-soft)}
  .scorepill{background:var(--greenbg);color:var(--green);font-weight:600;padding:4px 12px;border-radius:30px}
  .quiz-q{font-family:'Archivo';font-weight:700;font-size:1.28rem;line-height:1.3;margin-bottom:22px}
  .opt{display:block;width:100%;text-align:left;background:var(--paper);border:1.5px solid var(--line);
    border-radius:11px;padding:15px 18px;margin-bottom:11px;cursor:pointer;transition:.15s;font-size:.96rem;font-family:'IBM Plex Sans'}
  .opt:hover:not(.locked){border-color:var(--copper);background:#fdf7f1}
  .opt .ltr{font-family:'IBM Plex Mono';font-weight:600;color:var(--copper-d);margin-right:10px}
  .opt.correct{background:var(--greenbg);border-color:var(--green);color:#1e5631}
  .opt.wrong{background:var(--redbg);border-color:var(--red);color:#922}
  .opt.locked{cursor:default}
  .explain{margin-top:16px;background:#f4f6fb;border-left:4px solid var(--navy-2);border-radius:8px;
    padding:14px 16px;font-size:.92rem;color:var(--ink-soft);display:none}
  .explain.show{display:block;animation:fade .3s}
  .explain b{color:var(--ink)}
  .quiz-foot{display:flex;justify-content:space-between;align-items:center;margin-top:20px;gap:12px}
  .progbar{height:7px;background:var(--line);border-radius:10px;overflow:hidden;margin-bottom:22px}
  .progbar span{display:block;height:100%;background:linear-gradient(90deg,var(--copper),var(--amber));transition:.4s}
  .result{text-align:center;padding:20px}
  .result .big{font-family:'Archivo';font-weight:900;font-size:4rem;color:var(--copper)}
  .result h3{font-size:1.5rem;margin-bottom:8px}

  /* ---------- KEYWORD TRAINER ---------- */
  .kw-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    padding:30px;box-shadow:var(--shadow);max-width:760px;margin:0 auto}
  .kw-tag{font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--copper-d);font-weight:600;margin-bottom:12px}
  .kw-q{font-size:1.12rem;line-height:1.45;background:var(--paper);border-radius:11px;padding:20px;margin-bottom:8px}
  .kw-q .mark{background:var(--amber);border-radius:4px;padding:1px 4px;font-weight:600;box-shadow:0 1px 0 var(--amber-d)}
  .kw-step{border:1px solid var(--line);border-radius:12px;margin-top:14px;overflow:hidden}
  .kw-step-h{display:flex;align-items:center;gap:12px;padding:15px 18px;cursor:pointer;background:var(--card);transition:.15s}
  .kw-step-h:hover{background:#faf7f1}
  .kw-step-h .sn{font-family:'Archivo';font-weight:900;width:30px;height:30px;border-radius:8px;flex:none;
    display:grid;place-items:center;background:var(--navy);color:#fff;font-size:.85rem}
  .kw-step-h .st{font-family:'Archivo';font-weight:700;font-size:1rem;flex:1}
  .kw-step-h .chev{transition:.25s;color:var(--ink-soft)}
  .kw-step.open .chev{transform:rotate(90deg)}
  .kw-step-b{max-height:0;overflow:hidden;transition:max-height .35s ease;background:#faf8f3}
  .kw-step.open .kw-step-b{max-height:1000px}
  .kw-step-b .inner{padding:4px 18px 18px;font-size:.94rem;color:var(--ink-soft)}
  .kw-step-b .inner .reftag{font-family:'IBM Plex Mono';font-weight:600;color:#fff;background:var(--copper);padding:3px 10px;border-radius:6px;display:inline-block;margin-top:6px}
  .kwlist{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 4px}
  .kwlist span{background:var(--copper-soft);color:var(--copper-d);font-weight:600;font-size:.82rem;padding:4px 11px;border-radius:20px;font-family:'IBM Plex Mono'}

  /* ---------- EXAM SKILLS ---------- */
  .method-step{display:flex;gap:18px;margin-bottom:8px;background:var(--card);border:1px solid var(--line);
    border-radius:var(--radius);padding:22px 24px;box-shadow:var(--shadow);position:relative}
  .method-step .mn{font-family:'Archivo';font-weight:900;font-size:1.8rem;color:#fff;background:var(--copper);
    width:54px;height:54px;border-radius:13px;display:grid;place-items:center;flex:none}
  .method-step h3{font-size:1.12rem;margin-bottom:5px}
  .method-step p{font-size:.93rem;color:var(--ink-soft)}
  .arrow-down{text-align:center;color:var(--copper);font-size:1.4rem;margin:2px 0}
  .callout{background:#fff8e8;border:1px solid var(--amber);border-left:5px solid var(--amber-d);
    border-radius:12px;padding:18px 22px;margin:22px 0;font-size:.94rem}
  .callout b{color:var(--ink)}

  footer{text-align:center;padding:30px 20px;color:var(--ink-soft);font-size:.84rem;border-top:1px solid var(--line)}
  footer b{color:var(--copper-d);font-family:'Archivo'}
  .credit-badge{display:inline-flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);
    padding:7px 16px;border-radius:30px;box-shadow:var(--shadow);font-weight:600;font-size:.85rem;color:var(--ink)}

  .newtag{display:inline-block;background:var(--green);color:#fff;font-family:'IBM Plex Mono',monospace;
    font-size:.66rem;font-weight:600;letter-spacing:.06em;padding:2px 8px;border-radius:5px;margin-right:6px;
    vertical-align:middle;text-transform:uppercase}

/* ---------- PARTS, CHAPTERS & SECTIONS ---------- */
const PARTS = [
  {
    id: "p1", num: "1", title: "Scope, Object & Fundamental Principles",
    tag: "The 'why' of the regs",
    intro: "Part 1 sets the boundaries of the book — what BS 7671 applies to, what it leaves out, and the safety principles every other Part is built on. If a question asks whether the regs even apply to something, you start here.",
    chapters: [
      { num: "Chapter 11", title: "Scope",
        body: "Defines the installations BS 7671 covers — dwellings, commercial, industrial, agricultural, construction sites, caravans, marinas, low-voltage generating sets and more. Equally important is what it <em>excludes</em>: the distributor's equipment, railway traction, motor vehicles, ships, aircraft, mines/quarries, radio interference equipment and lightning protection of buildings (BS EN 62305). The book applies up to 1000V AC / 1500V DC.",
        regs: [
          {ref:"110.1.2", topic:"List of installations the regs apply to", detail:"Lists the installation types within scope: residential, commercial, public, industrial and agricultural premises, prefabricated buildings, caravans and caravan parks, construction sites, marinas, exhibitions, medical locations, mobile units, PV systems and LV generating sets. If your installation is one of these, BS 7671 applies. <b>Exam tip:</b> questions sometimes describe an unusual location (a marina, an exhibition stand) to test whether you know it's still covered — it usually is, and it'll have its own Part 7 section."},
          {ref:"110.2", topic:"Installations specifically EXCLUDED", detail:"Lists what BS 7671 does NOT cover: equipment on ships and aircraft, traction/railway systems, motor vehicles (except caravans), mines and quarries, radio interference suppression equipment, and the distributor's own network. <b>Why it matters:</b> if a question is about any of these, the answer is that BS 7671 does not apply — a common trap."},
          {ref:"110.1.3", topic:"Equipment/systems not covered", detail:"Clarifies that the distributor's equipment (the supply network up to and including the meter) and lightning protection systems of buildings (covered by BS EN 62305) fall outside the regs. The dividing line is the origin of the installation — generally the output terminals of the meter or the consumer's main switch."}
        ]},
      { num: "Chapter 12", title: "Object and Effects",
        body: "States that the regs exist to provide for the safety of persons, livestock and property against the dangers and damage that can arise from the use of electricity, and to ensure the installation functions correctly for its intended use.",
        regs: [{ref:"120.1", topic:"Object — safety of persons, livestock and property", detail:"The overarching purpose: protect people and animals from electric shock, burns and injury, and protect property from fire and thermal damage caused by an installation. Every specific requirement later in the book is a means to one of these ends — keep this in mind and most regulations make intuitive sense."}]},
      { num: "Chapter 13", title: "Fundamental Principles",
        body: "The backbone of the whole standard. Four broad requirements: <strong>protection for safety</strong> (Reg 131), <strong>design</strong> (132), <strong>selection of equipment</strong> (133) and <strong>erection & initial verification</strong> (134). If a topic isn't covered specifically elsewhere, Chapter 13 governs by general principle.",
        regs: [
          {ref:"131", topic:"Protection for safety — the general principles", detail:"Sets the headline safety aims that later Parts deliver in detail: protection against electric shock (basic + fault protection), against thermal effects (fire/burns), against overcurrent, against fault current, and against voltage disturbances. Think of 131 as the table of contents for Part 4."},
          {ref:"132", topic:"Design — load, supply, diversity, future expansion", detail:"Requires the design to take account of the characteristics of the supply, the maximum demand (allowing for diversity), the number and type of conductors, the earthing arrangements, and the need for future expansion. Good design starts here: you size everything around the assessed load, not guesswork."},
          {ref:"132.12", topic:"Maintainability", detail:"The installation must be designed so it can be safely inspected, tested and maintained throughout its life. In practice this means accessible joints, room to work at the board, isolation where needed, and durable labelling. <b>Exam tip:</b> 'maintainability' as a keyword points you straight here (and to 341)."},
          {ref:"133", topic:"Selection of equipment — suitable & to a standard", detail:"Every item of equipment must comply with the relevant British or Harmonised Standard (see Appendix 1) and be suitable for the conditions and the duty it will see. You can't just fit any device — it must be rated for the voltage, current, fault level and environment present."},
          {ref:"134", topic:"Erection and initial verification — good workmanship", detail:"Work must be carried out by skilled or instructed persons, using proper materials and good workmanship, and every new installation must be inspected and tested before being put into service. This links Part 1 directly to Part 6."}
        ]},
      { num: "Chapter 14", title: "Relationship & Compliance",
        body: "Confirms how BS 7671 sits alongside statutory law. Compliance with BS 7671 is one recognised way of meeting the legal duty to provide a safe installation under the Electricity at Work Regulations 1989.",
        regs: [{ref:"114", topic:"Relationship with statutory regulations", detail:"BS 7671 is a standard, not a law in itself, but conforming to it is regarded by the HSE as likely to satisfy the relevant parts of the Electricity at Work Regulations 1989 and the ESQCR. <b>Key point:</b> compliance with a British Standard cannot by itself confer immunity from legal obligations — the duty-holder still carries responsibility."}]}
    ]
  },
  {
    id: "p2", num: "2", title: "Definitions",
    tag: "What the words actually mean",
    intro: "Part 2 is the book's dictionary. The exam frequently turns on whether you know the precise BS 7671 meaning of a term. When a question hinges on a defined word, go straight to Part 2 — the definition often IS the answer.",
    chapters: [
      { num: "Part 2", title: "Key Definitions",
        body: "These are the definitions most often tested. Read each one until the distinction is automatic — many exam questions are really just asking 'do you know what this word means in BS 7671?'.",
        regs: [
          {ref:"Part 2", topic:"Basic protection vs fault protection", detail:"<b>Basic protection</b> stops you contacting live parts in normal use — insulation, barriers, enclosures (old term: 'protection against direct contact'). <b>Fault protection</b> protects you when a fault makes normally-dead metal live — chiefly automatic disconnection of supply (old term: 'protection against indirect contact'). Together they give the two layers of shock protection."},
          {ref:"Part 2", topic:"Exposed- vs extraneous-conductive-part", detail:"An <b>exposed-conductive-part</b> is metalwork that IS part of the installation and could become live under fault — e.g. a Class I appliance casing or a metal back-box. An <b>extraneous-conductive-part</b> is metalwork NOT part of the installation that can bring in a potential (usually earth) from elsewhere — e.g. a metal water or gas pipe, or structural steel. The distinction decides what gets bonded and what gets a CPC."},
          {ref:"Part 2", topic:"Skilled / instructed / ordinary person", detail:"A <b>skilled person (electrically)</b> has the knowledge and experience to perceive and avoid electrical dangers. An <b>instructed person</b> is adequately advised or supervised by a skilled person to do so. An <b>ordinary person</b> is neither. Some requirements relax where access is restricted to skilled/instructed persons only (e.g. switchrooms)."},
          {ref:"Part 2", topic:"SELV, PELV and FELV", detail:"<b>SELV</b> — extra-low voltage from a safety-isolating source, electrically separated from earth and from other circuits (no earth connection). <b>PELV</b> — the same, but one point may be earthed. <b>FELV</b> — functional ELV that does NOT meet all SELV/PELV requirements, so it still needs basic and fault protection appropriate to the primary voltage. Voltage band: ELV is ≤50V AC / ≤120V ripple-free DC."},
          {ref:"Part 2", topic:"Earthing conductor, CPC and bonding conductor", detail:"The <b>earthing conductor</b> connects the main earthing terminal to the means of earthing (electrode or supply earth). A <b>circuit protective conductor (CPC)</b> connects exposed-conductive-parts of a circuit back to the MET. A <b>protective bonding conductor</b> connects extraneous-conductive-parts together/to the MET to keep them at the same potential. Different jobs — don't mix them up."},
          {ref:"Part 2", topic:"Bidirectional protective device (new, A3:2024)", detail:"<span class='newtag'>A3:2024</span> A device the manufacturer intends to work with a supply connected to either side — or to both sets of terminals at once. Useful where power genuinely flows both ways, e.g. between a battery/PV inverter and the board. It can be wired either way round without losing its protective function."},
          {ref:"Part 2", topic:"Unidirectional protective device (new, A3:2024)", detail:"<span class='newtag'>A3:2024</span> A device the manufacturer intends to have the supply connected to ONE defined set of terminals only. Its 'line' and 'load' sides must be wired the correct way round — connect it backwards in a bidirectional installation and it may not protect correctly. This is why new Reg 530.3.201 requires you to check the device's marking."}
        ]}
    ]
  },
  {
    id: "p3", num: "3", title: "Assessment of General Characteristics",
    tag: "Survey before you design",
    intro: "Before designing anything you assess the supply, the loads, the earthing system and the external influences. Part 3 is where the earthing-system arrangements (TN-S, TN-C-S, TT, IT) live, plus maximum demand, maintainability and safety services.",
    chapters: [
      { num: "Chapter 31", title: "Purpose, Supplies & Structure",
        body: "Covers maximum demand and diversity, the number and type of live conductors, and the nature of the supply — its voltage, frequency, prospective fault current and the external earth fault loop impedance (Ze).",
        regs: [
          {ref:"311", topic:"Maximum demand and diversity", detail:"You must assess the maximum demand of the installation, applying diversity (the realistic fact that not every load runs at full power simultaneously). This sets the size of the supply, main switch, tails and distribution cables. Over-estimate and you waste money; under-estimate and you overload — diversity factors (see the On-Site Guide) help you land it right."},
          {ref:"313", topic:"Supply characteristics — voltage, frequency, Ipf, Ze", detail:"You need to know the nominal voltage (230V single-phase / 400V three-phase), frequency (50Hz), the prospective fault current at the origin, and the external loop impedance Ze. These come from the distributor or by measurement, and they drive your device breaking-capacity and disconnection-time calculations."}
        ]},
      { num: "Chapter 31 (312)", title: "Earthing Systems",
        body: "The system types are identified by two letters — the first is how the SUPPLY is earthed, the second is how the INSTALLATION's exposed-conductive-parts are earthed. Knowing these cold is essential because they decide your protection strategy and your Zs values.",
        regs: [
          {ref:"312.2", topic:"Types of system earthing — TN-S, TN-C-S, TT, IT", detail:"<b>TN-S</b>: separate neutral and protective conductors all the way; earth provided via the supply cable sheath — low Ze. <b>TN-C-S (PME)</b>: supply has a combined PEN conductor that splits into N and PE at the intake; most common in UK housing — very low Ze. <b>TT</b>: installation earthed only through its own electrode — high Ze, so RCDs are essential. <b>IT</b>: supply not earthed (or via high impedance) — rare, used in some medical/industrial settings. <b>Exam tip:</b> the system type changes the disconnection times and whether you can rely on the overcurrent device or must use an RCD."},
          {ref:"312.3", topic:"Types of live conductors", detail:"Defines the conductor arrangements — single-phase two-wire, three-phase three- or four-wire, etc. This affects cable selection, voltage-drop calculations and the choice of protective devices."}
        ]},
      { num: "Chapters 33–36", title: "Compatibility, Maintainability, Safety Services, Continuity",
        body: "Four short chapters flagging design considerations: equipment that could interfere with other equipment (33), how maintainable the installation needs to be (34), whether safety services are required (35), and whether continuity of supply is critical (36).",
        regs: [
          {ref:"331", topic:"Compatibility", detail:"Assess whether any equipment will produce harmful effects on other equipment or the supply — transients, harmonics, high starting (inrush) currents, DC, high-frequency, or earth leakage. Where it would, you take measures to prevent the interference (e.g. separate circuits, filters)."},
          {ref:"341", topic:"Maintainability", detail:"You must assess how often and how well the installation will be maintained, and design accordingly — including providing for safe isolation, access and the recommended interval to the next inspection. Links back to fundamental Reg 132.12."},
          {ref:"35", topic:"Safety services", detail:"Where life-safety systems are needed (emergency escape lighting, fire alarms, smoke control), Chapter 35 flags the requirement for a suitable independent source and circuits that keep working in a fire. The detailed selection is in Chapter 56 / Section 560."}
        ]}
    ]
  },
  {
    id: "p4", num: "4", title: "Protection for Safety",
    tag: "The heart of the exam",
    intro: "Part 4 is the most heavily examined Part. It covers protection against electric shock (Ch 41), thermal effects/fire (42), overcurrent (43), voltage and electromagnetic disturbances (44), and isolation/switching principles (46). If a question is about RCDs, disconnection times, AFDDs, SPDs, or simply 'how do we keep people safe', it's almost always Part 4.",
    chapters: [
      { num: "Chapter 41", title: "Protection Against Electric Shock",
        body: "The single most important chapter. Shock protection is delivered by a combination of <strong>basic protection</strong> (insulation, barriers, enclosures) and <strong>fault protection</strong>, the main method being <strong>Automatic Disconnection of Supply (ADS)</strong> in Section 411. ADS works by ensuring that, under an earth fault, enough current flows to operate the protective device fast enough to prevent a dangerous shock.",
        regs: [
          {ref:"411.3.2", topic:"Requirement for automatic disconnection", detail:"Under an earth fault, the protective device (fuse, MCB or RCD) must disconnect the circuit within the time given in Table 41.1. This relies on the earth fault loop impedance (Zs) being low enough that the fault current is high enough to trip the device in time — which is why you measure and verify Zs."},
          {ref:"411.3.3", topic:"Additional protection: 30mA RCD on socket-outlets ≤32A", detail:"Socket-outlets rated up to 32A must have additional protection by a 30mA RCD (in most premises), because sockets feed portable equipment and trailing leads that are easily damaged. The same applies to mobile equipment up to 32A used outdoors. 30mA is chosen because it disconnects before a shock becomes lethal. <b>Exam tip:</b> 'socket-outlet' is a strong keyword for this reg."},
          {ref:"411.3.4", topic:"30mA RCD on AC lighting circuits in dwellings (A2:2022)", detail:"<span class='newtag'>A2:2022</span> AC final circuits supplying luminaires in household (domestic) premises must have 30mA RCD additional protection. The reasoning: people change lamps and fittings live, and damaged lighting wiring is a real shock risk in homes."},
          {ref:"Table 41.1", topic:"Maximum disconnection times", detail:"The numbers you must memorise. For a 230V system: final circuits ≤32A must disconnect in <b>0.4s on TN</b> and <b>0.2s on TT</b>. Distribution circuits and final circuits >32A get <b>5s on TN</b> and <b>1s on TT</b>. TT times are shorter because the higher loop impedance makes ADS by overcurrent device unreliable — hence RCDs."},
          {ref:"414", topic:"SELV and PELV protective measures", detail:"Using extra-low voltage from a safety-isolating source as a protective measure. Because the voltage is so low (≤50V AC), and the circuit is separated, the risk of harmful shock is removed. Common in bathrooms (e.g. SELV shaver supplies) and in special locations. PELV is similar but may be earthed."},
          {ref:"415.1", topic:"Additional protection — 30mA RCD", detail:"Defines 'additional protection' by an RCD with a rated residual operating current not exceeding 30mA. It's a backup layer — it does not replace basic or fault protection, but catches the situations they miss (a child poking a wire, a damaged flex, a person becoming part of the fault path)."},
          {ref:"415.2", topic:"Additional protection — supplementary bonding", detail:"Connecting exposed- and extraneous-conductive-parts together so that, even during a fault, the voltage between two simultaneously-touchable parts stays safely low. Historically used heavily in bathrooms; now often omitted — but only where the <b>three conditions of 701.415.2</b> are all met: (1) the main protective bonding effectively connects every extraneous-conductive-part of the location back to the main earthing terminal; (2) all final circuits of the location satisfy the automatic disconnection times of Reg 411.3.2; and (3) every final circuit of the location has additional protection by a 30 mA RCD. All three must be verified together — omission is never automatic, and if any one fails, local supplementary bonding is still required."}
        ]},
      { num: "Chapter 42", title: "Protection Against Thermal Effects",
        body: "Protection against fire, burns and overheating caused by electrical equipment. The headline addition in recent amendments is the <strong>AFDD</strong> (Arc Fault Detection Device), which detects the signature of a dangerous arcing fault — a leading cause of electrical fires — and disconnects.",
        regs: [
          {ref:"421.1.7", topic:"AFDDs — required in higher-risk premises (A2:2022)", detail:"<span class='newtag'>A2:2022</span> AFDDs are <b>required</b> for single-phase AC socket-outlet final circuits up to 32A in Higher-Risk Residential Buildings (HRRBs), houses in multiple occupation (HMOs), purpose-built student accommodation and care homes — places where occupants are vulnerable or escape is harder. They are <b>recommended</b> elsewhere. An AFDD spots series/parallel arcing that fuses and RCDs miss."},
          {ref:"422", topic:"Locations with increased fire risk", detail:"Where external influences create a fire risk — combustible materials stored (BE2), flammable dust (BE3), or buildings of significant fire-spread risk (CA2) — extra wiring-system precautions apply, such as restricting cable types and providing better mechanical protection."},
          {ref:"422.3.1", topic:"Fire-risk locations — wiring requirements", detail:"In such locations, wiring systems must minimise the risk of fire spread — e.g. cables with improved fire performance, metallic conduit/trunking, and avoidance of cable types that propagate flame. RCD protection (300mA) is also commonly required to catch earth-leakage that could start a fire. <b>Why 300 mA, not 30 mA?</b> The two ratings do different jobs. A 30 mA RCD protects <em>people</em> from electric shock — set just below the level that causes the heart to fibrillate. A 300 mA RCD here is a <em>fire</em> measure: a sustained earth-leakage fault of a few hundred milliamps can heat surroundings enough to ignite combustible material, so 300 mA catches that developing fault. It is also set high enough to avoid nuisance tripping from the small standing leakage every installation has (filters, long runs, many loads each leaking a few mA). So 300 mA is for fire, 30 mA is for shock — and the 300 mA does <strong>not</strong> replace a 30 mA device where shock protection is also needed (e.g. socket-outlets); both are provided."},
          {ref:"423", topic:"Protection against burns", detail:"Touchable parts of equipment must not reach temperatures that would burn skin. The standard gives maximum surface-temperature limits depending on the material and whether the part is meant to be touched in normal use (e.g. a metal handle has a lower limit than a non-touchable enclosure)."}
        ]},
      { num: "Chapter 43", title: "Protection Against Overcurrent",
        body: "Overcurrent means too much current — either an <strong>overload</strong> (a healthy circuit asked to carry more than its design) or a <strong>fault current</strong> (a short-circuit or earth fault). The cable and its protective device must be coordinated so the cable never overheats before the device disconnects.",
        regs: [
          {ref:"433.1.1", topic:"Overload coordination — Ib ≤ In ≤ Iz and I2 ≤ 1.45 Iz", detail:"The golden rule of cable sizing. <b>Ib</b> (design current) ≤ <b>In</b> (device rating) ≤ <b>Iz</b> (the installed cable's current-carrying capacity after correction factors). Plus <b>I2 ≤ 1.45 × Iz</b>, where I2 is the current that reliably operates the device — for modern MCBs/fuses to BS EN standards this second condition is met automatically when the first is. Get Iz from Appendix 4 after applying Ca, Cg, Ci, Cf."},
          {ref:"434", topic:"Protection against fault current", detail:"The device must safely interrupt the maximum prospective fault current at its point of installation — so its breaking capacity (kA rating) must be ≥ the prospective fault current there. It must also disconnect fast enough that the cable's conductors don't exceed their limiting temperature, checked by the adiabatic equation."},
          {ref:"434.5.2", topic:"Adiabatic equation — S = √(I²t)/k", detail:"Used to confirm a conductor (often the CPC) is big enough to survive the heat of a fault before disconnection. <b>S</b> = minimum CSA (mm²), <b>I</b> = fault current (A), <b>t</b> = disconnection time (s), <b>k</b> = a constant for the conductor material/insulation (from the tables in Ch 54). If the calculated S is larger than the conductor you've used, you need a bigger conductor or faster disconnection."},
          {ref:"435", topic:"Coordination of overload and fault protection", detail:"Where a single device provides both overload and fault protection it must satisfy both sets of rules. Where separate devices are used (e.g. overload at the load, fault at the origin), Chapter 43 sets out how they must work together so there's no gap in protection."},
          {ref:"433.3.1", topic:"Where overload protection may be omitted", detail:"Overload protection isn't always required — e.g. on a circuit that can't be overloaded (a fixed resistive load) or where omitting it is safer than the risk of unexpected disconnection (some safety circuits). The reg lists the specific permitted cases; don't assume — check the conditions."}
        ]},
      { num: "Chapter 44", title: "Voltage & Electromagnetic Disturbances",
        body: "Protection against overvoltages — both transient (lightning, switching surges) and from supply faults — and against electromagnetic interference. The practical focus is <strong>Surge Protective Devices (SPDs)</strong>.",
        regs: [
          {ref:"443.4", topic:"When transient overvoltage protection is required", detail:"<span class='newtag'>A2:2022</span> Protection (an SPD) must be provided where a transient overvoltage could cause: serious injury or loss of human life; interruption of public services or damage to cultural heritage; interruption of commercial/industrial activity; or affect large numbers of co-located people. For most dwellings the practical outcome is that an SPD is fitted."},
          {ref:"443.5", topic:"Risk assessment (CRL) for SPD requirement", detail:"Where the consequence isn't one of the mandatory cases, you either carry out the calculated risk-level (CRL) assessment in the standard, or simply fit an SPD anyway (often cheaper than doing the assessment). If the assessment shows the risk is acceptable, an SPD may be omitted — but you must record the justification."},
          {ref:"444", topic:"Electromagnetic disturbances (EMC)", detail:"Measures to reduce electromagnetic interference between systems — e.g. segregating power and data cabling, choosing wiring topologies (meshed/star earthing) that limit interference, and bonding to control common-mode currents. Increasingly relevant with sensitive electronics and data systems."},
          {ref:"534", topic:"Selection and erection of SPDs (cross-ref)", detail:"Once 443 says you need an SPD, Section 534 tells you how to choose and install it — the type (Type 1 for direct-strike risk, Type 2 for general, Type 3 at sensitive equipment), the voltage protection level, and connecting-conductor lengths (keep them short — ideally ≤0.5m total — or the protection is undermined)."}
        ]},
      { num: "Chapter 46", title: "Isolation & Switching (principles)",
        body: "A reinstated chapter setting out the four switching functions an installation must provide for. The detailed device selection lives in Section 537.",
        regs: [
          {ref:"462", topic:"Isolation", detail:"Every circuit must be capable of being securely isolated (cut off from every source of supply) for safe working. Isolation must be secure against inadvertent reclosure — hence lockable devices and 'safe isolation' procedures. The means of isolation must have a visible gap or reliable position indication."},
          {ref:"463", topic:"Switching off for mechanical maintenance", detail:"Where mechanical maintenance could involve a risk of injury (e.g. servicing a motor or fan), a means of switching off must be provided and kept under the control of the person doing the work, so the equipment can't be started unexpectedly."},
          {ref:"465", topic:"Emergency switching / stopping", detail:"Where a hazard could arise, a means of rapidly cutting the supply must be provided — readily accessible and clearly identified (e.g. a red mushroom-head stop). Emergency switching removes a dangerous electrical condition; emergency stopping also stops dangerous mechanical movement."}
        ]}
    ]
  },
  {
    id: "p5", num: "5", title: "Selection & Erection of Equipment",
    tag: "Choosing and installing kit",
    intro: "Part 5 is about choosing the right equipment and installing it correctly — cable sizing, wiring methods, protective devices, earthing and bonding, accessories and luminaires. Questions about cable colours, RCD types, CPC sizing, main bonding sizes and 'how deep can a cable be buried in a wall' live here.",
    chapters: [
      { num: "Chapter 51", title: "Common Rules & Identification",
        body: "General rules for selecting and installing equipment, plus identification and notices (Section 514). Equipment must suit the external influences it will face — moisture, dust, temperature, mechanical impact, all classified by the AD/AE/BE codes in Section 512.",
        regs: [
          {ref:"514", topic:"Identification of conductors and notices", detail:"Conductors and circuits must be identifiable, and the correct safety notices fitted. UK harmonised colours: <b>line = brown</b>, <b>neutral = blue</b>, <b>CPC = green-and-yellow</b>; three-phase lines are brown/black/grey (L1/L2/L3). Mislabelling is a common real-world danger and an easy exam mark."},
          {ref:"514.9", topic:"Diagrams, charts and tables at the origin", detail:"A durable schedule/diagram must be provided at the origin showing the circuits, their protective devices, the type of wiring and the testing required. On a domestic board this is the circuit chart inside the consumer unit cover."},
          {ref:"514.12.1", topic:"Notice — periodic inspection and testing", detail:"A notice must be fixed at the origin stating the date of the last inspection and the recommended date for the next. It's how the next person knows when the installation is due for an EICR."},
          {ref:"514.12.2", topic:"Notice — RCD quarterly test", detail:"Where an RCD is fitted, a notice must tell the user to operate the test button quarterly to confirm the RCD still works. RCDs are mechanical and can seize — the test button is the user's check."},
          {ref:"512.2", topic:"External influences — classification codes", detail:"Equipment must be selected to withstand the conditions of its location, classified by codes for environment (AD water, AE foreign bodies), utilisation (BA skill of persons) and building construction (CA materials). The IP rating you choose follows directly from the AD/AE codes."}
        ]},
      { num: "Chapter 52", title: "Selection & Erection of Wiring Systems",
        body: "How cables and wiring systems are chosen and installed — current-carrying capacity, voltage drop, and protection from heat, water, corrosion and (importantly) mechanical damage and concealment in walls.",
        regs: [
          {ref:"522.6.202", topic:"Cables in walls <50mm deep — 30mA RCD", detail:"A cable concealed in a wall/partition at less than 50mm depth, that isn't mechanically protected and isn't run in a recognised 'safe zone', must have 30mA RCD additional protection. The danger is someone drilling or nailing into a hidden cable. <b>Exam tip:</b> 'cable in a wall' + 'depth' is a classic trigger — check zone, depth, protection and RCD."},
          {ref:"522.6.203", topic:"Cables in metal-framed partitions", detail:"Where a cable is run in a partition with metallic parts (e.g. metal studs), 30mA RCD protection is required regardless of depth, because the metal framing itself can damage the cable and become live. Often caught out in modern commercial fit-outs."},
          {ref:"522.8.10", topic:"Wiring support — must not collapse in fire", detail:"Wiring must be supported so it can't prematurely collapse and either trap escaping occupants or hamper firefighters — the 'death by cable' rule introduced after firefighters were entangled by failed plastic clips. Use metal clips/supports for cables on escape routes and surface runs, not plastic-only fixings."},
          {ref:"523", topic:"Current-carrying capacity", detail:"The current a cable can carry continuously without exceeding its temperature limit, found in Appendix 4 for the installation method, then corrected for ambient temperature (Ca), grouping (Cg), thermal insulation (Ci) and any BS 3036 rewireable fuse (Cf). This gives Iz for the Ib ≤ In ≤ Iz check."},
          {ref:"525", topic:"Voltage drop", detail:"Voltage drop from the origin to the furthest point must stay within limits so equipment works correctly — typically <b>3% for lighting</b> and <b>5% for other uses</b> of the 230V nominal (i.e. about 6.9V and 11.5V). Long runs often fail on voltage drop before they fail on current capacity — calculate using the mV/A/m figures in Appendix 4."}
        ]},
      { num: "Chapter 53", title: "Protection, Isolation, Switching, Control & Monitoring",
        body: "Selection of the protective devices and switchgear themselves. Section 531 covers RCD selection; 537 covers isolation and switching devices. Amendment 3:2024 adds the requirement to consider a device's direction of supply.",
        regs: [
          {ref:"530.3.201", topic:"Unidirectional vs bidirectional devices (new, A3:2024)", detail:"<span class='newtag'>A3:2024</span> When selecting and installing a protective device you must take account of whether it is unidirectional or bidirectional. Critical in installations where power can flow both ways — solar PV, battery storage, EV vehicle-to-grid — because a unidirectional device wired the wrong way round may fail to protect. Check the device marking (line/load, in/out, or arrows)."},
          {ref:"531.3.3", topic:"Selection of RCD type (AC / A / F / B)", detail:"RCDs must suit the earth-fault current waveform the circuit can produce. <b>Type AC</b>: only smooth AC (now rarely adequate alone). <b>Type A</b>: AC plus pulsating DC — the modern general default. <b>Type F</b>: adds mixed frequencies (some appliances). <b>Type B</b>: adds smooth DC — needed for many EV chargers and inverters. Pick the type from the connected load, not habit."},
          {ref:"537", topic:"Isolation and switching devices", detail:"Specifies what equipment can serve as a means of isolation, switching off for maintenance, emergency switching, or functional switching, and the requirements each must meet (e.g. contact gap, position indication, ability to be secured off)."},
          {ref:"537.2.2", topic:"Devices for isolation — requirements", detail:"A device used for isolation must reliably cut off all live supply conductors, give a clear indication of the off position (or a visible gap), and be secure against unintended or unauthorised reclosure. A plug and socket can serve as isolation for a single item of equipment."},
          {ref:"536", topic:"Coordination / selectivity of devices", detail:"Where devices are in series (e.g. a main switch-fuse upstream of a final-circuit MCB), they should be coordinated so a downstream fault trips only the nearest device, not the whole board — 'discrimination' or 'selectivity'. This keeps the maximum amount of the installation running during a fault."},
          {ref:"531.3.2 / 536.4", topic:"RCD discrimination — Type S upstream + 30 mA downstream", detail:"Where two RCDs sit in series — for example a <b>300 mA</b> device at the origin of a fire-risk or difficult-evacuation location and a <b>30 mA</b> device on each final circuit — they must <em>discriminate</em> so a downstream earth fault trips only the local 30 mA, leaving the rest of the installation live. Two conditions are needed: <b>current grading</b> (upstream rating well above downstream — 300 mA to 30 mA is 10×, comfortable) and <b>time grading</b> (the upstream RCD must be <b>Type S</b>, time-delayed). A plain instantaneous 300 mA can trip at the same instant as the 30 mA on a large fault, so the correct arrangement is <strong>300 mA Type S upstream + 30 mA instantaneous locally</strong>. This matters most where evacuation is difficult (care homes, hospitals — external influence BD2/BD3): one bedroom-socket earth fault must not plunge a whole wing into darkness or disable lighting. Critical safety services (fire alarm, emergency lighting, nurse-call) are usually kept off the RCD-protected general arrangement entirely, so an RCD trip can never disable them."}
        ]},
      { num: "Chapter 54", title: "Earthing Arrangements & Protective Conductors",
        body: "How the installation is connected to earth, and how protective conductors and bonding are sized. Get the earthing and bonding right and ADS works; get it wrong and exposed metal can stay dangerously live during a fault.",
        regs: [
          {ref:"542.1.201", topic:"Main earthing terminal (MET)", detail:"Every installation must have a main earthing terminal where the earthing conductor, the main protective bonding conductors and the CPCs all come together. It's the single reference point for the whole installation's earthing — and the place you'll connect your test instruments."},
          {ref:"543.1", topic:"Minimum CSA of protective conductors", detail:"A CPC is sized either by <b>selection</b> (Table 54.7 — for a line conductor up to 16mm², the CPC matches it; above that, half, subject to minima) or by <b>calculation</b> using the adiabatic equation. Calculation often allows a smaller, cheaper CPC but you must prove it survives the fault energy."},
          {ref:"Table 54.7", topic:"CPC size by selection", detail:"The quick method: if the line conductor S ≤ 16mm², CPC = S. If 16 < S ≤ 35mm², CPC = 16mm². If S > 35mm², CPC = S/2. Conservative but fast — use it unless you need the smaller size that calculation gives."},
          {ref:"544.1.1", topic:"Main protective bonding conductor sizing", detail:"Main bonding connects incoming metallic services (water, gas, oil, structural steel) to the MET so they can't introduce a dangerous potential difference. Minimum <b>6mm²</b> for non-PME systems; for PME (TN-C-S) it's sized from Table 54.8 against the supply neutral. <b>Exam tip:</b> 'bonding' + 'PME/gas/water' points here."},
          {ref:"Table 54.8", topic:"Main bonding CSA for PME (TN-C-S)", detail:"For PME supplies the main bonding must be larger because the PEN carries normal current and an open-PEN fault is dangerous. Typical values: <b>10mm²</b> for a supply neutral up to 35mm², 16mm² up to 50mm², rising with the supply. Always check the actual neutral size."},
          {ref:"544.2", topic:"Supplementary bonding conductors", detail:"Local bonding that ties exposed- and extraneous-conductive-parts together within a location (historically bathrooms). Minimum sizes are given (e.g. 4mm² unprotected, 2.5mm² if mechanically protected). Often now omittable in bathrooms under 701.415.2."}

          {ref:"559.4.1", topic:"Luminaires — protection against thermal effects", detail:"Luminaires must be installed so the heat they produce can't ignite nearby materials — respecting minimum distances to combustibles, using fire-rated downlight covers in ceilings, and heeding the manufacturer's spacing-to-combustible markings."}

          {ref:"560.8", topic:"Wiring systems for safety services — fire resistance", detail:"Cables for safety services on which continued operation depends must maintain circuit integrity in a fire for the required period — using fire-resistant cable (e.g. to BS EN/BS 8434/8491) and fire-rated supports, so the alarm or escape lighting keeps working while people get out."}

  {

    tag: "Proving it's safe",
    intro: "Part 6 was restructured in the 18th Edition. It covers initial verification of a new installation (Chapter 64) and periodic inspection and testing of an existing one (Chapter 65), plus the certificates and reports. Questions on the test sequence, EICR codes (C1/C2/C3/FI) and which certificate to issue all live here.",
    chapters: [
      { num: "Chapter 64", title: "Initial Verification",
        body: "Before a new installation (or addition) is energised and handed over it must be inspected (dead) and then tested. Inspection comes first — you look before you test. The tests follow a defined sequence so that an early result doesn't make a later test dangerous.",
        regs: [
          {ref:"641.1", topic:"Initial verification required", detail:"Every new installation, and every addition or alteration, must be verified by inspection and testing during erection and on completion, before being put into service — and compared against the design criteria. You can't certify what you haven't verified."},
          {ref:"643", topic:"Testing — sequence and methods", detail:"The recommended sequence (dead tests first): continuity of protective conductors → continuity of ring final conductors → insulation resistance → polarity (dead). Then, energised: earth electrode resistance (if any) → earth fault loop impedance Zs → prospective fault current → RCD operation → functional checks. Order matters for safety."},
          {ref:"643.2", topic:"Continuity of conductors", detail:"Confirms protective conductors (CPCs and bonding) are continuous and correctly connected, and verifies ring final circuits are actually rings (no break, no interconnection) using the three-step r1/rn/r2 method. A broken CPC means no fault protection — this is why it's tested first."},
          {ref:"643.3", topic:"Insulation resistance", detail:"Confirms the insulation between live conductors, and between live conductors and earth, is sound — typically tested at 500V DC for a 230/400V installation, with a minimum acceptable value of 1MΩ (though a healthy installation reads far higher). Low readings reveal damaged or damp insulation before it causes a fault."},
          {ref:"643.7", topic:"Earth fault loop impedance (Zs)", detail:"Measures the total impedance of the earth fault loop at a point in the circuit. The measured Zs must be low enough that, with the protective device used, disconnection happens within the Table 41.1 time. Compare your measured Zs to the maximum Zs for that device — this is the live test that proves ADS works."},
          {ref:"644", topic:"Certification — EIC / MEIWC", detail:"On satisfactory completion you issue an Electrical Installation Certificate (EIC) for a new installation or new circuit, or a Minor Electrical Installation Works Certificate (MEIWC) for an addition/alteration that doesn't include a new circuit. The certificate plus schedules is the legal record that the work is safe."}

          {ref:"653", topic:"Electrical Installation Condition Report (EICR)", detail:"The report recording the inspection, the test results, and any observations with classification codes. The overall outcome is <b>Satisfactory</b> or <b>Unsatisfactory</b> — and any C1, C2 or FI makes it Unsatisfactory, meaning remedial work is needed."},
          {ref:"Appx 6", topic:"Model forms — EIC, MEIWC, EICR", detail:"Appendix 6 gives the model certificates and the schedules of inspections and test results. The coding to remember: <b>C1</b> danger present (immediate action), <b>C2</b> potentially dangerous (urgent action), <b>C3</b> improvement recommended (not a fail), <b>FI</b> further investigation required."}

  {

    intro: "Part 7 modifies and adds to the general rules for specific locations — bathrooms, swimming pools, construction sites, caravans, medical locations, EV charging and more. A Part 7 section ALWAYS takes priority over the general requirements for that location. Section numbers run 701–753, and the last three digits often mirror the general regulation they modify.",
    chapters: [
      { num: "Section 701", title: "Bathrooms & Shower Rooms",

        regs: [
          {ref:"701.32", topic:"Classification of zones (0, 1, 2)", detail:"<b>Zone 0</b> — inside the bath tub or shower basin (the wettest place). <b>Zone 1</b> — directly above Zone 0 up to 2.25m. <b>Zone 2</b> — the 0.6m-wide band horizontally beyond Zone 1. Each zone limits what equipment may be installed and its minimum IP rating. Beyond Zone 2, normal rules largely apply."},
          {ref:"701.411.3.3", topic:"30mA RCD for circuits in the location", detail:"All circuits serving the bathroom (and any circuit passing through the zones) must have 30mA RCD additional protection — the wet environment dramatically lowers body resistance, so the extra layer is essential."},
          {ref:"701.415.2", topic:"Supplementary bonding (and when it may be omitted)", detail:"Supplementary bonding of extraneous-conductive-parts may be <b>omitted</b> if ALL of: main protective bonding is in place; all circuits meet the Section 411 disconnection times; and all circuits have 30mA RCD protection. Modern bathrooms with RCD protection and good main bonding usually qualify — but you must confirm all three conditions, not assume."},
          {ref:"701.512.3", topic:"IP ratings by zone", detail:"Minimum ingress protection: <b>Zone 0 — IPX7</b> (immersion); <b>Zones 1 and 2 — IPX4</b> (splashing), rising to <b>IPX5</b> where water jets are used for cleaning (e.g. communal showers). Pick equipment rated at least to the zone it sits in."},
          {ref:"701.55", topic:"Equipment permitted in zones", detail:"What may be installed where — e.g. only SELV (≤12V AC/30V DC, source outside zones 0/1) or fixed permanently-connected equipment suitable for the zone; socket-outlets are generally prohibited within 3m of zone 1 (except SELV and shaver units to BS EN 61558-2-5)."}

        regs: [

          {ref:"705.411.1", topic:"Agricultural — disconnection & RCD", detail:"Livestock are far more sensitive to electric shock than people, so disconnection times and RCD requirements are stricter — socket circuits up to 32A need 30mA RCDs, other circuits up to 300mA RCDs, and supplementary bonding is used to protect animals from even small potential differences."},
          {ref:"705.422", topic:"Fire risk in agricultural premises", detail:"Barns store hay, feed and bedding — all highly combustible — so additional RCD protection (typically 300mA) is required to catch earth-leakage that could start a fire, along with suitable IP-rated, dust- and corrosion-resistant equipment."}

          {ref:"704.511", topic:"Construction site — equipment robustness", detail:"Equipment must withstand the mechanical knocks, water and dust of a site — typically a minimum IP44, impact-resistant enclosures, and assemblies (ACS units) built to BS EN 60439-4 / 61439-4."},
          {ref:"706.410.3", topic:"Restricted conductive locations — SELV/separation", detail:"In a conducting location with restricted movement (inside a metal tank or boiler) body contact with earthed metal is almost guaranteed, so supplies must be SELV, or by electrical separation with the source OUTSIDE the location, giving the strongest possible shock protection."}

          {ref:"721.411", topic:"Caravan — automatic disconnection", detail:"The caravan's own installation uses flexible wiring suited to movement and vibration, with ADS, 30mA RCD protection, and clear notices about connecting/disconnecting the supply and the earthing arrangement."}

          {ref:"710.413", topic:"Medical IT system (Group 2)", detail:"Group 2 locations (operating theatres, intensive care) use a <b>medical IT system</b> — an unearthed supply with insulation monitoring — so that a first earth fault does NOT cause disconnection or a dangerous current, keeping life-support equipment running while the fault is flagged for attention."},

      { num: "Section 712", title: "Solar Photovoltaic (PV) Systems",
