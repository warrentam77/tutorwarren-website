  {topic:"Part 2", q:"Define an 'extraneous-conductive-part'.", a:"A conductive part that is NOT part of the electrical installation but is liable to introduce a potential (generally earth potential) — e.g. metal water/gas pipes, structural steelwork. Contrast with an exposed-conductive-part, which IS part of the installation."},
  {topic:"Part 2", q:"What is a 'skilled person (electrically)' versus an 'instructed person'?", a:"A skilled person has the technical knowledge and experience to perceive and avoid electrical dangers. An instructed person is instructed or supervised by a skilled person to avoid those dangers."},
  {topic:"Part 2", q:"What is the difference between SELV and PELV?", a:"Both are extra-low-voltage from a safety-isolating source with simple separation from higher-voltage circuits. SELV is NOT earthed; PELV may be earthed (one point connected to earth). FELV is functional ELV that does not meet the requirements for SELV/PELV."},
  {topic:"Part 3", q:"Identify the four system earthing arrangements and their key feature.", a:"TN-S: separate N and PE throughout. TN-C-S (PME): combined PEN at the supply, separated in the installation. TT: installation earthed via its own electrode (high Ze, relies on RCDs). IT: source unearthed or earthed via high impedance."},
  {topic:"Part 3", q:"Why does a TT system almost always rely on RCDs for fault protection?", a:"Because the earth fault loop impedance (via an earth electrode) is too high to guarantee an overcurrent device will disconnect within the required time, so a 30mA/100mA RCD provides the disconnection instead."},
  {topic:"Part 4", q:"State the maximum disconnection times for a 230V final circuit ≤32A on TN and on TT systems.", a:"TN: 0.4 seconds. TT: 0.2 seconds. (For distribution circuits and final circuits >32A: 5s on TN, 1s on TT — Table 41.1.)"},
  {topic:"Part 4", q:"List the circuits that require 30mA RCD additional protection under the 18th Edition.", a:"Socket-outlets rated ≤32A (411.3.3), mobile equipment ≤32A used outdoors, AC lighting final circuits in dwellings (411.3.4, A2:2022), and cables concealed in walls at <50mm depth (522.6.202)."},
  {topic:"Part 4", q:"When are AFDDs required by A2:2022?", a:"For single-phase AC final circuits supplying socket-outlets up to 32A in higher-risk premises — Higher-Risk Residential Buildings, houses in multiple occupation, purpose-built student accommodation and care homes (421.1.7). Recommended for other premises."},
  {topic:"Part 4", q:"What is the overload coordination rule and the I2 condition?", a:"Ib ≤ In ≤ Iz (design current ≤ device nominal rating ≤ cable current-carrying capacity), and I2 ≤ 1.45 × Iz (the fusing/tripping current must not exceed 1.45 times the cable capacity). Reg 433.1.1."},
  {topic:"Part 4", q:"Write out the adiabatic equation and say what it checks.", a:"S = √(I² t) / k. It checks that a conductor's cross-sectional area is large enough to withstand the thermal energy of a fault until the protective device disconnects, without exceeding its limiting temperature. Reg 434.5.2."},
  {topic:"Part 4", q:"In A2:2022, when must protection against transient overvoltage (an SPD) be provided?", a:"Where the consequence of overvoltage could result in serious injury/loss of life, interruption of public services, damage to cultural heritage, interruption of commercial/industrial activity, or affect a large number of co-located people. Otherwise a risk assessment (or simply fitting an SPD) decides — Section 443."},
  {topic:"Part 5", q:"State the UK harmonised colours for line, neutral and CPC.", a:"Line = brown, Neutral = blue, Circuit Protective Conductor (CPC) = green-and-yellow. (Three-phase: brown / black / grey for L1/L2/L3.)"},
  {topic:"Part 5", q:"A cable is buried 30mm deep in a plastered wall with no mechanical protection and not in a permitted zone. What's required?", a:"30mA RCD additional protection for that circuit (Reg 522.6.202), because it is less than 50mm deep, not mechanically protected, and not within a recognised safe zone."},
  {topic:"Part 5", q:"How is the minimum size of a main protective bonding conductor decided on a PME (TN-C-S) supply?", a:"From Table 54.8, based on the supply neutral conductor CSA — commonly 10mm² where the supply neutral is up to 35mm². For non-PME systems the minimum is generally 6mm² (Reg 544.1.1)."},
  {topic:"Part 5", q:"Which RCD types are suitable where DC fault currents may occur (e.g. EV chargers)?", a:"Type A copes with pulsating DC; Type F adds mixed frequencies; Type B handles smooth DC. EV charge points need protection against DC faults — either a Type B RCD or a Type A RCD plus 6mA DC fault detection within the charger (Reg 531.3.3 / 722)."},
  {topic:"Part 6", q:"State the correct sequence of dead tests for initial verification.", a:"Continuity of protective conductors (and ring final circuit conductors) → insulation resistance → polarity (dead). Then live tests: earth electrode resistance, earth fault loop impedance (Zs), prospective fault current and RCD operation."},
  {topic:"Part 6", q:"What do the EICR classification codes C1, C2, C3 and FI mean?", a:"C1 = danger present, risk of injury, immediate action required. C2 = potentially dangerous, urgent remedial action required. C3 = improvement recommended (not a fail). FI = further investigation required. A C1, C2 or FI makes the report Unsatisfactory."},
  {topic:"Part 6", q:"Which certificate is issued for adding a single socket-outlet to an existing circuit?", a:"A Minor Electrical Installation Works Certificate (MEIWC) — used for additions/alterations that do not include a new circuit. A new circuit requires an Electrical Installation Certificate (EIC)."},
  {topic:"Part 7", q:"Describe the bathroom zones 0, 1 and 2.", a:"Zone 0: the interior of the bath tub or shower basin. Zone 1: above zone 0 up to 2.25m. Zone 2: the 0.6m wide space horizontally adjacent to zone 1. Each zone has IP rating and equipment restrictions (Section 701)."},
  {topic:"Part 7", q:"When may supplementary bonding be omitted in a bathroom?", a:"When all of the following are met: main protective bonding is in place, all circuits satisfy the disconnection times of 411, and all extraneous-conductive-parts are connected to the main earthing terminal (Reg 701.415.2)."},
  {topic:"Part 7", q:"Why is PME (TN-C-S) earthing generally not used for an EV charge point installed outdoors or for a caravan pitch?", a:"Because an open PEN conductor fault could raise the earthed metalwork (and the vehicle/caravan) to a dangerous potential. An earth electrode, or a device that disconnects on open-PEN/voltage detection, is used instead (722.411.4 / 708.411.4)."},
  {topic:"Part 7", q:"What protection does each EV charging point generally require?", a:"Its own 30mA RCD, plus protection against DC fault current — typically a Type B RCD, or a Type A RCD combined with 6mA DC fault detection built into the charging equipment (Section 722)."},
  {topic:"Part 8", q:"What is a 'prosumer's installation' and which Part covers it?", a:"An installation that both consumes and produces/stores electrical energy (e.g. solar PV + battery + EV). It is covered by Part 8, Chapter 82, working alongside Appendix 17 (Energy Efficiency)."},
  {topic:"Appendices", q:"Which appendix holds the cable current-carrying capacities and the correction factors Ca, Cg, Ci?", a:"Appendix 4 — current-carrying capacity and voltage drop, including ambient temperature (Ca), grouping (Cg), thermal insulation (Ci) and BS 3036 fuse (Cf) correction factors."},
  {topic:"Appendices", q:"Which appendix gives the time/current trip curves for MCBs and RCDs?", a:"Appendix 3 — time/current characteristics of overcurrent protective devices and RCDs."},
  {topic:"Appendices", q:"Where do you find the model Electrical Installation Certificate and EICR?", a:"Appendix 6 — model forms for certification and reporting, including the schedules of inspections and test results."}
];

/* ---------- MULTIPLE CHOICE QUESTIONS ---------- */
const MCQS = [
  {topic:"Part 5", q:"Amendment 3:2024 added Regulation 530.3.201. What does it require designers and installers to take account of?", options:["The IP rating of every accessory","Whether a protective device is unidirectional or bidirectional","The colour coding of all conductors","The ambient temperature of the consumer unit"], correct:1, explain:"Reg 530.3.201 (new in A3:2024) requires the appropriate use of unidirectional vs bidirectional protective devices — important where power can flow both ways (PV, storage, EV V2G)."},
  {topic:"Part 2", q:"A protective device the manufacturer intends to have the supply connected to one defined set of terminals only is termed:", options:["A bidirectional protective device","A unidirectional protective device","An omnidirectional device","A reversible device"], correct:1, explain:"That is a unidirectional protective device (Part 2, added by A3:2024). A bidirectional device can have supply on either or both sets of terminals."},
  {topic:"Part 1", q:"BS 7671 specifically does NOT apply to which of the following?", options:["A domestic dwelling","A construction site","Equipment on board a ship","A caravan park"], correct:2, explain:"Reg 110.2 excludes ships, aircraft, traction, mines/quarries and motor vehicles. The others are all within scope (110.1.2)."},
  {topic:"Part 1", q:"Which regulation group sets out the fundamental design requirements such as load assessment and diversity?", options:["Reg 131","Reg 132","Reg 133","Reg 134"], correct:1, explain:"Reg 132 covers design. 131 is protection for safety, 133 is selection of equipment, 134 is erection and initial verification."},
  {topic:"Part 2", q:"A metal water pipe entering a building from outside is best described as:", options:["An exposed-conductive-part","An extraneous-conductive-part","A protective conductor","A live part"], correct:1, explain:"It is not part of the installation but can introduce earth potential — the definition of an extraneous-conductive-part (Part 2)."},
  {topic:"Part 2", q:"A SELV system differs from a PELV system because SELV:", options:["Is always 12V","Is not connected to earth","Uses no transformer","Is only for bathrooms"], correct:1, explain:"SELV has no connection to earth; PELV may have one point earthed. Both use a safety-isolating source (Part 2 / Section 414)."},
  {topic:"Part 3", q:"In a TN-C-S (PME) system, the neutral and protective functions are:", options:["Always separate","Combined throughout","Combined in the supply, separated in the installation","Never connected"], correct:2, explain:"PME combines them as a PEN conductor at the supply, splitting into separate N and PE within the installation (Reg 312.2)."},
  {topic:"Part 3", q:"Which earthing system relies on its own earth electrode and typically requires RCD protection?", options:["TN-S","TN-C-S","TT","IT"], correct:2, explain:"TT uses a local earth electrode; the high loop impedance means an RCD is normally needed to achieve disconnection."},
  {topic:"Part 4", q:"The maximum disconnection time for a 230V, 32A final circuit on a TN system is:", options:["0.2s","0.4s","1s","5s"], correct:1, explain:"Table 41.1: final circuits up to 32A on TN systems must disconnect within 0.4s. (TT would be 0.2s.)"},
  {topic:"Part 4", q:"Which circuit does NOT explicitly require 30mA RCD additional protection under A2:2022?", options:["Socket-outlets rated ≤32A","A lighting circuit in a dwelling","A dedicated 45A cooker circuit on a surface-run cable in safe zones","Cables buried <50mm in a wall"], correct:2, explain:"A surface/safe-zone cooker circuit isn't automatically caught. Sockets ≤32A (411.3.3), dwelling lighting (411.3.4) and shallow concealed cables (522.6.202) all require a 30mA RCD."},
  {topic:"Part 4", q:"AFDDs are REQUIRED by A2:2022 for socket-outlet circuits ≤32A in:", options:["All domestic premises","Higher-Risk Residential Buildings, HMOs, student accommodation and care homes","Industrial units only","Outdoor installations only"], correct:1, explain:"Reg 421.1.7 requires AFDDs in those higher-risk premises and recommends them elsewhere."},
  {topic:"Part 4", q:"The correct overload coordination relationship is:", options:["Iz ≤ In ≤ Ib","In ≤ Ib ≤ Iz","Ib ≤ In ≤ Iz","Ib ≤ Iz ≤ In"], correct:2, explain:"Design current ≤ device rating ≤ cable capacity: Ib ≤ In ≤ Iz (Reg 433.1.1)."},
  {topic:"Part 4", q:"The adiabatic equation S = √(I²t)/k is used to:", options:["Calculate voltage drop","Verify a conductor withstands fault energy","Size a main bonding conductor by table","Set the RCD rating"], correct:1, explain:"It confirms the conductor CSA survives the let-through energy of a fault before disconnection (Reg 434.5.2)."},
  {topic:"Part 4", q:"Surge Protective Devices are covered for selection and erection in which section?", options:["Section 443","Section 534","Section 537","Section 559"], correct:1, explain:"Section 443 decides WHEN an SPD is needed; Section 534 covers the selection and erection of the SPD itself."},
  {topic:"Part 5", q:"The harmonised colour for a circuit protective conductor is:", options:["Blue","Brown","Black","Green-and-yellow"], correct:3, explain:"CPC = green-and-yellow; line = brown; neutral = blue (Section 514)."},
  {topic:"Part 5", q:"A cable run 40mm deep in a plastered stud wall, not mechanically protected and outside the permitted zones, requires:", options:["No additional protection","30mA RCD additional protection","A 100mA RCD","Mineral-insulated cable only"], correct:1, explain:"Less than 50mm and not protected/in a safe zone triggers 30mA RCD additional protection (Reg 522.6.202)."},
  {topic:"Part 5", q:"Which RCD type is the minimum suitable choice where smooth DC fault current may occur?", options:["Type AC","Type A","Type F","Type B"], correct:3, explain:"Type B is required for smooth DC. Type AC only handles AC; Type A handles pulsating DC (Reg 531.3.3)."},
  {topic:"Part 5", q:"On a PME supply with a 25mm² supply neutral, a typical minimum main protective bonding conductor is:", options:["4mm²","6mm²","10mm²","16mm²"], correct:2, explain:"Table 54.8 gives 10mm² for PME supplies where the neutral is up to 35mm²."},
  {topic:"Part 6", q:"Which test is carried out FIRST in the dead test sequence?", options:["Insulation resistance","Earth fault loop impedance","Continuity of protective conductors","RCD operation"], correct:2, explain:"Continuity (of protective conductors and ring conductors) comes first, then insulation resistance, then polarity (dead)."},
  {topic:"Part 6", q:"On an EICR, an observation coded C2 means:", options:["Improvement recommended","Danger present, immediate action","Potentially dangerous, urgent remedial action","No action needed"], correct:2, explain:"C2 = potentially dangerous, urgent remedial action required, and it renders the report Unsatisfactory."},
  {topic:"Part 6", q:"Adding one socket-outlet to an existing ring final circuit should be certified with:", options:["An EIC","A MEIWC","An EICR","No certificate"], correct:1, explain:"A Minor Electrical Installation Works Certificate is used for additions that don't include a new circuit."},
  {topic:"Part 7", q:"In a bathroom, Zone 1 extends:", options:["Inside the bath only","Above the bath/shower up to 2.25m","0.6m beyond the bath","Over the whole room"], correct:1, explain:"Zone 1 is the volume above the basin up to 2.25m; Zone 0 is inside the basin; Zone 2 is 0.6m beyond Zone 1 (701.32)."},
  {topic:"Part 7", q:"A domestic EV charge point installed outdoors using a TN-C-S supply must address:", options:["Voltage drop only","The risk from an open PEN conductor","Harmonics only","Stroboscopic effect"], correct:1, explain:"Open-PEN risk means an earth electrode or open-PEN/voltage-detection protection is required (Reg 722.411.4)."},
  {topic:"Part 7", q:"Supplementary equipotential bonding in a bathroom may be omitted when:", options:["The room is small","Main bonding is present, ADS times are met and all extraneous parts are connected to the MET","Plastic pipes are used somewhere","An RCD is fitted to the lighting only"], correct:1, explain:"All three conditions of Reg 701.415.2 must be satisfied to omit supplementary bonding."},
  {topic:"Part 8", q:"Chapter 82 of Part 8 deals with:", options:["Bathrooms","Prosumer's low-voltage installations","Inspection and testing","Definitions"], correct:1, explain:"Part 8 / Chapter 82 covers prosumer (produce + consume) installations with local generation and storage."},
  {topic:"Appendices", q:"To find the voltage-drop figure (mV/A/m) for a cable, you use:", options:["Appendix 3","Appendix 4","Appendix 6","Appendix 14"], correct:1, explain:"Appendix 4 holds current ratings, correction factors and voltage drop figures. Appendix 3 holds device trip curves."},
  {topic:"Appendices", q:"Where are the model Electrical Installation Certificate and EICR found?", options:["Appendix 1","Appendix 3","Appendix 6","Appendix 17"], correct:2, explain:"Appendix 6 — model forms for certification and reporting."}
];

/* ---------- PART 2 — DEFINITIONS (searchable glossary) ----------
   Plain-English explanations written for study. These paraphrase the
   concepts; they are not the verbatim wording of BS 7671 Part 2. */
const DEFINITIONS = [
  {term:"AC (alternating current)", cat:"General", def:"Current that periodically reverses direction; the UK public supply is AC at 50 Hz."},
  {term:"Accessory", cat:"Wiring", def:"A device, other than current-using equipment, associated with the wiring and accessories of an installation — e.g. a socket-outlet, switch, plug or connection unit."},
  {term:"Ambient temperature", cat:"Wiring", def:"The temperature of the air or other medium surrounding equipment. It affects a cable's current-carrying capacity (correction factor Ca)."},
  {term:"Arm's reach", cat:"Shock protection", def:"The zone extending from any point a person can stand to the limit a hand can reach in any direction without assistance — used when relying on placing live parts out of reach (see Fig 417)."},
  {term:"Automatic disconnection of supply (ADS)", cat:"Shock protection", def:"The main method of fault protection: a fault to earth causes a protective device to operate and cut off the supply quickly enough to prevent a dangerous shock."},
  {term:"Barrier", cat:"Shock protection", def:"A part providing basic protection by preventing contact with live parts from any usual direction of access."},
  {term:"Basic insulation", cat:"Shock protection", def:"Insulation applied to live parts to provide basic protection — the everyday insulation on a conductor."},
  {term:"Basic protection", cat:"Shock protection", def:"Protection against electric shock under normal (fault-free) conditions — stops you touching live parts (formerly 'protection against direct contact')."},
  {term:"Bidirectional protective device", cat:"Devices", def:"NEW (A3:2024). A device the manufacturer intends to work with a supply connected to either side, or to both sets of terminals — suited to installations where power flows both ways."},
  {term:"Bonding conductor", cat:"Earthing & bonding", def:"A protective conductor providing equipotential bonding — connecting conductive parts together to keep them at substantially the same potential."},
  {term:"Bunched", cat:"Wiring", def:"Cables are bunched when grouped together so that heat doesn't dissipate freely; bunching reduces current-carrying capacity (grouping factor Cg)."},
  {term:"Cable coupler", cat:"Wiring", def:"A means of connecting/disconnecting two flexible cables, comprising a connector and a plug part."},
  {term:"Circuit", cat:"General", def:"An assembly of equipment supplied from the same origin and protected against overcurrent by the same protective device(s)."},
  {term:"Circuit protective conductor (CPC)", cat:"Earthing & bonding", def:"A protective conductor connecting exposed-conductive-parts of equipment to the main earthing terminal, providing the path for earth fault current."},
  {term:"Class I equipment", cat:"Shock protection", def:"Equipment relying on basic insulation PLUS an earth connection of its exposed metalwork (a CPC) for fault protection."},
  {term:"Class II equipment", cat:"Shock protection", def:"Equipment with double or reinforced insulation and no reliance on an earth connection — the 'double-insulated' square-in-square symbol."},
  {term:"Class III equipment", cat:"Shock protection", def:"Equipment relying on supply at SELV, where voltages are too low to cause a harmful shock."},
  {term:"Conductor — live", cat:"General", def:"A conductor intended to be energised in normal use, including a neutral but excluding a PEN where it's acting as a protective conductor."},
  {term:"Conduit", cat:"Wiring", def:"A part of a closed wiring system (round or otherwise) for drawing in or replacing insulated conductors or cables."},
  {term:"Consumer unit", cat:"Devices", def:"A particular type of low-voltage switchgear assembly for a domestic installation — incoming main switch plus the final-circuit protective devices in one enclosure."},
  {term:"Current-carrying capacity (of a conductor)", cat:"Wiring", def:"The maximum current a conductor can carry continuously under defined conditions without its temperature exceeding the specified limit — the corrected value is Iz."},
  {term:"Current-using equipment", cat:"General", def:"Equipment that converts electrical energy into another form, such as heat, light or motion (a heater, lamp or motor)."},
  {term:"DC (direct current)", cat:"General", def:"Current that flows in one direction only; produced by batteries, PV arrays and rectifiers."},
  {term:"Design current (Ib)", cat:"Overcurrent", def:"The current intended to be carried by a circuit in normal service — the starting point of the Ib ≤ In ≤ Iz cable-sizing check."},
  {term:"Disconnector (isolator)", cat:"Devices", def:"A mechanical device that provides, in the open position, an isolating distance (a secure gap) to make a circuit safe to work on."},
  {term:"Distribution board", cat:"Devices", def:"An assembly containing protective devices fed from one or more incoming circuits, with terminals for outgoing circuits."},
  {term:"Distribution circuit", cat:"General", def:"A circuit supplying a distribution board or switchgear (rather than current-using equipment directly) — e.g. submains between boards."},
  {term:"Double insulation", cat:"Shock protection", def:"Insulation comprising both basic and supplementary insulation — the basis of Class II equipment."},
  {term:"Earth", cat:"Earthing & bonding", def:"The conductive mass of the Earth, whose electric potential at any point is taken as zero."},
  {term:"Earth electrode", cat:"Earthing & bonding", def:"A conductor (or group) in intimate contact with the ground, providing an electrical connection to earth — used on TT systems."},
  {term:"Earth fault current", cat:"Earthing & bonding", def:"A fault current that flows to earth due to a fault of negligible impedance between a live conductor and an exposed- or extraneous-conductive-part."},
  {term:"Earth fault loop impedance (Zs)", cat:"Earthing & bonding", def:"The total impedance of the earth fault current loop, starting and ending at the point of fault. Low enough Zs lets the device disconnect in time. Ze is the external part of the loop."},
  {term:"Earthing", cat:"Earthing & bonding", def:"The act of connecting the exposed-conductive-parts of an installation to the means of earthing."},
  {term:"Earthing conductor", cat:"Earthing & bonding", def:"A protective conductor connecting the main earthing terminal to the means of earthing (the supply earth or an electrode)."},
  {term:"Electrical installation", cat:"General", def:"An assembly of associated electrical equipment having coordinated characteristics to fulfil a specific purpose — i.e. the fixed wiring beyond the origin."},
  {term:"Emergency switching", cat:"Devices", def:"Rapidly cutting off the supply to remove an unexpected danger — the device must be readily accessible and clearly identifiable."},
  {term:"Enclosure", cat:"Shock protection", def:"A part providing protection of equipment against external influences and basic protection in any direction."},
  {term:"Equipotential bonding", cat:"Earthing & bonding", def:"Electrical connection keeping conductive parts at substantially the same potential, so dangerous voltage differences can't appear between them."},
  {term:"Exposed-conductive-part", cat:"Shock protection", def:"Conductive part of equipment that can be touched and is not normally live, but may become live under a fault — e.g. a Class I appliance casing."},
  {term:"Extraneous-conductive-part", cat:"Shock protection", def:"A conductive part NOT forming part of the installation but liable to introduce a potential, generally earth — e.g. a metal water or gas pipe, or structural steel."},
  {term:"External influence", cat:"Wiring", def:"Any influence external to the installation that affects its design and operation — moisture, temperature, dust, impact (classified by the AD/AE/BE codes)."},
  {term:"Fault current", cat:"Overcurrent", def:"A current resulting from a fault — e.g. a short-circuit between live conductors or an earth fault."},
  {term:"Fault protection", cat:"Shock protection", def:"Protection against electric shock under single-fault conditions — chiefly automatic disconnection of supply (formerly 'protection against indirect contact')."},
  {term:"FELV (functional extra-low voltage)", cat:"Voltages", def:"An extra-low-voltage system that does NOT meet all the requirements of SELV or PELV, so basic and fault protection appropriate to the primary voltage are still needed."},
  {term:"Final circuit", cat:"General", def:"A circuit connected directly to current-using equipment or to socket-outlets — the 'last leg' of the installation."},
  {term:"Functional earthing", cat:"Earthing & bonding", def:"Earthing for reasons other than safety — e.g. for the correct operation of equipment (as distinct from protective earthing)."},
  {term:"Functional switching", cat:"Devices", def:"Switching intended for normal operation — turning equipment on and off in service (e.g. a light switch)."},
  {term:"Fuse", cat:"Devices", def:"A protective device that opens a circuit by the melting of a fuse element when the current exceeds a value for a sufficient time."},
  {term:"Generating set", cat:"Devices", def:"An assembly producing electrical energy — a generator, microgeneration source or storage system, operating standalone, as an alternative, or in parallel with the grid."},
  {term:"Indirect contact", cat:"Shock protection", def:"Older term for contact with exposed-conductive-parts made live by a fault — now covered by 'fault protection'."},
  {term:"Instructed person (electrically)", cat:"Persons", def:"A person adequately advised or supervised by a skilled person to enable them to perceive risks and avoid dangers electricity can create."},
  {term:"Insulation", cat:"Shock protection", def:"Material applied to conductors to prevent the passage of current and provide protection against electric shock."},
  {term:"Isolation", cat:"Devices", def:"Cutting off a circuit/equipment from every source of supply for safety, in a way that is secure against inadvertent reclosure."},
  {term:"IT system", cat:"Earthing & bonding", def:"A system with no direct connection between live parts and earth (or earthed through a high impedance); exposed-conductive-parts are earthed independently."},
  {term:"Leakage current", cat:"General", def:"Current flowing to earth or to extraneous-conductive-parts in a healthy circuit — should be small; excessive leakage trips RCDs."},
  {term:"Line conductor", cat:"General", def:"A conductor of an AC system for the transmission of energy, other than a neutral or protective conductor (the 'live'/'phase' — brown in the UK)."},
  {term:"Live part", cat:"Shock protection", def:"A conductor or conductive part intended to be energised in normal use, including a neutral conductor."},
  {term:"Low voltage", cat:"Voltages", def:"Voltage normally exceeding extra-low voltage but not exceeding 1000 V AC or 1500 V DC between conductors (50–1000 V AC to earth) — the band BS 7671 mainly addresses."},
  {term:"Luminaire", cat:"Devices", def:"Equipment that distributes, filters or transforms light from one or more lamps, including the parts to support, fix and protect the lamps."},
  {term:"Luminaire supporting coupler (DCL)", cat:"Devices", def:"A standardised ceiling device for the mechanical support and electrical connection of a luminaire (Device for Connecting Luminaires)."},
  {term:"Main earthing terminal (MET)", cat:"Earthing & bonding", def:"The terminal or bar provided for the connection of earthing, protective and bonding conductors to the means of earthing — the installation's single earth reference point."},
  {term:"Maximum demand", cat:"General", def:"The greatest current likely to be drawn by an installation, assessed allowing for diversity — it sizes the supply and main equipment."},
  {term:"Neutral conductor", cat:"General", def:"A conductor connected to the neutral point of a system that contributes to the transmission of energy (blue in the UK)."},
  {term:"Nominal voltage", cat:"Voltages", def:"The voltage by which an installation (or part) is designated — e.g. 230 V single-phase, 400 V three-phase. Actual voltage may vary within limits."},
  {term:"Obstacle", cat:"Shock protection", def:"A part preventing unintentional contact with live parts, but not preventing deliberate contact — only for use where access is restricted to skilled/instructed persons."},
  {term:"Ordinary person", cat:"Persons", def:"A person who is neither a skilled person nor an instructed person — i.e. the general public, for whom the highest level of protection is assumed."},
  {term:"Origin of an installation", cat:"General", def:"The point at which electrical energy is delivered to the installation — generally the outgoing terminals of the meter or the consumer's main switch."},
  {term:"Overcurrent", cat:"Overcurrent", def:"A current exceeding the rated value; in a sound circuit this is an overload, in a faulty circuit it is a fault (short-circuit or earth fault) current."},
  {term:"Overload current", cat:"Overcurrent", def:"An overcurrent occurring in a circuit that is electrically sound (no fault) — e.g. too many appliances on one circuit."},
  {term:"PELV (protective extra-low voltage)", cat:"Voltages", def:"An extra-low-voltage system from a safety source that is electrically separated from other circuits but, unlike SELV, may have one point connected to earth."},
  {term:"PEN conductor", cat:"Earthing & bonding", def:"A conductor combining the functions of both a protective (PE) and neutral (N) conductor — the combined part of a TN-C-S (PME) supply."},
  {term:"Point (in wiring)", cat:"Wiring", def:"A termination of the fixed wiring intended for the connection of current-using equipment or accessories."},
  {term:"Portable equipment", cat:"General", def:"Equipment intended to be moved while in operation, or easily moved between uses while connected to the supply."},
  {term:"Prospective fault current (Ipf)", cat:"Overcurrent", def:"The value of fault current that would flow for a fault of negligible impedance — the protective device's breaking capacity must exceed it."},
  {term:"Protective conductor (PE)", cat:"Earthing & bonding", def:"A conductor used for protection against electric shock, connecting exposed-conductive-parts, extraneous-conductive-parts, the MET, earth electrode or earthed point of the source."},
  {term:"Protective multiple earthing (PME)", cat:"Earthing & bonding", def:"An earthing arrangement (TN-C-S) where the supply neutral is also used as the earth, connected to earth at multiple points along the network — common in UK housing."},
  {term:"Reduced low voltage system", cat:"Voltages", def:"A system in which the voltage between conductors does not exceed 110 V (and 63.5 V to earth) — used for portable tools on construction sites (110 V centre-tapped)."},
  {term:"Reinforced insulation", cat:"Shock protection", def:"A single insulation system giving protection against shock equivalent to double insulation."},
  {term:"Residual current", cat:"Devices", def:"The vector sum of the instantaneous currents in the live conductors of a circuit — in a healthy circuit it's near zero; an imbalance indicates leakage/fault."},
  {term:"Residual current device (RCD)", cat:"Devices", def:"A mechanical switching device designed to open its contacts when the residual current reaches a set value (e.g. 30 mA) — used for additional protection."},
  {term:"Ring final circuit", cat:"Wiring", def:"A final circuit wired as a loop, starting and ending at the same protective device, so each point is fed from two directions (the classic UK ring main)."},
  {term:"Safety service", cat:"General", def:"An electrical system for equipment provided to protect or warn people in danger, or essential to their safety — e.g. emergency lighting, fire alarms."},
  {term:"SELV (separated extra-low voltage)", cat:"Voltages", def:"An extra-low-voltage system from a safety-isolating source, electrically separated from earth and from other circuits (no earth connection)."},
  {term:"Shock current", cat:"Shock protection", def:"A current passing through a human or animal body of a magnitude that may have harmful physiological effects."},
  {term:"Simultaneously accessible parts", cat:"Shock protection", def:"Conductors or conductive parts that can be touched at the same time — relevant to touch voltage and the need for bonding."},
  {term:"Skilled person (electrically)", cat:"Persons", def:"A person with relevant education and experience to enable them to perceive risks and avoid dangers that electricity can create."},
  {term:"Socket-outlet", cat:"Wiring", def:"A device with socket contacts intended for connection to a plug, and for the connection of flexible cords to the fixed wiring."},
  {term:"Spur", cat:"Wiring", def:"A branch from a ring or radial final circuit — a fused spur has its own fuse; a non-fused spur is limited in what it may supply."},
  {term:"Stationary equipment", cat:"General", def:"Fixed equipment, or equipment over 18 kg not provided with a carrying handle — not intended to be moved in normal use."},
  {term:"Supplementary insulation", cat:"Shock protection", def:"Independent insulation applied in addition to basic insulation, to provide fault protection (together they form double insulation)."},
  {term:"Supplementary equipotential bonding", cat:"Earthing & bonding", def:"Local bonding connecting simultaneously-accessible exposed- and extraneous-conductive-parts to limit touch voltage during a fault (historically in bathrooms)."},
  {term:"Switchgear", cat:"Devices", def:"Equipment for switching, controlling and protecting circuits — the assembly of switches, fuses, circuit-breakers and associated control gear."},
  {term:"System (TN, TT, IT)", cat:"Earthing & bonding", def:"A live conductor (or conductors) and the protective conductors, classified by how the supply and installation are earthed — TN, TT or IT."},
  {term:"TN-S system", cat:"Earthing & bonding", def:"A TN system with separate neutral and protective conductors throughout, the earth provided via the supply cable (e.g. the cable sheath) — low Ze."},
  {term:"TN-C-S system", cat:"Earthing & bonding", def:"A TN system where neutral and protective functions are combined (PEN) in the supply and separated within the installation — UK PME; very low Ze."},
  {term:"TT system", cat:"Earthing & bonding", def:"A system where one point of the supply is earthed and the installation's exposed-conductive-parts are connected to an independent earth electrode — high Ze, needs RCDs."},
  {term:"Touch voltage", cat:"Shock protection", def:"The voltage appearing between simultaneously-accessible parts during an insulation fault — kept low by ADS and bonding."},
  {term:"Unidirectional protective device", cat:"Devices", def:"NEW (A3:2024). A device the manufacturer intends to have the supply connected to one defined set of terminals only — its line/load sides must be wired the correct way round."},
  {term:"Voltage band I", cat:"Voltages", def:"The lower voltage band covering extra-low voltage and systems where protection against shock is provided by the low value of voltage (e.g. SELV/PELV)."},
  {term:"Voltage band II", cat:"Voltages", def:"The band covering voltages for normal supply to installations — i.e. low voltage up to 1000 V AC, including the 230/400 V supply."},
  {term:"Wiring system", cat:"Wiring", def:"An assembly of one or more cables or busbars and the parts that fix, support and (if necessary) enclose them — e.g. cables in conduit or on a tray."}
];

    answer:"Continuity of protective conductors (a dead test) is carried out first, followed by insulation resistance and polarity, before any live tests such as loop impedance and RCD operation."
  }
];

</script>
<script>
document.addEventListener('DOMContentLoaded', function () {
  const app = document.getElementById('app');
  const navBtns = Array.from(document.querySelectorAll('#nav button'));

  /* icons */
  const IC = {
    book:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 5a2 2 0 012-2h12v16H6a2 2 0 00-2 2V5z"/><path d="M4 19a2 2 0 012-2h12"/></svg>',
    search:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4"/></svg>',
    cards:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="6" width="14" height="14" rx="2"/><path d="M7 3h13a1 1 0 011 1v12"/></svg>',
    check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 11l3 3 8-8"/><path d="M21 12v6a2 2 0 01-2 2H5a2 2 0 01-2-2V6a2 2 0 012-2h11"/></svg>',
    target:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/></svg>',
    skills:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3l2.5 5 5.5.8-4 3.9.9 5.5L12 21l-5-2.9.9-5.5-4-3.9L9.5 8z"/></svg>'
  };

  /* ---------- ROUTER ---------- */
  window.go = function (view, arg) {
    navBtns.forEach(b => b.classList.toggle('active', b.dataset.view === view || (view === 'part' && b.dataset.view === 'parts')));
    window.scrollTo({top:0,behavior:'smooth'});
    const render = ({home:renderHome,parts:renderParts,part:()=>renderPart(arg),index:renderIndex,definitions:renderDefinitions,figures:renderFigures,
      flashcards:renderFlash,quiz:renderQuiz,keyword:renderKeyword,examskills:renderExam}[view]) || renderHome;
    render();
  };
  navBtns.forEach(b => b.addEventListener('click', () => go(b.dataset.view)));

  /* ---------- HOME ---------- */
  function renderHome(){
    const tiles = PARTS.map(p => `
      <div class="ptile" onclick="go('part','${p.id}')">
        <div class="num">${p.num}</div>
        <div class="tag">${p.tag}</div>
        <h3>${p.title}</h3>
        <div class="meta">${IC.book}<span>${p.chapters.length} section${p.chapters.length>1?'s':''}</span></div>
      </div>`).join('');
    const feats = [
      ['index','Index Finder','Search a word or whole phrase and jump to the regulation number — just like the back of the book.',IC.search],
      ['definitions','Definitions','The Part 2 glossary, searchable A–Z. Know the exact meaning of a term and the mark is yours.',IC.book],
      ['figures','Table of Figures','Find any BS 7671 diagram — earthing systems, zones, conductor arrangements — by number or topic.',IC.book],
      ['flashcards','Flash Cards','Flip cards covering the questions that matter most, filtered by Part.',IC.cards],
      ['quiz','Test Yourself','Multiple-choice questions with worked explanations and live scoring.',IC.check],
      ['keyword','Keyword Trainer','The core exam skill: spot the trigger words, decide the Part, find the reg.',IC.target],
      ['examskills','Exam Skills','The step-by-step method for navigating the open-book exam fast.',IC.skills]
    ].map(([v,t,d,i]) => `<div class="feat" onclick="go('${v}')"><div class="ic">${i}</div><h3>${t}</h3><p>${d}</p></div>`).join('');

    app.innerHTML = `
      <section class="hero">
        <span class="tag">⚡ Open-book exam trainer · Updated to A3:2024</span>
        <h1>Master the <em>18th Edition</em> Wiring Regulations</h1>
        <p>Detailed explanations, flash cards and tests across all eight Parts — plus a trainer that teaches you to spot the keywords in a question and find the right regulation, fast.</p>
        <div class="pills"><span>Parts 1–8 + Appendices</span><span>${FLASHCARDS.length} flash cards</span><span>${MCQS.length} MCQs</span><span>${DEFINITIONS.length} definitions</span><span>${INDEX_ENTRIES.length} indexed terms</span><span>${FIGURES.length} figures</span></div>
      </section>
      <div class="callout" style="display:flex;gap:14px;align-items:flex-start">
        <span class="newtag" style="margin-top:2px">New · A3:2024</span>
        <div><b>What changed in Amendment 3:2024</b> (in force from 31 July 2024). Two new Part 2 definitions — <b>bidirectional</b> and <b>unidirectional protective devices</b> — and one new regulation, <b>530.3.201</b> in Chapter 53, requiring their direction to be taken into account when selecting and erecting protection. This supports installations where power flows both ways: solar PV, battery storage and EV vehicle-to-grid. It's covered in <a href="#" onclick="go('part','p2');return false" style="color:var(--copper-d);font-weight:600">Part 2</a>, <a href="#" onclick="go('part','p5');return false" style="color:var(--copper-d);font-weight:600">Part 5</a>, and tested in the flash cards and quiz.</div>
      </div>
      <div class="sec-title"><span class="n">§</span>The book, Part by Part</div>
      <p class="sec-sub">Tap any Part to read plain-English explanations and the key regulation numbers it contains.</p>
      <div class="grid parts-grid">${tiles}</div>
      <div class="sec-title"><span class="n">★</span>Train your skills</div>
      <p class="sec-sub">The exam is open-book — your speed at <em>finding</em> the right regulation is what's really tested.</p>
      <div class="grid feat-grid">${feats}</div>
      <div class="disc">This app explains BS 7671 and references regulation numbers for study. It does not reproduce the text of the standard. For the definitive wording, always consult your own copy of BS 7671:2018+A3:2024.</div>`;
  }

  /* ---------- PARTS OVERVIEW ---------- */
  function renderParts(){
    const tiles = PARTS.map(p => `
      <div class="ptile" onclick="go('part','${p.id}')">
        <div class="num">${p.num}</div><div class="tag">${p.tag}</div>
        <h3>${p.title}</h3>
        <div class="meta">${IC.book}<span>${p.chapters.length} section${p.chapters.length>1?'s':''}</span></div>
      </div>`).join('');
    app.innerHTML = `
      <div class="crumb">Contents</div>
      <div class="sec-title"><span class="n">§</span>Parts &amp; Chapters</div>
      <p class="sec-sub">The structure of BS 7671. Knowing which Part holds what is half the battle in the exam.</p>
      <div class="grid parts-grid">${tiles}</div>`;
  }

  /* ---------- SINGLE PART ---------- */
  function renderPart(id){
    const p = PARTS.find(x => x.id === id) || PARTS[0];
    const chapters = p.chapters.map(c => `
      <div class="chapter">
        <span class="ch-num">${c.num}</span>
        <h3>${c.title}</h3>
        <div class="body">${c.body}</div>
        <div class="regbox">
          <div class="lbl">Key regulations — tap any to learn it in detail</div>
          ${c.regs.map(r => `<div class="reg" onclick="this.classList.toggle('open')">
            <div class="reg-head">
              <span class="ref">${r.ref}</span>
              <span class="what">${r.topic}</span>
              <svg class="reg-chev" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 6l6 6-6 6"/></svg>
            </div>
            <div class="reg-detail"><div class="reg-detail-inner">${r.detail || 'See your copy of BS 7671 for the detail of this regulation.'}</div></div>
          </div>`).join('')}
        </div>
      </div>`).join('');
    const idx = PARTS.indexOf(p);
    const prev = PARTS[idx-1], next = PARTS[idx+1];
    app.innerHTML = `
      <div class="crumb"><b>Parts</b> &nbsp;›&nbsp; Part ${p.num}</div>
      <div class="hero" style="padding:34px 36px">
        <span class="tag">Part ${p.num}</span>
        <h1 style="font-size:clamp(1.6rem,3.5vw,2.4rem)">${p.title}</h1>
        <p>${p.intro}</p>
      </div>
      ${chapters}
      <div class="toolbar" style="margin-top:24px;justify-content:space-between">
        ${prev?`<button class="btn btn-ghost" onclick="go('part','${prev.id}')">← Part ${prev.num}</button>`:'<span></span>'}
        <button class="btn btn-primary" onclick="go('quiz')">Test this material →</button>
        ${next?`<button class="btn btn-ghost" onclick="go('part','${next.id}')">Part ${next.num} →</button>`:'<span></span>'}
      </div>`;
  }

  /* ---------- INDEX FINDER ---------- */
  function renderIndex(){
    app.innerHTML = `
      <div class="crumb">Index Finder</div>
      <div class="sec-title"><span class="n">${IC.search}</span>Index Finder</div>
      <p class="sec-sub">Type a keyword <em>or a phrase</em> the way it appears in an exam question — word order doesn't matter, every word just has to appear somewhere in the entry. The index shows the regulation number and the Part it lives in.</p>
      <div class="searchwrap">${IC.search}<input id="idxSearch" placeholder="e.g. cables in walls · supplementary bonding bathroom · RCD socket · EV charging…" autocomplete="off"></div>
      <div class="idx-count" id="idxCount"></div>
      <div class="idx-list" id="idxList"></div>`;
    const input = document.getElementById('idxSearch');
    const list = document.getElementById('idxList');
    const count = document.getElementById('idxCount');
    const sorted = INDEX_ENTRIES.slice().sort((a,b)=>a.term.localeCompare(b.term));
    function esc(s){return s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');}
    const norm = s => s.toLowerCase().replace(/[’'`]/g,'');
    function draw(q){
      const raw = q.trim();
      const tokens = norm(raw).split(/\s+/).filter(Boolean);
      const rows = sorted.filter(e => {
        if(!tokens.length) return true;
        const hay = norm(e.term + ' ' + e.ref + ' ' + e.part);
        return tokens.every(t => hay.includes(t)); // phrase = every word must appear
      });
      count.textContent = raw ? `${rows.length} match${rows.length!==1?'es':''} for “${raw}”` : `${sorted.length} indexed terms — type a word or phrase to filter`;
      const re = tokens.length ? new RegExp('('+tokens.map(esc).join('|')+')','ig') : null;
      list.innerHTML = rows.length ? rows.map(e=>{
        let term = e.term;
        if(re) term = term.replace(re,'<span class="hl">$1</span>');
        return `<div class="idx-row"><span class="term">${term}</span><span class="ppart">${e.part}</span><span class="ref">${e.ref}</span></div>`;
      }).join('') : `<div class="idx-row"><span class="term" style="color:var(--ink-soft)">No match. Try fewer or broader words — the index uses the main nouns (e.g. “cables walls”, “bonding bathroom”).</span></div>`;
    }
    input.addEventListener('input',()=>draw(input.value));
    draw('');
    input.focus();
  }

  /* ---------- DEFINITIONS (Part 2 glossary) ---------- */
  function renderDefinitions(){
    const cats = Array.from(new Set(DEFINITIONS.map(d=>d.cat))).sort();
    app.innerHTML = `
      <div class="crumb"><b>Part 2</b> &nbsp;›&nbsp; Definitions</div>
      <div class="sec-title"><span class="n">A→Z</span>Definitions</div>
      <p class="sec-sub">Part 2 of BS 7671 is the dictionary, and exam questions love testing a precise definition. Search a word or phrase, or tap a category to filter. Explanations are in plain English for study.</p>
      <div class="searchwrap">${IC.search}<input id="defSearch" placeholder="e.g. extraneous · fault protection · SELV · earthing system · skilled person…" autocomplete="off"></div>
      <div class="toolbar" id="defChips"><button class="chip on" data-c="All">All</button>${cats.map(c=>`<button class="chip" data-c="${c}">${c}</button>`).join('')}</div>
      <div class="idx-count" id="defCount"></div>
      <div id="defList"></div>`;
    const input = document.getElementById('defSearch');
    const list = document.getElementById('defList');
    const count = document.getElementById('defCount');
    const sorted = DEFINITIONS.slice().sort((a,b)=>a.term.localeCompare(b.term));
    let activeCat = 'All';
    function esc(s){return s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');}
    const norm = s => s.toLowerCase().replace(/[’'`]/g,'');
    function draw(q){
      const raw = q.trim();
      const tokens = norm(raw).split(/\s+/).filter(Boolean);
      const rows = sorted.filter(d => {
        if(activeCat!=='All' && d.cat!==activeCat) return false;
        if(!tokens.length) return true;
        const hay = norm(d.term + ' ' + d.def + ' ' + d.cat);
        return tokens.every(t => hay.includes(t));
      });
      const note = (raw?`${rows.length} match${rows.length!==1?'es':''} for “${raw}”`:`${rows.length} term${rows.length!==1?'s':''}`) + (activeCat!=='All'?` in ${activeCat}`:'');
      count.textContent = note;
      const re = tokens.length ? new RegExp('('+tokens.map(esc).join('|')+')','ig') : null;
      // group by first letter
      let html = '', lastLetter = '';
      rows.forEach(d=>{
        const L = d.term[0].toUpperCase();
        if(L!==lastLetter){ if(lastLetter) html+='</div>'; html+=`<div class="def-letter">${L}</div><div class="def-group">`; lastLetter=L; }
        let term = d.term, def = d.def;
        if(re){ term = term.replace(re,'<span class="hl">$1</span>'); def = def.replace(re,'<span class="hl">$1</span>'); }
        html += `<div class="def-row"><div class="def-head"><span class="def-term">${term}</span><span class="def-cat">${d.cat}</span></div><div class="def-text">${def}</div></div>`;
      });
      if(lastLetter) html+='</div>';
      list.innerHTML = rows.length ? html : `<div class="idx-list"><div class="idx-row"><span class="term" style="color:var(--ink-soft)">No matching definition. Try a broader word, e.g. “bonding”, “protection” or “voltage”.</span></div></div>`;
    }
    document.querySelectorAll('#defChips .chip').forEach(c=>c.addEventListener('click',()=>{
      document.querySelectorAll('#defChips .chip').forEach(x=>x.classList.remove('on'));
      c.classList.add('on'); activeCat=c.dataset.c; draw(input.value);
    }));
    input.addEventListener('input',()=>draw(input.value));
    draw('');
    input.focus();
  }

  function renderFigures(){
    app.innerHTML = `
      <div class="crumb">Table of Figures</div>
      <div class="sec-title"><span class="n">▣</span>Table of Figures</div>
      <p class="sec-sub">The diagrams in BS 7671 — earthing systems, conductor arrangements, zones and bonding. Search by figure number or topic (phrases work too). Where your copy's page number is known it's shown; otherwise the related section is given, which is the surest way to find a figure in the open-book exam.</p>
      <div class="searchwrap">${IC.search}<input id="figSearch" placeholder="e.g. TN-C-S · earthing systems · bathroom zones · arm's reach…" autocomplete="off"></div>
      <div class="idx-count" id="figCount"></div>
      <div class="idx-list" id="figList"></div>`;
    const input = document.getElementById('figSearch');
    const list = document.getElementById('figList');
    const count = document.getElementById('figCount');
    function esc(s){return s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');}
    const norm = s => s.toLowerCase().replace(/[’'`]/g,'');
    function draw(q){
      const raw = q.trim();
      const tokens = norm(raw).split(/\s+/).filter(Boolean);
      const rows = FIGURES.filter(f => {
        if(!tokens.length) return true;
        const hay = norm(f.fig + ' ' + f.title + ' ' + f.ref + ' ' + (f.page||''));
        return tokens.every(t => hay.includes(t));
      });
      count.textContent = raw ? `${rows.length} figure${rows.length!==1?'s':''} for “${raw}”` : `${FIGURES.length} figures — type to filter`;
      const re = tokens.length ? new RegExp('('+tokens.map(esc).join('|')+')','ig') : null;
      list.innerHTML = rows.length ? rows.map(f=>{
        let title = f.title, fig = f.fig;
        if(re){ title = title.replace(re,'<span class="hl">$1</span>'); fig = fig.replace(re,'<span class="hl">$1</span>'); }
        const where = f.page ? `p.${f.page}` : f.ref;
        return `<div class="idx-row"><span class="ref" style="background:var(--copper-soft);color:var(--copper-d)">${fig}</span><span class="term">${title}</span><span class="ppart">${f.ref}</span><span class="ref">${where}</span></div>`;
      }).join('') : `<div class="idx-row"><span class="term" style="color:var(--ink-soft)">No matching figure. Try a broader term such as “system”, “zone” or “bonding”.</span></div>`;
    }
    input.addEventListener('input',()=>draw(input.value));
    draw('');
    input.focus();
  }

  /* ---------- FLASH CARDS ---------- */
  let fcSet=[], fcPos=0;
  function renderFlash(){
    const topics = ['All', ...Array.from(new Set(FLASHCARDS.map(c=>c.topic)))];
    app.innerHTML = `
      <div class="crumb">Flash Cards</div>
      <div class="sec-title"><span class="n">${IC.cards}</span>Flash Cards</div>
      <p class="sec-sub">Tap the card to reveal the answer. Filter by Part, or shuffle the whole deck.</p>
      <div class="toolbar" id="fcChips">${topics.map((t,i)=>`<button class="chip ${i===0?'on':''}" data-t="${t}">${t}</button>`).join('')}
        <button class="chip" id="fcShuffle">⤮ Shuffle</button></div>
      <div class="fc-stage"><div class="flashcard" id="flashcard"><div class="fc-inner">
        <div class="fc-face fc-front"><div class="kicker" id="fcTopic"></div><div class="q" id="fcQ"></div><div class="fc-hint">click to flip ↻</div></div>
        <div class="fc-face fc-back"><div class="kicker">Answer</div><div class="a" id="fcA"></div><div class="fc-hint">click to flip back ↻</div></div>
      </div></div></div>
      <div class="fc-controls">
        <button class="btn btn-ghost" id="fcPrev">← Prev</button>
        <span class="fc-progress" id="fcProg"></span>
        <button class="btn btn-primary" id="fcNext">Next →</button>
      </div>`;
    setFcSet('All');
    const card=document.getElementById('flashcard');
    card.addEventListener('click',()=>card.classList.toggle('flip'));
    document.getElementById('fcNext').addEventListener('click',()=>moveFc(1));
    document.getElementById('fcPrev').addEventListener('click',()=>moveFc(-1));
    document.getElementById('fcShuffle').addEventListener('click',()=>{
      document.querySelectorAll('#fcChips .chip').forEach(c=>c.classList.remove('on'));
      fcSet=FLASHCARDS.slice().sort(()=>Math.random()-0.5);fcPos=0;showFc();
    });
    document.querySelectorAll('#fcChips .chip[data-t]').forEach(c=>c.addEventListener('click',()=>{
      document.querySelectorAll('#fcChips .chip').forEach(x=>x.classList.remove('on'));
      c.classList.add('on');setFcSet(c.dataset.t);
    }));
  }
  function setFcSet(t){fcSet=(t==='All')?FLASHCARDS.slice():FLASHCARDS.filter(c=>c.topic===t);fcPos=0;showFc();}
  function showFc(){
    const c=fcSet[fcPos];if(!c)return;
    const card=document.getElementById('flashcard');card.classList.remove('flip');
    setTimeout(()=>{
      document.getElementById('fcTopic').textContent=c.topic;
      document.getElementById('fcQ').innerHTML=c.q;
      document.getElementById('fcA').innerHTML=c.a;
    },card.classList.contains('flip')?300:0);
    document.getElementById('fcProg').textContent=`${fcPos+1} / ${fcSet.length}`;
    document.getElementById('fcPrev').disabled=fcPos===0;
    document.getElementById('fcNext').disabled=fcPos===fcSet.length-1;
  }
  function moveFc(d){const n=fcPos+d;if(n<0||n>=fcSet.length)return;fcPos=n;showFc();}

  /* ---------- QUIZ ---------- */
  let qSet=[], qPos=0, qScore=0, qAnswered=false;
  function renderQuiz(){
    const topics=['All',...Array.from(new Set(MCQS.map(q=>q.topic)))];
    app.innerHTML=`
      <div class="crumb">Test Yourself</div>
      <div class="sec-title"><span class="n">${IC.check}</span>Test Yourself</div>
      <p class="sec-sub">Pick a topic or take the lot. Each answer reveals a worked explanation pointing to the regulation.</p>
      <div class="toolbar" id="qChips">${topics.map((t,i)=>`<button class="chip ${i===0?'on':''}" data-t="${t}">${t}</button>`).join('')}</div>
      <div id="quizBody"></div>`;
    document.querySelectorAll('#qChips .chip').forEach(c=>c.addEventListener('click',()=>{
      document.querySelectorAll('#qChips .chip').forEach(x=>x.classList.remove('on'));
      c.classList.add('on');startQuiz(c.dataset.t);
    }));
    startQuiz('All');
  }
  function startQuiz(t){
    qSet=((t==='All')?MCQS.slice():MCQS.filter(q=>q.topic===t)).sort(()=>Math.random()-0.5);
    qPos=0;qScore=0;showQ();
  }
  function showQ(){
    const body=document.getElementById('quizBody');const q=qSet[qPos];qAnswered=false;
    const pct=Math.round((qPos/qSet.length)*100);
    body.innerHTML=`
      <div class="quiz-card">
        <div class="progbar"><span style="width:${pct}%"></span></div>
        <div class="quiz-meta"><span>Question ${qPos+1} of ${qSet.length} · <b style="color:var(--copper-d)">${q.topic}</b></span>
          <span class="scorepill">Score ${qScore}/${qPos}</span></div>
        <div class="quiz-q">${q.q}</div>
        <div id="opts">${q.options.map((o,i)=>`<button class="opt" data-i="${i}"><span class="ltr">${'ABCD'[i]}</span>${o}</button>`).join('')}</div>
        <div class="explain" id="explain"></div>
        <div class="quiz-foot"><span></span><button class="btn btn-primary" id="qNext" style="display:none">${qPos===qSet.length-1?'See results':'Next question'} →</button></div>
      </div>`;
    document.querySelectorAll('#opts .opt').forEach(b=>b.addEventListener('click',()=>answerQ(+b.dataset.i)));
    document.getElementById('qNext').addEventListener('click',()=>{if(qPos===qSet.length-1)showResult();else{qPos++;showQ();}});
  }
  function answerQ(i){
    if(qAnswered)return;qAnswered=true;const q=qSet[qPos];
    const opts=document.querySelectorAll('#opts .opt');
    opts.forEach((b,j)=>{b.classList.add('locked');if(j===q.correct)b.classList.add('correct');if(j===i&&i!==q.correct)b.classList.add('wrong');});
    if(i===q.correct)qScore++;
    const ex=document.getElementById('explain');
    ex.innerHTML=`<b>${i===q.correct?'✓ Correct.':'✗ Not quite.'}</b> ${q.explain}`;
    ex.classList.add('show');
    document.getElementById('qNext').style.display='inline-block';
    document.querySelector('.scorepill').textContent=`Score ${qScore}/${qPos+1}`;
  }
  function showResult(){
    const pct=Math.round((qScore/qSet.length)*100);
    let msg = pct>=80?'Exam-ready on this topic. Strong navigation instincts.':pct>=55?'Solid — review the ones you missed and the regs they point to.':'Keep going. Re-read the relevant Part, then retry.';
    document.getElementById('quizBody').innerHTML=`
      <div class="quiz-card result">
        <div class="big">${pct}%</div>
        <h3>${qScore} out of ${qSet.length}</h3>
        <p style="color:var(--ink-soft);margin-bottom:22px">${msg}</p>
        <button class="btn btn-primary" onclick="document.querySelector('#qChips .chip.on').click()">Try again</button>
        <button class="btn btn-ghost" onclick="go('keyword')">Train keyword spotting →</button>
      </div>`;
  }

  /* ---------- KEYWORD TRAINER ---------- */
  let kwPos=0;
  function renderKeyword(){
    app.innerHTML=`
      <div class="crumb">Keyword Trainer</div>
      <div class="sec-title"><span class="n">${IC.target}</span>Keyword Trainer</div>
      <p class="sec-sub">Read the question. <b>Try to spot the trigger words yourself first</b>, then reveal each step to check your method: keywords → which Part/Chapter → the regulation → the answer.</p>
      <div class="toolbar">
        <button class="btn btn-ghost" id="kwPrev">← Previous</button>
        <span class="fc-progress" id="kwProg"></span>
        <button class="btn btn-ghost" id="kwNext">Next question →</button>
        <button class="btn btn-primary" id="kwRand" style="margin-left:auto">⤮ Random</button>
      </div>
      <div id="kwBody"></div>`;
    document.getElementById('kwPrev').addEventListener('click',()=>{if(kwPos>0){kwPos--;showKw();}});
    document.getElementById('kwNext').addEventListener('click',()=>{if(kwPos<KEYWORD_EXERCISES.length-1){kwPos++;showKw();}});
    document.getElementById('kwRand').addEventListener('click',()=>{kwPos=Math.floor(Math.random()*KEYWORD_EXERCISES.length);showKw();});
    showKw();
  }
  function showKw(){
    const e=KEYWORD_EXERCISES[kwPos];
    document.getElementById('kwProg').textContent=`${kwPos+1} / ${KEYWORD_EXERCISES.length}`;
    document.getElementById('kwPrev').disabled=kwPos===0;
    document.getElementById('kwNext').disabled=kwPos===KEYWORD_EXERCISES.length-1;
    const steps=[
      ['1','Spot the keywords',`<div class="kwlist">${e.keywords.map(k=>`<span>${k}</span>`).join('')}</div><p style="margin-top:8px">${e.keywordNote}</p>`],
      ['2','Decide where to look',`<p>${e.look}</p>`],
      ['3','Find the regulation',`<p>The relevant regulation reference is:</p><span class="reftag">${e.reg}</span>`],
      ['4','The answer',`<p>${e.answer}</p>`]
    ].map(([n,t,b])=>`
      <div class="kw-step" onclick="this.classList.toggle('open')">
        <div class="kw-step-h"><div class="sn">${n}</div><div class="st">${t}</div>
          <svg class="chev" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 6l6 6-6 6"/></svg></div>
        <div class="kw-step-b"><div class="inner">${b}</div></div>
      </div>`).join('');
    document.getElementById('kwBody').innerHTML=`
      <div class="kw-card">
        <div class="kw-tag">Exam-style question ${kwPos+1}</div>
        <div class="kw-q">${e.q}</div>
        <p style="font-size:.84rem;color:var(--ink-soft);margin:6px 2px 2px">Reveal each step in order:</p>
        ${steps}
      </div>`;
  }

  /* ---------- EXAM SKILLS ---------- */
  function renderExam(){
    const steps=[
      ['1','Read the whole question first','Don\'t reach for the book yet. Read it once for meaning. Exam questions are written to sound complicated — strip them back to "what are they actually asking?"'],
      ['2','Underline the trigger words','Certain words point to a Part almost on their own. "Socket-outlet", "disconnection time", "bonding", "bathroom", "RCD type", "EV charging" — each has a home in the book. Circle them.'],
      ['3','Map keyword → Part','Shock, RCDs, disconnection, AFDD, SPD → Part 4. Cable sizing, colours, devices, earthing → Part 5. Testing & certificates → Part 6. Any named location → Part 7. Lookup tables → Appendices.'],
      ['4','Use the Index, not your memory','In an open-book exam the Index is faster than flicking through chapters. Search the main noun ("bonding"), get the regulation number, turn straight to it. Practise this in the Index Finder.'],
      ['5','Confirm in the regulation, then answer','Land on the reg, read the exact wording (numbers, exceptions, "shall" vs "should"), and answer from the text — not from what you half-remember. The detail is usually in the exceptions.']
    ].map(([n,t,d],i)=>`
      <div class="method-step"><div class="mn">${n}</div><div><h3>${t}</h3><p>${d}</p></div></div>
      ${i<4?'<div class="arrow-down">↓</div>':''}`).join('');
    app.innerHTML=`
      <div class="crumb">Exam Skills</div>
      <div class="sec-title"><span class="n">${IC.skills}</span>The Open-Book Method</div>
      <p class="sec-sub">The 18th Edition exam is open-book and timed. You're not tested on memorising the regs — you're tested on <em>finding</em> them quickly and reading them precisely. Here's the method.</p>
      ${steps}
      <div class="callout">
        <b>The keyword habit.</b> Most marks are lost by people who know the content but search the wrong Part. Build the reflex: see a trigger word → name the Part out loud → confirm via the Index. Drill it in the <a href="#" onclick="go('keyword');return false" style="color:var(--copper-d);font-weight:600">Keyword Trainer</a>.
      </div>
      <div class="callout" style="background:#eef3fb;border-color:var(--navy-2);border-left-color:var(--navy-2)">
        <b>"Shall" vs "should".</b> In BS 7671, <b>shall</b> = a requirement you must meet; <b>should</b> = a recommendation. Exam questions often hinge on this single word, so read it carefully when you land on the regulation.
      </div>
      <div class="toolbar" style="margin-top:24px">
        <button class="btn btn-primary" onclick="go('keyword')">Start the Keyword Trainer →</button>
        <button class="btn btn-ghost" onclick="go('index')">Open the Index Finder</button>
      </div>`;
  }

  /* boot */
  go('home');
});
</script>

<script>
(function () {
  "use strict";
  // Block right-click context menu
  document.addEventListener('contextmenu', function (e) { e.preventDefault(); return false; }, false);

  // Block copy, cut and drag of content
  ['copy','cut','dragstart','selectstart'].forEach(function (evt) {
    document.addEventListener(evt, function (e) {
      var t = e.target;
      // allow normal use of input/textarea fields (e.g. the index search box)
      if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA')) return;
      e.preventDefault();
      return false;
    }, false);
  });

  // Block keyboard shortcuts: view-source, save, print, copy, cut, devtools
  document.addEventListener('keydown', function (e) {
    var k = (e.key || '').toLowerCase();
    var inField = e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA');
    // F12 (devtools)
    if (e.keyCode === 123) { e.preventDefault(); return false; }
    // Ctrl/Cmd + (U save-source, S save, P print, C copy, X cut)
    if ((e.ctrlKey || e.metaKey) && ['u','s','p','c','x'].indexOf(k) !== -1) {
      if (inField && (k === 'c' || k === 'x')) return; // let users copy within fields
      e.preventDefault(); return false;
    }
    // Ctrl+Shift+I / J / C (devtools)
    if ((e.ctrlKey || e.metaKey) && e.shiftKey && ['i','j','c'].indexOf(k) !== -1) {
      e.preventDefault(); return false;
    }
  }, false);

  // Belt-and-braces print blocking (in addition to the @media print CSS)
  window.addEventListener('beforeprint', function () {
    try { document.body.setAttribute('data-printing', '1'); } catch (err) {}
  });
})();
</script>
