const FLASHCARDS = [
  {topic:"Part 2", q:"<span style='font-size:.7rem;background:#3f7d54;color:#fff;padding:2px 7px;border-radius:5px;font-family:monospace'>A3:2024</span><br>What is the difference between a bidirectional and a unidirectional protective device?", a:"A <em>bidirectional</em> device is intended by the manufacturer to have a supply connected to either side, or to both sets of terminals. A <em>unidirectional</em> device is intended to have the supply on one defined set of terminals only — so it must be wired the correct way round (line/load). Both definitions were added by Amendment 3:2024 (Part 2)."},
  {topic:"Part 5", q:"<span style='font-size:.7rem;background:#3f7d54;color:#fff;padding:2px 7px;border-radius:5px;font-family:monospace'>A3:2024</span><br>Which new regulation requires account to be taken of a device's direction, and why does it matter?", a:"<strong>Reg 530.3.201</strong> (Amendment 3:2024) requires selection and erection to take account of whether a protective device is unidirectional or bidirectional. It matters because power can flow both ways in installations with PV, battery storage or EV vehicle-to-grid — a unidirectional device connected the wrong way round may not protect correctly. Devices are marked (line/load, in/out, or arrows) to show direction."},
  {topic:"Part 1", q:"What is the difference between 'basic protection' and 'fault protection'?", a:"Basic protection guards against contact with live parts under <em>normal</em> conditions (insulation, barriers, enclosures). Fault protection guards against shock under <em>fault</em> conditions (e.g. ADS, double insulation). Older terms were 'direct' and 'indirect' contact."},
  {topic:"Part 1", q:"Name three types of installation that BS 7671 does NOT apply to.", a:"Any three of: distributor's network equipment, railway/traction systems, motor vehicles, ships, aircraft, mines and quarries, equipment of motor vehicles, radio interference suppression equipment, and lightning protection of buildings (Reg 110.2)."},
  {topic:"Part 1", q:"Which chapter contains the fundamental principles for protection, design, selection and erection?", a:"Chapter 13 — Reg 131 (protection for safety), 132 (design), 133 (selection of equipment), 134 (erection and initial verification)."},
  {topic:"Part 2", q:"Define an 'extraneous-conductive-part'.", a:"A conductive part that is NOT part of the electrical installation but is liable to introduce a potential (generally earth potential) — e.g. metal water/gas pipes, structural steelwork. Contrast with an exposed-conductive-part, which IS part of the installation."},
  {topic:"Part 2", q:"What is a 'skilled person (electrically)' versus an 'instructed person'?", a:"A skilled person has the technical knowledge and experience to perceive and avoid electrical dangers. An instructed person is instructed or supervised by a skilled person to avoid those dangers."},
  {topic:"Part 2", q:"What is the difference between SELV and PELV?", a:"Both are extra-low-voltage from a safety-isolating source with simple separation from higher-voltage circuits. SELV is NOT earthed; PELV may be earthed (one point connected to earth). FELV is functional ELV that does not meet the requirements for SELV/PELV."},
  {topic:"Part 3", q:"Identify the four system earthing arrangements and their key feature.", a:"TN-S: separate N and PE throughout. TN-C-S (PME): combined PEN at the supply, separated in the installation. TT: installation earthed via its own electrode (high Ze, relies on RCDs). IT: source unearthed or earthed via high impedance."},
  {topic:"Part 3", q:"Why does a TT system almost always rely on RCDs for fault protection?", a:"Because the earth fault loop impedance (via an earth electrode) is too high to guarantee an overcurrent device will disconnect within the required time, so a 30mA/100mA RCD provides the disconnection instead."},
  {topic:"Part 4", q:"State the maximum disconnection times for a 230V final circuit ≤32A on TN and on TT systems.", a:"TN: 0.4 seconds. TT: 0.2 seconds. (For distribution circuits and final circuits >32A: 5s on TN, 1s on TT — Table 41.1.)"},
  {topic:"Part 4", q:"List the circuits that require 30mA RCD additional protection under the 18th Edition.", a:"Socket-outlets rated ≤32A (411.3.3), mobile equipment ≤32A used outdoors, AC lighting final circuits in dwellings (411.3.4, A2:2022), and cables concealed in walls at <50mm depth (522.6.202)."},
  {topic:"Part 4", q:"When are AFDDs required by A2:2022?", a:"For single-phase AC final circuits supplying socket-outlets up to 32A in higher-risk premises — Higher-Risk Residential Buildings, houses in multiple occupation, purpose-built student accommodation and care homes (421.1.7). Recommended for other premises."},
  {topic:"Part 4", q:"What is the overload coordination rule and the I2 condition?", a:"Ib ≤ In ≤ Iz (design current ≤ device nominal rating ≤ cable current-carrying capacity), and I2 ≤ 1.45 × Iz (the fusing/tripping current must not exceed 1.45 times the cable capacity). Reg 433.1.1."},
  {topic:"Part 4", q:"Write out the adiabatic equation and say what it checks.", a:"S = √(I² t) / k. It checks that a conductor's cross-sectional area is large enough to withstand the thermal energy of a fault until the protective device disconnects, without exceeding its limiting temperature. Reg 434.5.2."},
  {topic:"Part 4", q:"In A2:2022, when must protection against transient overvoltage (an SPD) be provided?", a:"Where the consequence of overvoltage could result in serious injury/loss of life, interruption of public services, damage to cultural heritage, interruption of commercial/industrial activity, or affect a large number of co-located people. Otherwise a risk assessment (or simply fitting an SPD) decides — Section 443."},
  {topic:"Part 5", q:"State the UK harmonised colours for line, neutral and CPC.", a:"Line = brown, Neutral = blue, Circuit Protective Conductor (CPC) = green-and-yellow. (Three-phase: brown / black / grey for L1/L2/L3.)"},
  {topic:"Part 5", q:"A cable is buried 30mm deep in a plastered wall with no mechanical protection and not in a permitted zone. What's required?", a:"30mA RCD additional protection for that circuit (Reg 522.6.202), because it is less than 50mm deep, not mechanically protected, and not within a recognised safe zone."},
  {topic:"Part 5", q:"How is the minimum size of a main protective bonding conductor decided on a PME (TN-C-S) supply?", a:"From Table 54.8, based on the supply neutral conductor CSA — commonly 10mm² where the supply neutral is up to 35mm². For non-PME systems the minimum is generally 6mm² (Reg 544.1.1)."},
  {topic:"Part 5", q:"Which RCD types are suitable where DC fault currents may occur (e.g. EV chargers)?", a:"Type A copes with pulsating DC; Type F adds mixed frequencies; Type B handles smooth DC. EV charge points need protection against DC faults — either a Type B RCD or a Type A RCD plus 6mA DC fault detection within the charger (Reg 531.3.3 / 722)."},
  {topic:"Part 6", q:"State the correct sequence of dead tests for initial verification.", a:"Continuity of protective conductors (and ring final circuit conductors) → insulation resistance → polarity (dead). Then live tests: earth electrode resistance, earth fault loop impedance (Zs), prospective fault current and RCD operation."},
  {topic:"Part 6", q:"What do the EICR classification codes C1, C2, C3 and FI mean?", a:"C1 = danger present, risk of injury, immediate action required. C2 = potentially dangerous, urgent remedial action required. C3 = improvement recommended (not a fail). FI = further investigation required. A C1, C2 or FI makes the report Unsatisfactory."},
  {topic:"Part 6", q:"Which certificate is issued for adding a single socket-outlet to an existing circuit?", a:"A Minor Electrical Installation Works Certificate (MEIWC) — used for additions/alterations that do not include a new circuit. A new circuit requires an Electrical Installation Certificate (EIC)."},
  {topic:"Part 7", q:"Describe the bathroom zones 0, 1 and 2.", a:"Zone 0: the interior of the bath tub or shower basin. Zone 1: above zone 0 up to 2.25m. Zone 2: the 0.6m wide space horizontally adjacent to zone 1. Each zone has IP rating and equipment restrictions (Section 701)."},
  {topic:"Part 7", q:"When may supplementary bonding be omitted in a bathroom?", a:"When all of the following are met: main protective bonding is in place, all circuits satisfy the disconnection times of 411, and all extraneous-conductive-parts are connected to the main earthing terminal (Reg 701.415.2)."},
  {topic:"Part 7", q:"Why is PME (TN-C-S) earthing generally not used for an EV charge point installed outdoors or for a caravan pitch?", a:"Because an open PEN conductor fault could raise the earthed metalwork (and the vehicle/caravan) to a dangerous potential. An earth electrode, or a device that disconnects on open-PEN/voltage detection, is used instead (722.411.4 / 708.411.4)."},
  {topic:"Part 7", q:"What protection does each EV charging point generally require?", a:"Its own 30mA RCD, plus protection against DC fault current — typically a Type B RCD, or a Type A RCD combined with 6mA DC fault detection built into the charging equipment (Section 722)."},
  {topic:"Part 8", q:"What is a 'prosumer's installation' and which Part covers it?", a:"An installation that both consumes and produces/stores electrical energy (e.g. solar PV + battery + EV). It is covered by Part 8, Chapter 82, working alongside Appendix 17 (Energy Efficiency)."},
  {topic:"Appendices", q:"Which appendix holds the cable current-carrying capacities and the correction factors Ca, Cg, Ci?", a:"Appendix 4 — current-carrying capacity and voltage drop, including ambient temperature (Ca), grouping (Cg), thermal insulation (Ci) and BS 3036 fuse (Cf) correction factors."},
  {topic:"Appendices", q:"Which appendix gives the time/current trip curves for MCBs and RCDs?", a:"Appendix 3 — time/current characteristics of overcurrent protective devices and RCDs."},
  {topic:"Appendices", q:"Where do you find the model Electrical Installation Certificate and EICR?", a:"Appendix 6 — model forms for certification and reporting, including the schedules of inspections and test results."},
  {topic:"Part 1", q:"What voltage range does BS 7671 cover?", a:"Up to and including <strong>1000V a.c.</strong> or <strong>1500V d.c.</strong> between conductors (Reg 110.1.2). Above this is high voltage and outside the standard's scope."},
  {topic:"Part 1", q:"Does BS 7671 have legal force in its own right?", a:"No — it is <em>non-statutory</em>. But compliance is widely accepted as demonstrating that the legal requirements of statutory law (such as the Electricity at Work Regulations) have been met. See Chapter 11/14."},
  {topic:"Part 1", q:"When is a departure from the Regulations permitted, and what must you do?", a:"Where a regulation cannot be strictly applied, a departure is allowed only if the resulting degree of safety is <em>not less</em> than that intended by BS 7671 (Reg 120.3 / 133.5). Any departure must be recorded on the certificate."},
  {topic:"Part 1", q:"When making an addition or alteration, what must be confirmed about the existing installation?", a:"That the existing earthing and bonding arrangements and the rating/condition of equipment the new work relies on are <em>adequate</em> for the altered circumstances (Reg 132.16)."},
  {topic:"Part 2", q:"Define an 'exposed-conductive-part'.", a:"A conductive part of equipment that can be touched and is not normally live, but which may become live under fault conditions — e.g. a metal appliance casing. Contrast with an extraneous-conductive-part, which is not part of the installation."},
  {topic:"Part 2", q:"What is a PEN conductor?", a:"A conductor combining the functions of both a <em>protective (earthing)</em> conductor and a <em>neutral</em> conductor. Found in TN-C systems and on the supply side of a TN-C-S (PME) arrangement."},
  {topic:"Part 2", q:"Distinguish 'basic insulation', 'double insulation' and 'reinforced insulation'.", a:"Basic insulation provides basic protection. Double insulation = basic + supplementary insulation. Reinforced insulation is a single system giving equivalent protection to double insulation. Double/reinforced underpins Class II equipment."},
  {topic:"Part 2", q:"What is the difference between protective earthing and functional earthing?", a:"<strong>Protective</strong> earthing is for <em>safety</em> (connecting exposed-conductive-parts to earth for fault protection). <strong>Functional</strong> earthing is provided for the correct <em>operation</em> of equipment (e.g. clean earth for electronics), not primarily for safety."},
  {topic:"Part 2", q:"What do the symbols Uo and U represent?", a:"<strong>Uo</strong> is the nominal voltage line-to-earth (230V in the UK). <strong>U</strong> is the nominal voltage line-to-line (400V three-phase). Disconnection calculations use Uo."},
  {topic:"Part 3", q:"What does Reg 314 require the installation to be divided into, and why?", a:"Into separate <em>circuits</em>, to limit the consequences of a fault, minimise inconvenience on isolation, reduce unwanted tripping, and make inspection, testing and maintenance safe and convenient (314.1)."},
  {topic:"Part 3", q:"Name three characteristics of the supply that must be determined at the assessment stage.", a:"Any of: nominal voltage (Uo/U), frequency, prospective fault current, external earth fault loop impedance (Ze), type of earthing arrangement, and maximum demand (Reg 313.1)."},
  {topic:"Part 3", q:"What is meant by 'maximum demand and diversity'?", a:"An estimate of the greatest load the installation will actually draw, allowing for the fact that not all loads operate at full current at once. It is used to size the supply and distribution equipment economically (Reg 311)."},
  {topic:"Part 3", q:"How is the external-influence coding system structured?", a:"Three parts: a <em>first letter</em> for the category (A = environment, B = utilisation, C = building construction), a <em>second letter</em> for the nature of the influence, and a <em>number</em> for the class/severity — e.g. AD4. Listed in Appendix 5."},
  {topic:"Part 3", q:"What does the external-influence code 'AD' describe?", a:"The <strong>presence of water</strong>. The class number (AD1–AD8) sets the severity from negligible up to immersion, which then drives the IP rating selected for equipment."},
  {topic:"Part 3", q:"Which prospective fault current must be assessed for sizing protective devices?", a:"The <em>greater</em> of the prospective short-circuit current (line-to-neutral/line-to-line) and the prospective earth fault current. The device breaking capacity must equal or exceed it (Chapter 31 / 434.5.1)."},
  {topic:"Part 4", q:"What three elements make up Automatic Disconnection of Supply (ADS)?", a:"Basic protection (insulation/barriers/enclosures), fault protection by protective earthing and equipotential bonding, and a protective device that automatically disconnects within the required time (Reg 411)."},
  {topic:"Part 4", q:"State the TN earth-fault disconnection condition.", a:"<strong>Zs &times; Ia &le; Uo</strong>, usually written <strong>Zs &le; Uo / Ia</strong>: the measured loop impedance must be low enough that the fault current reaches the device's operating value within the required disconnection time (411.4.4)."},
  {topic:"Part 4", q:"State the key TT system condition involving the earth electrode.", a:"<strong>Ra &times; I&Delta;n &le; 50V</strong> — the product of the earth electrode resistance and the RCD's rated residual operating current must not exceed 50V, keeping touch voltage safe (411.5.3)."},
  {topic:"Part 4", q:"What does 'additional protection' by a 30mA RCD actually provide?", a:"A further layer of protection for when basic or fault protection fails, or where there is carelessness by users. It is <em>not</em> a substitute for basic/fault protection (415.1)."},
  {topic:"Part 4", q:"What minimum IP ratings apply to barriers and enclosures for basic protection?", a:"At least <strong>IPXXB / IP2X</strong> generally, rising to <strong>IPXXD / IP4X</strong> for readily accessible horizontal top surfaces (Reg 416.2)."},
  {topic:"Part 4", q:"How does the protective measure 'SELV' achieve protection?", a:"By limiting voltage to extra-low values from a safety-isolating source, with the circuit unearthed and simply separated from higher-voltage circuits. Combined basic + fault protection where voltage limits and separation are met (Section 414)."},
  {topic:"Part 4", q:"What is the protective measure 'electrical separation'?", a:"Supplying a circuit from an isolating source (e.g. an isolating transformer to BS EN 61558) so the separated circuit has no connection to earth or other circuits, preventing a single earth fault from causing a shock (Section 413)."},
  {topic:"Part 4", q:"What characterises Class II equipment?", a:"Protection by <em>double or reinforced insulation</em> with no reliance on protective earthing. It carries the double-square symbol and must not have its exposed metalwork connected to a protective conductor (Section 412)."},
  {topic:"Part 4", q:"What two phenomena does 'overcurrent' protection cover?", a:"<strong>Overload</strong> current (in an otherwise healthy circuit) and <strong>fault</strong> current (short-circuit or earth fault). Chapter 43 addresses both (Reg 431)."},
  {topic:"Part 4", q:"What is required of consumer unit enclosures in domestic premises?", a:"They must be <em>non-combustible</em> (e.g. steel) or enclosed in a non-combustible cabinet, following the metal consumer unit requirement (Reg 421.1.201)."},
  {topic:"Part 5", q:"Other than colour, how may conductors be identified?", a:"By <em>lettering or numbering</em>, particularly at terminations. The green-and-yellow bi-colour combination is reserved <strong>exclusively</strong> for protective conductors and must never be used for anything else (Section 514)."},
  {topic:"Part 5", q:"Must every electrical connection be accessible, and are there exceptions?", a:"Connections must be accessible for inspection, testing and maintenance (526.3) <em>unless</em> they are: a compound-filled or encapsulated joint, a maintenance-free (MF) connection, a connection within equipment, or buried underground in an approved way."},
  {topic:"Part 5", q:"Why must wiring on escape routes use suitable supports?", a:"So cables cannot collapse prematurely in a fire and obstruct escape. Plastic-only clips can soften and let cables fall, so fire-resistant metallic supports are required (Reg 521.10.202)."},
  {topic:"Part 5", q:"What must a means of isolation achieve?", a:"Secure disconnection of the installation/circuit from <em>every</em> source of electrical energy, with adequate contact separation, and it should be capable of being secured against inadvertent reclosure (Reg 537.2)."},
  {topic:"Part 5", q:"Distinguish isolation, functional switching and emergency switching.", a:"<strong>Isolation</strong> — secure cut-off from all supplies for safe working. <strong>Functional switching</strong> — everyday on/off control of a circuit. <strong>Emergency switching</strong> — rapid removal of an unexpected danger (e.g. emergency stop). Section 537."},
  {topic:"Part 5", q:"Using Table 54.7, how is a CPC sized by selection?", a:"If the line conductor is &le;16mm&sup2;, the CPC equals the line CSA; if &gt;16mm&sup2; up to 35mm&sup2;, the CPC is 16mm&sup2;; if &gt;35mm&sup2;, the CPC is half the line CSA (same material assumed)."},
  {topic:"Part 5", q:"What does BS 7671 require where protective conductor current is high?", a:"A high-integrity protective conductor arrangement — typically a single CPC of at least <strong>10mm&sup2;</strong>, or duplicated CPCs — to guard against the consequences of a broken earth (Reg 543.7), common where many IT loads are present."},
  {topic:"Part 5", q:"How does the installation 'reference method' affect a cable's rating?", a:"It sets how heat escapes. Method C (clipped direct) allows a higher current than the same cable in conduit in an insulated wall (Method A). You pick the reference method first, then read the current-carrying capacity from Appendix 4."},
  {topic:"Part 5", q:"What is the role of the Main Earthing Terminal (MET)?", a:"The common connection point joining the earthing conductor, the main protective bonding conductors and the circuit protective conductors of the installation (Section 542/543)."},
  {topic:"Part 6", q:"State the standard test voltages and minimum insulation resistance values.", a:"SELV/PELV: 250V d.c., minimum 0.5M&Omega;. Circuits up to 500V (incl. 230/400V): 500V d.c., minimum 1.0M&Omega;. Above 500V: 1000V d.c., minimum 1.0M&Omega; (Table 64)."},
  {topic:"Part 6", q:"How is the continuity of a ring final circuit verified?", a:"By the (r1 + r2) end-to-end method: measure each conductor loop, then cross-connect line and CPC and measure at each socket. A steady reading roughly equal to (r1 + r2)/4 confirms an unbroken ring with no interconnections (Reg 643.2.1)."},
  {topic:"Part 6", q:"What does measuring Zs at a point on a circuit confirm?", a:"That the earth fault loop impedance is low enough for the protective device to disconnect within the required time — the measured value must be &le; the maximum tabulated Zs (corrected for temperature) for that device (Reg 643.7)."},
  {topic:"Part 6", q:"Does pressing an RCD's test button prove it will protect against shock?", a:"No — the integral button only proves the mechanical tripping operates. Trip <em>times</em> and <em>currents</em> must be verified with a test instrument (Reg 643.8)."},
  {topic:"Part 6", q:"What is the difference between an EIC and an EICR?", a:"An <strong>Electrical Installation Certificate</strong> certifies <em>new</em> work / initial verification. An <strong>Electrical Installation Condition Report</strong> records the findings of a <em>periodic</em> inspection of an existing installation (Reg 641 vs 651)."},
  {topic:"Part 6", q:"What do the EICR observation codes C1, C2, C3 and FI mean?", a:"<strong>C1</strong> Danger present — immediate action required. <strong>C2</strong> Potentially dangerous — urgent remedial action. <strong>C3</strong> Improvement recommended. <strong>FI</strong> Further investigation required. A C1 or C2 (or FI) makes the report Unsatisfactory."},
  {topic:"Part 7", q:"How is shock protection achieved in the highest-risk zones of a swimming pool?", a:"By SELV (typically 12V a.c.) with the safety source located outside zones 0 and 1, plus supplementary bonding and strict equipment selection — Section 702."},
  {topic:"Part 7", q:"What is the key concern in a sauna (Section 703)?", a:"High temperature. The sauna is divided into temperature zones, and equipment (especially in the hottest upper zone) must be selected to withstand the temperature it will experience, with appropriate IP protection — Section 703."},
  {topic:"Part 7", q:"Why are construction sites (Section 704) given enhanced protection?", a:"Because of the harsh, wet environment and increased shock risk. Reduced low-voltage systems (e.g. 110V centre-tapped earth giving 55V to earth) and RCDs are used, and disconnection requirements are stricter — Section 704."},
  {topic:"Part 7", q:"What extra protection do agricultural and horticultural premises require?", a:"Livestock tolerate far lower touch voltages than people, so socket-outlets up to 32A need 30mA RCDs, other circuits an RCD &le;100mA, with supplementary bonding in animal locations — Section 705."},
  {topic:"Part 7", q:"How must socket-outlets be protected on a caravan/camping park (Section 708)?", a:"Each pitch socket-outlet must be individually protected by its own <strong>30mA RCD</strong>, mounted at a suitable height with appropriate IP rating, with limits on sockets served per pitch — Section 708."},
  {topic:"Part 7", q:"What characterises a marina installation (Section 709)?", a:"A wet, corrosive, salt-laden environment near water. Each berth socket needs 30mA RCD protection, equipment requires a high IP rating and corrosion resistance, and PME earthing of boats is restricted — Section 709."},
  {topic:"Part 7", q:"Why can't the DC side of a solar PV array simply be switched off (Section 712)?", a:"The PV modules generate voltage whenever they are illuminated, so the DC side must be treated as <em>live</em> in daylight. Isolation is required on both AC and DC sides, with clear warning labelling — Section 712."},
  {topic:"Part 8", q:"What does Part 8 of BS 7671 cover?", a:"Functional requirements rather than safety alone — principally <strong>energy efficiency</strong> (Chapter 82) and prosumer (local production and storage) installations, supported by Appendix 17."},
  {topic:"Part 8", q:"Are the energy-efficiency requirements of Part 8 mandatory for every installation?", a:"No — Part 8 is a <em>functional</em> Part. It provides a framework and rating system for efficiency measures (such as load management and metering) applied where specified by the client or designer, not a safety mandate."},
  {topic:"Part 8", q:"In a prosumer installation with on-site generation, why must isolation be considered carefully?", a:"Because the installation can be energised from <em>more than one source</em> (grid, PV, battery). The means of isolation must disconnect <strong>every</strong> source, and a warning notice must indicate that multiple supplies are present \u2014 Chapter 82."},
  {topic:"Part 8", q:"Where current can flow in both directions (e.g. PV export or battery), what does Reg 530.3.201 require of switchgear and protective devices?", a:"They must be <em>suitable for, and correctly connected for, bidirectional operation</em>. A device intended for one direction of energy flow must not be relied upon where the flow can reverse \u2014 a key prosumer consideration."},
  {topic:"Part 8", q:"Name three electrical energy-efficiency measures associated with Appendix 17.", a:"Any of: load/demand management, efficient metering and monitoring, power-factor correction, sizing cables to reduce losses, and efficient transformers/motors. Appendix 17 also gives an efficiency assessment and rating framework."},
  {topic:"Appendices", q:"Which appendix lists the British Standards referred to throughout BS 7671?", a:"<strong>Appendix 1</strong> \u2014 British Standards to which reference is made in the Regulations."},
  {topic:"Appendices", q:"Where would you look to see which statutory laws relate to electrical work?", a:"<strong>Appendix 2</strong> \u2014 Statutory regulations and associated memoranda (e.g. the Electricity at Work Regulations, ESQCR and Building Regulations)."},
  {topic:"Appendices", q:"Which appendix classifies external influences using codes such as \u2018AD\u2019 for the presence of water?", a:"<strong>Appendix 5</strong> \u2014 Classification of external influences. First letter = category (A environment, B utilisation, C building), second letter = nature, number = class."},
  {topic:"Appendices", q:"Which appendix gives the harmonised cable core colours?", a:"<strong>Appendix 7</strong> \u2014 Harmonised cable core colours (e.g. brown line, blue neutral, green-and-yellow protective)."},
  {topic:"Appendices", q:"Where are the recommended voltage-drop limits (3% lighting / 5% other) explained?", a:"<strong>Appendix 12</strong> \u2014 Voltage drop in consumers\u2019 installations. The mV/A/m figures for the calculation itself are in Appendix 4."},
  {topic:"Appendices", q:"Which appendix covers correcting a measured Zs for conductor temperature (the 0.8 rule of thumb)?", a:"<strong>Appendix 14</strong> \u2014 Measurement of earth fault loop impedance, allowing for the rise in conductor resistance with temperature; a common check is measured Zs &le; 0.8 &times; tabulated maximum Zs."},
  {topic:"Appendices", q:"Which appendix sets out the standard ring and radial final circuit arrangements?", a:"<strong>Appendix 15</strong> \u2014 Ring and radial final circuit arrangements (linked to Regulation 433.1), including the common 32 A ring and radial conductor sizes."}
];

const MCQS = [
  {topic:"Part 5", q:"Amendment 3:2024 added Regulation 530.3.201. What does it require designers and installers to take account of?", options:["The IP rating of every accessory","Whether a protective device is unidirectional or bidirectional","The colour coding of all conductors","The ambient temperature of the consumer unit"], correct:1, explain:"Reg 530.3.201 (new in A3:2024) requires the appropriate use of unidirectional vs bidirectional protective devices — important where power can flow both ways (PV, storage, EV V2G)."},
  {topic:"Part 2", q:"A protective device the manufacturer intends to have the supply connected to one defined set of terminals only is termed:", options:["A bidirectional protective device","A unidirectional protective device","An omnidirectional device","A reversible device"], correct:1, explain:"That is a unidirectional protective device (Part 2, added by A3:2024). A bidirectional device can have supply on either or both sets of terminals."},
  {topic:"Part 1", q:"BS 7671 specifically does NOT apply to which of the following?", options:["A domestic dwelling","A construction site","Equipment on board a ship","A caravan park"], correct:2, explain:"Reg 110.2 excludes ships, aircraft, traction, mines/quarries and motor vehicles. The others are all within scope (110.1.2)."},
  {topic:"Part 1", q:"Which regulation group sets out the fundamental design requirements such as load assessment and diversity?", options:["Reg 131","Reg 132","Reg 133","Reg 134"], correct:1, explain:"Reg 132 covers design. 131 is protection for safety, 133 is selection of equipment, 134 is erection and initial verification."},
  {topic:"Part 2", q:"A metal water pipe entering a building from outside is best described as:", options:["An exposed-conductive-part","An extraneous-conductive-part","A protective conductor","A live part"], correct:1, explain:"It is not part of the installation but can introduce earth potential — the definition of an extraneous-conductive-part (Part 2)."},
  {topic:"Part 2", q:"A SELV system differs from a PELV system because SELV:", options:["Is always 12V","Is not connected to earth","Uses no transformer","Is only for bathrooms"], correct:1, explain:"SELV has no connection to earth; PELV may have one point earthed. Both use a safety-isolating source (Part 2 / Section 414)."},
  {topic:"Part 3", q:"In a TN-C-S (PME) system, the neutral and protective functions are:", options:["Always separate","Combined throughout","Combined in the supply, separated in the installation","Never connected"], correct:2, explain:"PME combines them as a PEN conductor at the supply, splitting into separate N and PE within the installation (Reg 312.2)."},
  {topic:"Part 3", q:"Which earthing system relies on its own earth electrode and typically requires RCD protection?", options:["TN-S","TN-C-S","TT","IT"], correct:2, explain:"TT uses a local earth electrode; the high loop impedance means an RCD is normally needed to achieve disconnection."},
  {topic:"Part 4", q:"The maximum disconnection time for a 230V, 32A final circuit on a TN system is:", options:["0.2s","0.4s","1s","5s"], correct:1, explain:"Table 41.1: final circuits up to 32A on TN systems must disconnect within 0.4s. (TT would be 0.2s.)"},
  {topic:"Part 4", q:"Which circuit does NOT explicitly require 30mA RCD additional protection under A2:2022?", options:["Socket-outlets rated ≤32A","A lighting circuit in a dwelling","A dedicated 45A cooker circuit on a surface-run cable in safe zones","Cables buried <50mm in a wall"], correct:2, explain:"A surface/safe-zone cooker circuit isn't automatically caught. Sockets ≤32A (411.3.3), dwelling lighting (411.3.4) and shallow concealed cables (522.6.202) all require a 30mA RCD."},
  {topic:"Part 4", q:"AFDDs are REQUIRED by A2:2022 for socket-outlet circuits ≤32A in:", options:["All domestic premises","Higher-Risk Residential Buildings, HMOs, student accommodation and care homes","Industrial units only","Outdoor installations only"], correct:1, explain:"Reg 421.1.7 requires AFDDs in those higher-risk premises and recommends them elsewhere."},
  {topic:"Part 4", q:"The correct overload coordination relationship is:", options:["Iz ≤ In ≤ Ib","In ≤ Ib ≤ Iz","Ib ≤ In ≤ Iz","Ib ≤ Iz ≤ In"], correct:2, explain:"Design current ≤ device rating ≤ cable capacity: Ib ≤ In ≤ Iz (Reg 433.1.1)."},
  {topic:"Part 4", q:"The adiabatic equation S = √(I²t)/k is used to:", options:["Calculate voltage drop","Verify a conductor withstands fault energy","Size a main bonding conductor by table","Set the RCD rating"], correct:1, explain:"It confirms the conductor CSA survives the let-through energy of a fault before disconnection (Reg 434.5.2)."},
  {topic:"Part 4", q:"Surge Protective Devices are covered for selection and erection in which section?", options:["Section 443","Section 534","Section 537","Section 559"], correct:1, explain:"Section 443 decides WHEN an SPD is needed; Section 534 covers the selection and erection of the SPD itself."},
  {topic:"Part 5", q:"The harmonised colour for a circuit protective conductor is:", options:["Blue","Brown","Black","Green-and-yellow"], correct:3, explain:"CPC = green-and-yellow; line = brown; neutral = blue (Section 514)."},
  {topic:"Part 5", q:"A cable run 40mm deep in a plastered stud wall, not mechanically protected and outside the permitted zones, requires:", options:["No additional protection","30mA RCD additional protection","A 100mA RCD","Mineral-insulated cable only"], correct:1, explain:"Less than 50mm and not protected/in a safe zone triggers 30mA RCD additional protection (Reg 522.6.202)."},
  {topic:"Part 5", q:"Which RCD type is the minimum suitable choice where smooth DC fault current may occur?", options:["Type AC","Type A","Type F","Type B"], correct:3, explain:"Type B is required for smooth DC. Type AC only handles AC; Type A handles pulsating DC (Reg 531.3.3)."},
  {topic:"Part 5", q:"On a PME supply with a 25mm² supply neutral, a typical minimum main protective bonding conductor is:", options:["4mm²","6mm²","10mm²","16mm²"], correct:2, explain:"Table 54.8 gives 10mm² for PME supplies where the neutral is up to 35mm²."},
  {topic:"Part 6", q:"Which test is carried out FIRST in the dead test sequence?", options:["Insulation resistance","Earth fault loop impedance","Continuity of protective conductors","RCD operation"], correct:2, explain:"Continuity (of protective conductors and ring conductors) comes first, then insulation resistance, then polarity (dead)."},
  {topic:"Part 6", q:"On an EICR, an observation coded C2 means:", options:["Improvement recommended","Danger present, immediate action","Potentially dangerous, urgent remedial action","No action needed"], correct:2, explain:"C2 = potentially dangerous, urgent remedial action required, and it renders the report Unsatisfactory."},
  {topic:"Part 6", q:"Adding one socket-outlet to an existing ring final circuit should be certified with:", options:["An EIC","A MEIWC","An EICR","No certificate"], correct:1, explain:"A Minor Electrical Installation Works Certificate is used for additions that don't include a new circuit."},
  {topic:"Part 7", q:"In a bathroom, Zone 1 extends:", options:["Inside the bath only","Above the bath/shower up to 2.25m","0.6m beyond the bath","Over the whole room"], correct:1, explain:"Zone 1 is the volume above the basin up to 2.25m; Zone 0 is inside the basin; Zone 2 is 0.6m beyond Zone 1 (701.32)."},
  {topic:"Part 7", q:"A domestic EV charge point installed outdoors using a TN-C-S supply must address:", options:["Voltage drop only","The risk from an open PEN conductor","Harmonics only","Stroboscopic effect"], correct:1, explain:"Open-PEN risk means an earth electrode or open-PEN/voltage-detection protection is required (Reg 722.411.4)."},
  {topic:"Part 7", q:"Supplementary equipotential bonding in a bathroom may be omitted when:", options:["The room is small","Main bonding is present, ADS times are met and all extraneous parts are connected to the MET","Plastic pipes are used somewhere","An RCD is fitted to the lighting only"], correct:1, explain:"All three conditions of Reg 701.415.2 must be satisfied to omit supplementary bonding."},
  {topic:"Part 8", q:"Chapter 82 of Part 8 deals with:", options:["Bathrooms","Prosumer's low-voltage installations","Inspection and testing","Definitions"], correct:1, explain:"Part 8 / Chapter 82 covers prosumer (produce + consume) installations with local generation and storage."},
  {topic:"Part 8", q:"Part 8 is unusual among the Parts of BS 7671 because it sets out:", options:["Safety requirements","Functional requirements","Definitions","Test procedures"], correct:1, explain:"Parts 1–7 are largely about safety; Part 8 covers functional matters such as prosumer installations and energy efficiency."},
  {topic:"Part 8", q:"A prosumer's electrical installation is one that:", options:["Only draws power from the grid","Both consumes and produces/stores electrical energy locally","Has no metering","Supplies only lighting"], correct:1, explain:"A prosumer both produces and consumes — e.g. solar PV plus battery storage alongside the grid connection. Chapter 82."},
  {topic:"Part 8", q:"Local electrical energy storage in a prosumer installation is typically provided by:", options:["A larger fuse","A battery system","A bigger CPC","An extra RCD"], correct:1, explain:"Prosumer installations commonly pair generation (e.g. PV) with battery storage, so the design must manage bidirectional power flow."},
  {topic:"Part 8", q:"Energy-efficiency guidance in BS 7671 is given (informatively) in:", options:["Appendix 3","Appendix 4","Appendix 6","Appendix 17"], correct:3, explain:"Appendix 17 sets out electrical energy-efficiency measures and a rating framework. It is informative guidance, not a safety mandate."},
  {topic:"Part 8", q:"Are the energy-efficiency provisions of Part 8 a mandatory safety requirement?", options:["Yes, always mandatory","No — they are functional, applied where required by the client or designer","Yes, by criminal law","Only in dwellings"], correct:1, explain:"Unlike the safety Parts, these are functional measures applied where specified — not a blanket legal safety duty."},

  {term:"Insulation", cat:"Shock protection", def:"Material applied to conductors to prevent the passage of current and provide protection against electric shock."},
  {term:"Isolation", cat:"Devices", def:"Cutting off a circuit/equipment from every source of supply for safety, in a way that is secure against inadvertent reclosure."},
  {term:"IT system", cat:"Earthing & bonding", def:"A system with no direct connection between live parts and earth (or earthed through a high impedance); exposed-conductive-parts are earthed independently."},

  {term:"Line conductor", cat:"General", def:"A conductor of an AC system for the transmission of energy, other than a neutral or protective conductor (the 'live'/'phase' — brown in the UK)."},
  {term:"Live part", cat:"Shock protection", def:"A conductor or conductive part intended to be energised in normal use, including a neutral conductor."},
  {term:"Low voltage", cat:"Voltages", def:"Voltage normally exceeding extra-low voltage but not exceeding 1000 V AC or 1500 V DC between conductors (50–1000 V AC to earth) — the band BS 7671 mainly addresses."},

  {term:"Neutral conductor", cat:"General", def:"A conductor connected to the neutral point of a system that contributes to the transmission of energy (blue in the UK)."},

  {term:"PELV (protective extra-low voltage)", cat:"Voltages", def:"An extra-low-voltage system from a safety source that is electrically separated from other circuits but, unlike SELV, may have one point connected to earth."},

  {term:"Ring final circuit", cat:"Wiring", def:"A final circuit wired as a loop, starting and ending at the same protective device, so each point is fed from two directions (the classic UK ring main)."},
  {term:"Safety service", cat:"General", def:"An electrical system for equipment provided to protect or warn people in danger, or essential to their safety — e.g. emergency lighting, fire alarms."},
  {term:"SELV (separated extra-low voltage)", cat:"Voltages", def:"An extra-low-voltage system from a safety-isolating source, electrically separated from earth and from other circuits (no earth connection)."},
  {term:"Shock current", cat:"Shock protection", def:"A current passing through a human or animal body of a magnitude that may have harmful physiological effects."},
  {term:"Simultaneously accessible parts", cat:"Shock protection", def:"Conductors or conductive parts that can be touched at the same time — relevant to touch voltage and the need for bonding."},
  {term:"Skilled person (electrically)", cat:"Persons", def:"A person with relevant education and experience to enable them to perceive risks and avoid dangers that electricity can create."},
  {term:"Socket-outlet", cat:"Wiring", def:"A device with socket contacts intended for connection to a plug, and for the connection of flexible cords to the fixed wiring."},
  {term:"Spur", cat:"Wiring", def:"A branch from a ring or radial final circuit — a fused spur has its own fuse; a non-fused spur is limited in what it may supply."},
  {term:"Stationary equipment", cat:"General", def:"Fixed equipment, or equipment over 18 kg not provided with a carrying handle — not intended to be moved in normal use."},
  {term:"Supplementary insulation", cat:"Shock protection", def:"Independent insulation applied in addition to basic insulation, to provide fault protection (together they form double insulation)."},
  {term:"Supplementary equipotential bonding", cat:"Earthing & bonding", def:"Local bonding connecting simultaneously-accessible exposed- and extraneous-conductive-parts to limit touch voltage during a fault (historically in bathrooms)."},
  {term:"Switchgear", cat:"Devices", def:"Equipment for switching, controlling and protecting circuits — the assembly of switches, fuses, circuit-breakers and associated control gear."},
  {term:"System (TN, TT, IT)", cat:"Earthing & bonding", def:"A live conductor (or conductors) and the protective conductors, classified by how the supply and installation are earthed — TN, TT or IT."},
  {term:"TN-S system", cat:"Earthing & bonding", def:"A TN system with separate neutral and protective conductors throughout, the earth provided via the supply cable (e.g. the cable sheath) — low Ze."},
  {term:"TN-C-S system", cat:"Earthing & bonding", def:"A TN system where neutral and protective functions are combined (PEN) in the supply and separated within the installation — UK PME; very low Ze."},
  {term:"TT system", cat:"Earthing & bonding", def:"A system where one point of the supply is earthed and the installation's exposed-conductive-parts are connected to an independent earth electrode — high Ze, needs RCDs."},
  {term:"Touch voltage", cat:"Shock protection", def:"The voltage appearing between simultaneously-accessible parts during an insulation fault — kept low by ADS and bonding."},
  {term:"Unidirectional protective device", cat:"Devices", def:"NEW (A3:2024). A device the manufacturer intends to have the supply connected to one defined set of terminals only — its line/load sides must be wired the correct way round."},
  {term:"Voltage band I", cat:"Voltages", def:"The lower voltage band covering extra-low voltage and systems where protection against shock is provided by the low value of voltage (e.g. SELV/PELV)."},
  {term:"Voltage band II", cat:"Voltages", def:"The band covering voltages for normal supply to installations — i.e. low voltage up to 1000 V AC, including the 230/400 V supply."},
  {term:"Wiring system", cat:"Wiring", def:"An assembly of one or more cables or busbars and the parts that fix, support and (if necessary) enclose them — e.g. cables in conduit or on a tray."}

  why:"Definitions sit in Part 2. \u2018Residual current\u2019 is exactly this algebraic sum \u2013 in a healthy circuit it is zero, which is the principle an RCD relies on. \u2018Return current\u2019 isn\u2019t a defined term, so it can be ruled straight out." },

{ p:2, reg:"Part 2 / Fig 417", q:"What horizontal distance does \u2018arm\u2019s reach\u2019 represent?",
  o:["1.25 m","0.75 m","2.5 m","6 m"], a:2,
  why:"Look up \u2018arm\u2019s reach\u2019 in Part 2 Definitions; it refers you to a figure giving a 2.5 m limit from a surface a person normally stands on. The list of all figures near the back of the book is a quick shortcut to that diagram." },

{ p:2, reg:"Part 2 \u2013 Definitions", q:"A conductive part that can be touched, is not normally live, but could become live under a fault is called a?",
  o:["Exposed-conductive-part","Extraneous-conductive-part","Live part","Protective conductor"], a:0,
  why:"Part 2. An exposed-conductive-part belongs to the equipment (e.g. a metal appliance casing). Don\u2019t confuse it with an extraneous-conductive-part, which is NOT part of the installation \u2013 the wording \u2018part of the equipment\u2019 is the discriminator." },

{ p:2, reg:"Part 2 \u2013 Definitions", q:"A metallic water pipe entering a building, liable to introduce earth potential, is an example of a/an?",
  o:["Exposed-conductive-part","Extraneous-conductive-part","Functional earth","Live conductor"], a:1,
  why:"Part 2. An extraneous-conductive-part is not part of the electrical installation but can introduce a potential (usually earth) \u2013 incoming metal services are the textbook case, which is why they get main protective bonding." },

{ p:2, reg:"Part 2 \u2013 Definitions (SELV)", q:"For a SELV system, the nominal voltage must not exceed?",
  o:["50 V a.c.","120 V a.c.","230 V a.c.","12 V a.c."], a:0,
  why:"Part 2 / Chapter 41. Extra-low voltage is the band not exceeding 50 V a.c. (or 120 V ripple-free d.c.). SELV adds the conditions of a safety source and no earth connection, but the voltage ceiling is the 50 V a.c. figure." },

{ p:2, reg:"Part 2 \u2013 Definitions", q:"In a reduced low voltage system, the nominal line-to-earth voltage must not exceed?",
  o:["50 volts","63.5 volts","65.3 volts","120 volts"], a:1,
  why:"Part 2. A reduced low voltage system is defined by two figures: line-to-line not above 110 V and line-to-earth not above 63.5 V. Beware the deliberately reversed digits \u201865.3\u2019 \u2013 it is there to catch a rushed reader." },

/* ------------------------------- PART 3 --------------------------------- */
{ p:3, reg:"312.2", q:"In the earthing-system letter code, what does the first letter \u2018I\u2019 (as in an IT system) indicate?",
  o:["One point of the source is directly earthed","All live parts are isolated from earth (or earthed via high impedance)","Neutral and protective functions are combined","Neutral and protective functions are separate"], a:1,
  why:"Section 312.2 \u2018Types of earthing arrangement\u2019 (Part 3) explains the letter code in its notes. The first letter describes the source-to-earth relationship: T = a point directly earthed, I = isolated from earth (or via a high impedance)." },

{ p:3, reg:"312.2.1", q:"Which earthing system has the neutral and protective conductors kept separate throughout the whole installation?",
  o:["TN-C","TN-S","TN-C-S","IT"], a:1,
  why:"Part 3, 312.2. The second/third letters describe how exposed parts are earthed. \u2018S\u2019 = separate neutral and protective conductors all the way, giving TN-S. \u2018C\u2019 = combined (PEN), and TN-C-S combines then separates." },

{ p:3, reg:"312.2.1", q:"A supply where neutral and protective functions share a single conductor for part of the system, then split, is which arrangement?",
  o:["TN-S","TN-C-S (PME)","TT","IT"], a:1,
  why:"Part 3, 312.2. A combined PEN conductor from the source that becomes separate N and PE within the installation is TN-C-S \u2013 in the UK this is the familiar PME supply." },

{ p:3, reg:"311.1", q:"To achieve an economic and reliable design, which quantity must first be determined?",
  o:["Maximum demand (and diversity)","Maximum cable length","The earthing arrangement","The supply frequency"], a:0,
  why:"Part 3, 311.1 \u2018Maximum demand and diversity\u2019. Sizing the supply and main cables economically starts with establishing the maximum demand. The Index entry \u2018design, economic and reliable\u2019 points you here." },

{ p:3, reg:"314.1", q:"Why does BS 7671 require an installation to be divided into separate circuits?",
  o:["To make the installation cheaper","To limit the consequences of a fault and allow safe operation, inspection, testing and maintenance","To place all final circuits on the same way","To allow the supply to be increased later"], a:1,
  why:"Part 3, section 314 \u2018Division of installation\u2019. Splitting an installation into circuits limits danger and inconvenience when a fault occurs and makes operation, inspection, testing and maintenance safer." },

{ p:3, reg:"351 (Chapter 35)", q:"Which of these is NOT a recognised source for a safety service supply?",
  o:["A storage battery","A generating set independent of the normal supply","The ordinary public mains supply","A separate feeder effectively independent of the normal supply"], a:2,
  why:"Part 3, Chapter 35 \u2018Safety services\u2019. Recognised independent sources include batteries and generators that keep running when the normal supply fails. The everyday public mains is the supply a safety service must survive without, so it is not itself a \u2018safety\u2019 source." },

{ p:3, reg:"313.1", q:"Which of the following supply characteristics must be ascertained before designing an installation?",
  o:["The nominal voltage(s)","The colour of the meter tails","The age of the property","The name of the previous installer"], a:0,
  why:"Part 3, section 313 \u2018Supplies\u2019. 313.1 requires the nature, nominal voltage, current/frequency, prospective short-circuit current, external loop impedance, suitability for demand and the distributor\u2019s device to be established. Nominal voltage is one of those listed parameters." },

{ p:3, reg:"332 (Chapter 33)", q:"In BS 7671, what does the abbreviation EMC stand for?",
  o:["Electrical Maintenance Code","Electromagnetic Compatibility","Earth Monitoring Circuit","Emergency Mains Control"], a:1,
  why:"Part 3, Chapter 33. EMC = Electromagnetic Compatibility \u2013 the ability of equipment to work without causing, or being upset by, electromagnetic disturbances." },

{ p:3, reg:"341.1 (Chapter 34)", q:"BS 7671 refers to maintenance as \u2018maintainability\u2019. When assessing it, you must consider?",
  o:["The colour of the cables","The frequency and quality of maintenance the installation will receive","The installer\u2019s qualifications","The brand of consumer unit"], a:1,
  why:"Part 3, Chapter 34 \u2018Maintainability\u2019, regulation 341.1. The design must take account of how often and how well the installation will be maintained, so that protective measures stay effective and repairs can be done safely." },

{ p:3, reg:"331.1 (Chapter 33)", q:"The assessment of compatibility (331.1) is concerned with equipment characteristics that could?",
  o:["Improve the building\u2019s appearance","Cause harmful effects on other equipment or the supply","Reduce installation time","Lower the cable cost"], a:1,
  why:"Part 3, Chapter 33, 331.1. You must identify any characteristic likely to have a harmful effect on other equipment or impair the supply \u2013 examples include transient overvoltages, harmonics, high starting currents and earth leakage." },

{ p:3, reg:"Chapter 31", q:"Assessing the general characteristics includes determining the number and type of which conductors?",
  o:["Bonding conductors only","Live conductors","Telephone conductors","Spare conductors"], a:1,
  why:"Part 3, Chapter 31. Part of the general assessment is establishing the number and type of live conductors for both the supply and each circuit, alongside the type of earthing arrangement." },

/* ------------------------------- PART 4 --------------------------------- */
{ p:4, reg:"411.3.2.2", q:"On a TN system at 230 V, what is the maximum disconnection time for a final circuit not exceeding 63 A with socket-outlets (or 32 A supplying fixed equipment)?",
  o:["5 s","0.4 s","1 s","0.1 s"], a:1,
  why:"Part 4, section 411, Table 41.1 linked to 411.3.2.2. Final circuits up to the stated ratings on a 230 V TN system must clear in 0.4 s. Socket-outlet circuits are \u2018final circuits\u2019, so this rule applies to them." },

{ p:4, reg:"411.3.2.3", q:"On a 230 V TN system, what is the maximum disconnection time for a distribution circuit?",
  o:["0.1 s","0.2 s","0.4 s","5 s"], a:3,
  why:"Part 4, 411.3.2.3. Distribution circuits (and final circuits above the ratings in 411.3.2.2) are allowed the longer 5 s time on a TN system, because they are less likely to be in direct hand contact." },

{ p:4, reg:"411.3.2.4 / Table 41.1", q:"On a 230 V TT system, what is the maximum disconnection time for a final circuit feeding socket-outlets?",
  o:["0.4 s","0.2 s","5 s","1 s"], a:1,
  why:"Part 4, Table 41.1. TT systems disconnect faster than TN because the earth path relies on an electrode. For a 230 V TT final circuit the figure is 0.2 s." },

{ p:4, reg:"411.3.3", q:"Additional protection by RCD must be provided for socket-outlets rated up to 32 A in most installations. The RCD\u2019s rated residual operating current must not exceed?",
  o:["100 mA","300 mA","30 mA","500 mA"], a:2,
  why:"Part 4, 411.3.3. \u2018Additional protection\u2019 is the 30 mA RCD requirement \u2013 it backs up the main measures and is needed for general socket-outlets up to 32 A and for mobile equipment used outdoors up to 32 A." },

{ p:4, reg:"415.1.1", q:"Where an RCD is used to provide additional protection, its rated residual operating current must not be greater than?",
  o:["30 mA","100 mA","300 mA","500 mA"], a:0,
  why:"Part 4, 415.1.1. Additional protection by RCD always uses the 30 mA threshold \u2013 it is the figure intended to limit the energy of a shock if the primary protection fails." },

{ p:4, reg:"416.2.1", q:"To provide basic protection, enclosures or barriers around live parts must offer at least which degree of ingress protection?",
  o:["IPXXD","IP4X","IPXXXX","IP2X (or IPXXB)"], a:3,
  why:"Part 4, 416.2.1 \u2018Provision for basic protection\u2019. Surfaces and barriers around live parts need at least IP2X or IPXXB \u2013 enough to keep a standard test finger out." },

{ p:4, reg:"416.2.2", q:"A readily accessible horizontal top surface of a barrier or enclosure must provide at least which degree of protection?",
  o:["IP2X","IPXXB","IP4X (or IPXXD)","IP1X"], a:2,
  why:"Part 4, 416.2.2. A top surface within reach can catch falling objects or fingers more easily, so it is upgraded to IP4X or IPXXD \u2013 a higher figure than the IP2X used for general surfaces." },

{ p:4, reg:"410.3.3", q:"Which protective measure against electric shock is the one most commonly applied in everyday installations?",
  o:["Electrical separation","Automatic disconnection of supply (ADS)","Non-conducting location","Earth-free local equipotential bonding"], a:1,
  why:"Part 4, 410.3.3. ADS \u2013 combining basic protection (insulation/barriers), fault protection (protective earthing and bonding) and a device that disconnects on a fault \u2013 is the standard measure for the great majority of installations." },

{ p:4, reg:"421.1.201", q:"In domestic premises, the enclosure of a consumer unit must be made from?",
  o:["Fire-resistant material","Fire-retardant material","Non-combustible material (or have a non-combustible enclosure)","Any insulating material"], a:2,
  why:"Part 4, 421.1.201. Following past fires linked to plastic consumer units, BS 7671 requires domestic consumer units to be in a non-combustible enclosure (e.g. steel) or housed in a non-combustible cabinet." },

{ p:4, reg:"422.1.2", q:"Equipment must be selected and erected so that, in normal use, any temperature rise cannot?",
  o:["Cause a cable to discolour","Cause a fire","Increase the design current","Change the cable colour"], a:1,
  why:"Part 4, section 422 \u2018Precautions where particular risks of fire exist\u2019, 422.1.2. The core idea is that normal operating temperatures must not be capable of igniting nearby materials." },

{ p:4, reg:"Table 42.1", q:"A metallic part intended to be touched but NOT hand-held has a maximum permitted surface temperature of?",
  o:["55\u00b0C","65\u00b0C","70\u00b0C","80\u00b0C"], a:2,
  why:"Part 4, section 423 with Table 42.1 \u2018Protection against burns\u2019. Touchable metal that isn\u2019t gripped continuously may reach 70\u00b0C; gripped (hand-held) metal is limited to a lower 55\u00b0C." },

{ p:4, reg:"Table 42.1", q:"A hand-held metallic part has a maximum permitted surface temperature of?",
  o:["55\u00b0C","70\u00b0C","80\u00b0C","90\u00b0C"], a:0,
  why:"Part 4, Table 42.1. Because the hand stays in contact, the limit is the more cautious 55\u00b0C for metal. Non-metallic equivalents are allowed a little higher because they conduct heat to the skin more slowly." },

{ p:4, reg:"412.2.1.1", q:"Equipment marked with the double-square (Class II) symbol must be?",
  o:["Not connected to a protective (earth) conductor","Connected to a protective conductor","Fitted with single insulation only","Treated as Class I"], a:0,
  why:"Part 4, 412.2.1.1 \u2018Double or reinforced insulation\u2019. The double-square symbol means the equipment relies on double/reinforced insulation rather than earthing \u2013 it has no protective conductor connection." },

{ p:4, reg:"412.1.2", q:"Double or reinforced insulation may be used as the SOLE protective measure only where?",
  o:["The cable is over 50 mm\u00b2","The installation is under effective supervision so nothing can impair the protection","An RCD is also fitted","The voltage is below 50 V"], a:1,
  why:"Part 4, 412.1.2. On its own, Class II protection is only acceptable where the installation is supervised so that no change (adding earthed metalwork, for example) can undermine the insulation." },

{ p:4, reg:"433.1", q:"For coordination between a line conductor and its overload device, the rule is written so that a small overload of?",
  o:["Short duration is unlikely to occur","Long duration is unlikely to occur","Minimum short-circuit current cannot occur","Harmonic current cannot occur"], a:1,
  why:"Part 4, Chapter 43, 433.1. The wording targets a small but sustained overload \u2013 the device must be coordinated so a small overload of long duration is unlikely to persist. \u2018Coordination\u2019 is the keyword that takes you to Chapter 43." },

{ p:4, reg:"433.1.1", q:"For overload coordination, the device\u2019s nominal/setting current (In) must be?",
  o:["Greater than the cable rating Iz","Not less than the design current Ib and not more than the cable rating Iz","Equal to the prospective fault current","Half the design current"], a:1,
  why:"Part 4, 433.1.1. The first condition is Ib \u2264 In \u2264 Iz \u2013 the device must be big enough to carry the load yet not so big it lets the cable overheat. (The second condition then limits I2 to 1.45\u00d7Iz.)" },

{ p:4, reg:"431.2.1", q:"In a TN or TT system, overcurrent detection in the neutral conductor is NOT required where?",
  o:["The neutral is blue","The neutral\u2019s cross-sectional area is at least equal to that of the line conductor","An RCD is fitted","The circuit is single-phase"], a:1,
  why:"Part 4, 431.2.1. If the neutral is at least as large as the line conductor, it cannot be overloaded relative to the line, so no separate overcurrent detection is needed in the neutral (you still must not disconnect the neutral before the line)." },

{ p:4, reg:"434.5.2 / Table 43.1", q:"For 70\u00b0C thermoplastic-insulated ALUMINIUM conductors, the value of the constant k used in the adiabatic equation is?",
  o:["76","68","100","115"], a:0,
  why:"Part 4, Table 43.1 (linked to 434.5.2). The k value depends on conductor material and insulation. For 70\u00b0C thermoplastic, copper is 115 and aluminium is 76. Match the material to the row \u2013 here it is aluminium, so 76." },

{ p:4, reg:"443.2 / Table 443.2", q:"A 230 V appliance is marked Overvoltage Category II. Its rated impulse withstand voltage is?",
  o:["1.5 kV","2.5 kV","4.0 kV","6.0 kV"], a:1,
  why:"Part 4, section 443, Table 443.2 \u2018Protection against transient overvoltages\u2019. For 230/400 V supplies the categories run I = 1.5 kV, II = 2.5 kV, III = 4.0 kV, IV = 6.0 kV. Category II therefore equals 2.5 kV." },

{ p:4, reg:"445.1.4", q:"A device protecting against undervoltage must have characteristics that are?",
  o:["Set for mandatory automatic re-closure","Compatible with the requirements for starting and use of the equipment","Free of any time delay","Fitted with a long time delay only"], a:1,
  why:"Part 4, section 445 \u2018Protection against undervoltage\u2019, 445.1.4. The response (any delay) must suit how the equipment starts and runs, so protection doesn\u2019t cause nuisance operation or, worse, an unsafe restart." },

{ p:4, reg:"422.3", q:"The external-influence code BE2 identifies a location where there is a risk of?",
  o:["Large overcurrents","Fire due to the nature of processed or stored materials","Harmonic currents","Dangerous isolation"], a:1,
  why:"Part 4, 422.3. \u2018BE\u2019 codes describe the use of a building; BE2 flags premises with a fire risk because of what is made or stored there. Spotting a BE/AA/AD-type code in a question usually points you to the external-influences material." },

{ p:4, reg:"410.3.5", q:"Protection by obstacles may be used only where the installation is?",
  o:["In a domestic dwelling","Controlled or supervised by skilled or instructed persons","Below 50 V","Indoors"], a:1,
  why:"Part 4, 410.3.5. Obstacles only prevent unintentional contact, not deliberate contact, so they are restricted to areas controlled or supervised by skilled or instructed people \u2013 not places open to ordinary persons." },

{ p:4, reg:"413.3.2", q:"Where fault protection is provided by simple (electrical) separation, the voltage of the separated source must not exceed?",
  o:["230 V","400 V","500 V","1000 V"], a:2,
  why:"Part 4, section 413 \u2018Electrical separation\u2019, 413.3.2. The separated supply is capped at 500 V so that a single fault within the separated circuit does not present a dangerous voltage." },

{ p:4, reg:"414.4.5", q:"In a SELV circuit, basic protection (insulation or barriers) may be omitted where the nominal voltage in normal dry conditions does not exceed?",
  o:["12 V a.c.","25 V a.c. or 60 V d.c.","50 V a.c.","60 V a.c."], a:1,
  why:"Part 4, section 414 \u2018SELV and PELV\u2019, 414.4.5. Because the voltage is already very low, basic protection can be dropped at or below 25 V a.c. / 60 V ripple-free d.c. in normal dry conditions (lower limits apply in wet or special locations)." },

{ p:4, reg:"422.2.1", q:"Along a protected escape route, wiring systems should be?",
  o:["As decorative as possible","Kept to the minimum necessary and selected to limit fire spread","Run only in PVC trunking","Painted red"], a:1,
  why:"Part 4, 422.2 \u2018Conditions for evacuation in an emergency\u2019. Wiring in escape routes is limited to what is needed and chosen/installed so it does not add to fire propagation and is not easily damaged \u2013 keeping the route usable." },

{ p:4, reg:"434.1", q:"The prospective fault current in a circuit must be determined at?",
  o:["The far end of the longest circuit only","Every relevant point of the installation","The meter only","The first socket only"], a:1,
  why:"Part 4, 434.1. The prospective fault current (and prospective short-circuit current) must be established at every relevant point so that protective devices have an adequate breaking capacity wherever a fault might occur." },

{ p:4, reg:"421.1.4", q:"Fixed equipment that concentrates or focuses heat (e.g. a spotlight) must be installed so that it is?",
  o:["Within 50 mm of any surface","At a sufficient distance from materials it could ignite","Always recessed","Fitted with an RCD"], a:1,
  why:"Part 4, 421.1 \u2018Protection against fire caused by electrical equipment\u2019. Heat-focusing equipment must keep a safe distance from combustible materials and building elements so the concentrated heat cannot start a fire." },

/* ------------------------------- PART 5 --------------------------------- */
{ p:5, reg:"521.5.1", q:"Single-core a.c. cables of one circuit are run into a ferrous (steel) enclosure. To avoid heating from eddy currents the cables should be arranged so that?",
  o:["Rubber grommets are fitted at entry","All conductors of the circuit, including the neutral, enter through the same opening / enclosure","The steel is replaced with copper at entry","All three conductors are joined together"], a:1,
  why:"Part 5, Chapter 52, 521.5.1 \u2018Ferromagnetic enclosures\u2019. Keeping every conductor of the circuit (lines and neutral) together cancels the net magnetic field, preventing circulating eddy/hysteresis currents heating the steel." },

{ p:5, reg:"522.1.1", q:"A wiring system must be selected and erected so it is suitable for?",
  o:["The maximum ambient temperature only","The maximum conductor temperature only","The highest AND lowest local ambient temperature","The average national temperature"], a:2,
  why:"Part 5, section 522 \u2018External influences\u2019, 522.1.1. The system has to cope with both extremes of local temperature \u2013 not just the hot end \u2013 because cold can affect insulation flexibility too." },

{ p:5, reg:"514.4.2", q:"The green-and-yellow colour combination is reserved exclusively for?",
  o:["Neutral conductors","Protective (earthing and bonding) conductors","Line conductors","Functional control wiring"], a:1,
  why:"Part 5, section 514 \u2018Identification and notices\u2019. Green-and-yellow may only identify protective conductors; it must never be used for a live conductor, which is why plain green is also banned for line/neutral." },

{ p:5, reg:"514.4.3", q:"Where a PEN conductor is insulated, an acceptable colour identification is?",
  o:["Green-and-yellow only","Blue only","Green-and-yellow throughout with blue markings at the terminations","Plain green"], a:2,
  why:"Part 5, 514.4.3. A PEN does both jobs, so it may be green-and-yellow along its length with blue marked at the ends (or blue along its length with green-and-yellow at the ends). The marking shows it serves both functions." },

{ p:5, reg:"534.4.1.1", q:"A Type 1 surge protective device (SPD) is also commonly referred to as a?",
  o:["Exposed-conductive SPD","Extraneous-conductive SPD","Equipotential bonding SPD","Earth-monitoring SPD"], a:2,
  why:"Part 5, section 534 \u2018Devices for protection against overvoltage\u2019. Type 1 SPDs are installed at the origin to handle partial lightning currents and are described as equipotential bonding SPDs because they divert that energy to the main earthing terminal." },

{ p:5, reg:"Table 52.1", q:"The maximum normal operating temperature of a 70\u00b0C thermoplastic (PVC) cable conductor is?",
  o:["70\u00b0C","80\u00b0C","90\u00b0C","105\u00b0C"], a:0,
  why:"Part 5, Table 52.1 (reached via current-carrying-capacity material in section 523). The clue is in the name \u2013 \u201870\u00b0C thermoplastic\u2019 \u2013 the limit is 70\u00b0C. Thermosetting runs hotter." },

{ p:5, reg:"Table 52.1", q:"The maximum normal operating temperature of a 90\u00b0C thermosetting (e.g. XLPE) cable conductor is?",
  o:["70\u00b0C","80\u00b0C","90\u00b0C","105\u00b0C"], a:2,
  why:"Part 5, Table 52.1. Thermosetting insulation tolerates more heat than thermoplastic, with a 90\u00b0C conductor limit \u2013 again the figure is built into the cable\u2019s description." },

{ p:5, reg:"544.1.1", q:"On a supply that is NOT PME, the main protective bonding conductor must have a cross-sectional area of at least?",
  o:["The full csa of the earthing conductor","Half the csa of the earthing conductor, minimum 6 mm\u00b2","25 mm\u00b2","16 mm\u00b2"], a:1,
  why:"Part 5, section 544, 544.1.1. For non-PME supplies the main bonding is sized at not less than half the earthing conductor\u2019s csa, with a 6 mm\u00b2 floor. (PME supplies instead use Table 54.8 against the PEN size.)" },

{ p:5, reg:"Table 54.8", q:"Under PME conditions, if the supply PEN conductor is 100 mm\u00b2 copper, the minimum main protective bonding conductor is?",
  o:["16 mm\u00b2","25 mm\u00b2","35 mm\u00b2","50 mm\u00b2"], a:2,
  why:"Part 5, Table 54.8. The table steps the bonding size against the PEN copper-equivalent: a 100 mm\u00b2 PEN falls in the \u2018over 95 up to 150 mm\u00b2\u2019 band, giving a 35 mm\u00b2 main bonding conductor." },

{ p:5, reg:"543.1.4 / Table 54.7", q:"Using the table (non-calculation) method, the minimum cpc for a 95 mm\u00b2 copper line conductor (cpc also copper) is?",
  o:["16 mm\u00b2","25 mm\u00b2","35 mm\u00b2","50 mm\u00b2"], a:3,
  why:"Part 5, Table 54.7 (alternative to the 543.1.3 calculation). For line conductors over 35 mm\u00b2 of the same material, the cpc is S/2. Half of 95 mm\u00b2 is 47.5 mm\u00b2, rounded up to the standard 50 mm\u00b2." },

{ p:5, reg:"560.4.1", q:"An automatic safety-service supply with a changeover time of 3.5 seconds is classified as a?",
  o:["Short break","Normal break","Medium break","Long break"], a:1,
  why:"Part 5, section 560, 560.4.1. The classes are no-break, very short (\u22640.15 s), short (\u22640.5 s), normal (\u22645 s), medium (\u226415 s) and long (>15 s). At 3.5 s the supply still falls inside the 5 s \u2018normal break\u2019 class." },

{ p:5, reg:"514.1.1", q:"Switchgear hidden behind a fixed panel needs an indicator the operator can see. That indicator must comply with?",
  o:["BS EN 3535","BS EN 4444","BS EN 60073 and BS EN 60447","BS EN 12954"], a:2,
  why:"Part 5, section 514 \u2018Identification and notices\u2019, 514.1.1. Indicators and operating positions reference BS EN 60073 and BS EN 60447 so colours and directions of operation are consistent and understood." },

{ p:5, reg:"Table 537.4", q:"Which one of these devices is NOT suitable for use as an isolator?",
  o:["A device using semiconductors","A fuse","A switch-disconnector","A plug and socket"], a:0,
  why:"Part 5, section 537 with Table 537.4. Isolation needs a reliable physical gap; a semiconductor device does not provide secure isolation, so it is excluded for that function (though it may be fine for functional switching)." },

{ p:5, reg:"522.6.202", q:"A cable concealed in a wall at less than 50 mm depth, not in earthed steel or otherwise mechanically protected, must additionally be?",
  o:["Painted","Protected by a 30 mA RCD (or run within the permitted safe zones with added protection)","Made of aluminium","Rated for 90\u00b0C"], a:1,
  why:"Part 5, 522.6.202/203. Hidden cables that aren\u2019t in safe zones or mechanically protected need a 30 mA RCD as additional protection against the risk of a nail or screw penetrating them." },

{ p:5, reg:"514.9.1", q:"For an installation, the durable diagram or schedule provided must show?",
  o:["The decorator\u2019s details","The number and type of circuits, points served, device characteristics and conductor sizes","Only the consumer-unit brand","The supplier\u2019s logo"], a:1,
  why:"Part 5, 514.9.1. A legible diagram, chart or schedule must record the circuits, the points each serves, the protective-device details and the conductor sizes so anyone working on it later understands the layout." },

{ p:5, reg:"514.4.5", q:"May plain green be used to identify a live conductor?",
  o:["Yes, for the neutral","Yes, for a line conductor","No \u2013 green (and green-and-yellow) are reserved for protective conductors","Yes, in three-phase only"], a:2,
  why:"Part 5, 514.4. Plain green is prohibited for live conductors precisely so it isn\u2019t confused with the green-and-yellow used for protective conductors." },

{ p:5, reg:"559.1", q:"Which type of lighting installation is excluded from the requirements of BS 7671?",
  o:["Temporary festoon lighting","Road lighting forming part of the public supply network","Advertising signs","Telephone-kiosk lighting"], a:1,
  why:"Part 5, section 559 \u2018Luminaires and lighting installations\u2019, 559.1. Highway/road lighting that is part of a public electricity supply network is outside the scope; the other lighting types listed are within it." },

{ p:5, reg:"511.2", q:"Equipment that does not comply with a relevant British or harmonised standard may be used provided?",
  o:["It is cheaper","The designer/installer confirms it gives a degree of safety not less than BS 7671 requires (and records it)","It is imported","It carries any label"], a:1,
  why:"Part 5, section 511, 511.2. Non-standard equipment is acceptable only where the person responsible verifies and records that it provides at least the same level of safety as compliant equipment would." },

{ p:5, reg:"521.10.202 / 521.11.201", q:"Cable supports and fixings along escape routes must be chosen so that the wiring system?",
  o:["Looks neat","Is not liable to premature collapse in the event of fire","Is invisible","Costs less"], a:1,
  why:"Part 5, Chapter 52. After incidents where cables fell and hampered firefighters, BS 7671 requires non-combustible/metallic supports so wiring is not liable to premature collapse in a fire \u2013 plastic clips alone are not enough." },

{ p:5, reg:"514.12.2", q:"The notice required where an RCD is installed instructs the user to?",
  o:["Replace the RCD yearly","Operate the test button quarterly to check it works","Never touch the RCD","Paint the RCD red"], a:1,
  why:"Part 5, 514.12.2. A durable notice must tell the user to press the test button at regular (quarterly) intervals so the RCD\u2019s mechanism is proven to still operate." },

{ p:5, reg:"537.3", q:"A device used for emergency switching should be?",
  o:["Concealed for security","Readily accessible and arranged so it cannot be inadvertently reset","Lockable in the ON position","Operated only with a tool"], a:1,
  why:"Part 5, section 537 \u2018Isolation and switching\u2019. Emergency switching must be quick to reach and, once operated, must not be able to reset itself \u2013 restoring power unexpectedly during an emergency would be dangerous." },

/* ------------------------------- PART 6 --------------------------------- */
{ p:6, reg:"644.1", q:"On completion of a NEW installation, after successful inspection and testing, what must be issued?",
  o:["A Minor Works Certificate","A new installation certificate of the installer\u2019s own design","A periodic report","An Electrical Installation Certificate (EIC)"], a:3,
  why:"Part 6, section 644 \u2018Certification\u2019, 644.1. A new installation (or an addition/alteration forming a new circuit) is signed off with an Electrical Installation Certificate, not a Minor Works Certificate." },

{ p:6, reg:"643.3.2 / Table 64", q:"For a circuit with a nominal voltage of 600 V, the insulation-resistance test must be applied at?",
  o:["250 V","500 V","1000 V","600 V"], a:2,
  why:"Part 6, Table 64 (linked to 643.3.2). The test voltage steps up with circuit voltage: SELV/PELV at 250 V, up to 500 V circuits at 500 V, and above 500 V at 1000 V. A 600 V circuit therefore uses 1000 V." },

{ p:6, reg:"Table 64", q:"For a low-voltage circuit up to 500 V, the minimum acceptable insulation resistance is?",
  o:["0.25 M\u03a9","0.5 M\u03a9","1.0 M\u03a9","2.0 M\u03a9"], a:2,
  why:"Part 6, Table 64. At a 500 V test, the minimum pass value for a normal LV circuit is 1.0 M\u03a9. SELV/PELV circuits (tested at 250 V) accept a lower 0.5 M\u03a9 minimum." },

{ p:6, reg:"643.4.1", q:"How is the separation of a SELV circuit from other circuits verified?",
  o:["By enquiry","By measurement (insulation resistance)","By asking the manufacturer","By calculation"], a:1,
  why:"Part 6, 643.4.1. Separation between SELV live parts and other circuits/earth is confirmed by measuring the insulation resistance \u2013 a physical test, not a paperwork exercise." },

{ p:6, reg:"644.5", q:"A Minor Electrical Installation Works Certificate is signed by?",
  o:["The person who ordered the work","An independent inspector","The original designer","The skilled, competent person who carried out the work"], a:3,
  why:"Part 6, 644.5. The MEIWC is a single-signature document completed by the competent person who did the minor work \u2013 it does not need a separate designer/inspector signature like the full EIC can." },

{ p:6, reg:"643.7.1", q:"A polarity test is carried out to confirm that?",
  o:["The supply voltage is correct","Single-pole devices are in the line conductor and accessories are correctly connected","The earth electrode is sound","The RCD trips at 30 mA"], a:1,
  why:"Part 6, 643.7. Polarity checks that single-pole switches and protective devices sit in the line conductor (not the neutral) and that socket-outlets and lampholders are wired the right way round." },

{ p:6, reg:"Chapter 64 (sequence)", q:"Which of these is correctly carried out as a DEAD test, before the installation is energised?",
  o:["Earth fault loop impedance","Continuity of protective conductors","RCD operating time","Prospective fault current"], a:1,
  why:"Part 6, Chapter 64. Tests follow a set order, with dead tests (continuity of protective conductors, ring continuity, insulation resistance, polarity) completed before any live tests such as loop impedance and RCD operation." },

/* ------------------------------- PART 7 --------------------------------- */
{ p:7, reg:"701 (zones)", q:"In a location containing a bath or shower, Zone 0 is?",
  o:["The whole room","The interior of the bath tub or shower basin","The space above the door","2.5 m around the basin"], a:1,
  why:"Part 7, section 701. Zone 0 is the inside of the bath or shower basin itself \u2013 the wettest, most onerous zone, where only SELV at very low voltage and suitably rated equipment is allowed." },

{ p:7, reg:"701.32.3", q:"The space beneath a bath that can only be reached using a tool is classed as?",
  o:["Zone 0","Zone 1","Zone 2","Outside the zones"], a:3,
  why:"Part 7, 701.32.3. If access needs a tool, that concealed space is treated as outside the zones \u2013 a frequently-tested detail worth memorising." },

{ p:7, reg:"701.32.4", q:"In a bathroom, Zone 2 is limited by a horizontal plane at what height above the finished floor?",
  o:["1.5 m","2.0 m","2.25 m","3.0 m"], a:2,
  why:"Part 7, 701.32. Zone 1 (and the adjacent Zone 2) extend up to 2.25 m above the floor (or to the height of a fixed shower head if higher). The 18th Edition removed the old Zone 3." },

{ p:7, reg:"701.512.2", q:"The minimum degree of protection for equipment installed in Zone 1 of a bathroom is?",
  o:["IPX1","IPX4","IP2X","IPX7"], a:1,
  why:"Part 7, 701.512.2. Zone 1 equipment must be at least IPX4 against splashing water (Zone 0 is the more onerous IPX7 for immersion)." },

{ p:7, reg:"702.32", q:"A swimming pool has a diving board 7.5 m above the floor. Zone 1 then extends upward to a height of?",
  o:["7.5 m","10 m","12.5 m","15 m"], a:1,
  why:"Part 7, section 702. Zone 1 normally reaches 2.5 m above the surface people occupy; where a diving board is higher, Zone 1 follows it up to 2.5 m above the board \u2013 here 7.5 m + 2.5 m = 10 m." },

{ p:7, reg:"705.411.1", q:"In agricultural/horticultural premises, socket-outlet final circuits rated above 32 A must have RCD protection not exceeding?",
