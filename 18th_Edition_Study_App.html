  o:["30 mA","100 mA","300 mA","500 mA"], a:1,
  why:"Part 7, section 705. The RCD ratings step with use: \u226432 A sockets need 30 mA, sockets above 32 A need 100 mA, and other circuits up to 300 mA \u2013 a tighter regime than a normal dwelling because of the wet, conductive environment." },

{ p:7, reg:"705.411.1", q:"In agricultural premises, socket-outlets rated up to 32 A require additional protection by an RCD rated at?",
  o:["30 mA","100 mA","300 mA","500 mA"], a:0,
  why:"Part 7, section 705. The smallest sockets keep the familiar 30 mA additional-protection figure; larger ratings are allowed the higher thresholds noted in the same regulation." },

{ p:7, reg:"708.512.1.1", q:"Outdoor equipment supplying tent/caravan pitches on a camping or caravan park must be selected to at least?",
  o:["IP2X","IPX2","IP4X","IPX4"], a:3,
  why:"Part 7, section 708. Because the equipment is exposed to weather (AD4 \u2013 splashing water), it must be at least IPX4. Read the IP code carefully \u2013 the digit after the X is the water rating." },

{ p:7, reg:"708.553", q:"On a caravan/camping park, each pitch socket-outlet should be?",
  o:["Shared between four pitches","Protected by its own 30 mA RCD","Supplied at 400 V","Left unprotected"], a:1,
  why:"Part 7, section 708. Each socket-outlet is protected individually by a 30 mA RCD so a fault on one pitch cannot disconnect a neighbour and the shock risk in an outdoor setting is contained." },

{ p:7, reg:"721.55.2.6", q:"The maximum length of the flexible connecting cord (cable assembly) for a caravan is?",
  o:["21 m","22 m","25 m","27 m"], a:2,
  why:"Part 7, section 721, 721.55.2.6. The caravan supply flex is limited to 25 m so voltage drop and damage risk are controlled. Watch the units in the options \u2013 \u201821 mm\u2019 is a deliberate trap." },

{ p:7, reg:"709.1", q:"The requirements of section 709 (marinas) apply to?",
  o:["Houseboats fed directly from the public supply","The internal circuits of pleasure craft","Equipment aboard sea-going ships","Circuits intended to supply pleasure craft and houseboats"], a:3,
  why:"Part 7, 709.1 (Scope). Section 709 covers the marina circuits that feed pleasure craft and houseboats \u2013 not the wiring inside the craft itself, which is dealt with by other standards." },

{ p:7, reg:"704.410.3.10", q:"On a construction site, which method is the strongly preferred way to protect against shock for portable hand-lamps used in confined or damp places?",
  o:["Reduced low voltage","Automatic disconnection of supply","Electrical separation","SELV"], a:3,
  why:"Part 7, section 704. In confined, damp conditions the body\u2019s resistance is low, so SELV \u2013 with its very low voltage and safety source \u2013 is the strongly preferred measure for hand-lamps." },

{ p:7, reg:"704.410.3.10", q:"On a construction site, socket-outlets rated up to 32 A should be protected by?",
  o:["A 100 mA RCD only","A 30 mA RCD (or supplied at reduced low voltage / SELV / PELV)","No additional protection","A 500 mA RCD"], a:1,
  why:"Part 7, section 704. The harsh site environment means socket-outlets up to 32 A need 30 mA RCD additional protection or an inherently safer supply such as reduced low voltage or SELV/PELV." },

{ p:7, reg:"740.313.1.1", q:"For a temporary structure such as a circus/funfair, the maximum nominal single-phase a.c. voltage is?",
  o:["110 V","230 V","240 V","400 V"], a:1,
  why:"Part 7, section 740, 740.313.1.1. Single-phase supplies to these temporary structures are limited to a 230 V nominal value (with 400 V for three-phase), reflecting the public-access, frequently-erected nature of the installation." },

{ p:7, reg:"712.537", q:"On the d.c. side of a solar PV installation, what must be provided to allow safe maintenance of the inverter?",
  o:["A surge arrester only","A means of isolation on the d.c. side","A larger fuse","An ammeter"], a:1,
  why:"Part 7, section 712 \u2018Solar PV\u2019. Because PV arrays remain live in daylight, a d.c. isolating device is required so the inverter can be worked on safely \u2013 you cannot \u2018switch off\u2019 the sun." },

{ p:7, reg:"722.531", q:"Each electric-vehicle charging point should generally be?",
  o:["Shared on a ring final circuit","Supplied by its own dedicated circuit with a 30 mA RCD","Fed at 400 V single-phase","Left without RCD protection"], a:1,
  why:"Part 7, section 722 \u2018EV charging\u2019. Each charge point is normally on its own circuit with a 30 mA RCD of a suitable type, plus measures to deal with a broken PEN on a TN-C-S supply." },

{ p:7, reg:"706", q:"In a conducting location with restricted movement, a portable hand tool or hand-lamp should be supplied using?",
  o:["A standard 230 V socket","SELV (or electrical separation)","A 13 A plug","No special measure"], a:1,
  why:"Part 7, section 706. Surrounded by earthed metal with little room to move, the shock risk is severe, so hand-held equipment uses SELV or electrical separation to keep the operator safe." },

{ p:7, reg:"710", q:"Medical locations are divided into Groups 0, 1 and 2 according to?",
  o:["The size of the room","The intended use and the risk to the patient","The voltage of the supply","The age of the building"], a:1,
  why:"Part 7, section 710. The group reflects how medical equipment is applied to the patient and the consequence of a supply interruption \u2013 Group 2 (e.g. operating theatres, intensive care) is the most critical." },

/* ------------------------------- PART 8 (Appendices) --------------------------------- */
{ p:8, reg:"Appendix 1", q:"Which British Standard covers ceiling roses?",
  o:["BS 5655","BS 67","BS EN 81","BS EN 50438"], a:1,
  why:"Appendix 1 lists British Standards referenced by BS 7671. Ceiling roses are BS 67. For these questions, the technique is simply to scan Appendix 1 for the item named \u2013 they reward familiarity, not memory." },

{ p:8, reg:"Appendix 3", q:"Appendix 3 of BS 7671 contains?",
  o:["Model certification forms","Time/current characteristics of overcurrent protective devices","Cable current-carrying capacities","A list of definitions"], a:1,
  why:"Appendix 3 holds the time/current curves for fuses and circuit-breakers \u2013 used to read off disconnection times for a given fault current. The Appendices contents page directs you straight there." },

{ p:8, reg:"Appendix 4", q:"Appendix 4 of BS 7671 deals with?",
  o:["British Standards","Statutory regulations","Current-carrying capacity and voltage drop of cables","Symbols used in the Regulations"], a:2,
  why:"Appendix 4 is the cable-sizing appendix \u2013 reference methods, rating factors and voltage-drop data. Any cable current-carrying-capacity or voltage-drop question sends you here." },

{ p:8, reg:"Appendix 4", q:"For a lighting circuit on a low-voltage supply, the recommended maximum voltage drop is?",
  o:["3% of the nominal voltage","5% of the nominal voltage","8% of the nominal voltage","10% of the nominal voltage"], a:0,
  why:"Appendix 4. The guidance figures are 3% for lighting and 5% for other uses, measured from the origin to the load. Lighting gets the tighter 3% because dimming/flicker is noticeable." },

{ p:8, reg:"Appendix 4", q:"For circuits other than lighting on a low-voltage supply, the recommended maximum voltage drop is?",
  o:["3%","5%","7%","9%"], a:1,
  why:"Appendix 4. Non-lighting (power) circuits are allowed up to 5% voltage drop \u2013 the slightly larger figure reflects that equipment such as motors tolerates a little more drop than lighting." },

{ p:8, reg:"Appendix 4", q:"In the cable rating tables, the rating factor Ca is applied to allow for?",
  o:["Grouping of circuits","Ambient temperature","Thermal insulation","Buried depth"], a:1,
  why:"Appendix 4. The correction factors are: Ca for ambient temperature, Cg for grouping, Ci for thermal insulation and Cd/Cc for depth/installation conditions. Ca handles temperature." },

{ p:8, reg:"Appendix 4", q:"In Appendix 4, Reference Method C describes a cable that is?",
  o:["Buried direct in the ground","Clipped direct to a surface","Enclosed in conduit in an insulated wall","In free air on a perforated tray"], a:1,
  why:"Appendix 4. Installation reference methods set the current rating. Method C = clipped direct. Picking the correct method is the first step before reading the tabulated current-carrying capacity." },

{ p:8, reg:"Appendix 1", q:"Residual current operated circuit-breakers without integral overcurrent protection (RCCBs) are covered by which standard?",
  o:["BS EN 60898","BS EN 61008","BS 3036","BS 88"], a:1,
  why:"Appendix 1. RCCBs are BS EN 61008, while RCBOs are BS EN 61009 and MCBs are BS EN 60898. Knowing which family a device belongs to makes these standard-spotting questions quick." },

{ p:8, reg:"Appendix 6", q:"Appendix 6 of BS 7671 provides?",
  o:["Cable derating factors","Model forms for certification and inspection","A list of symbols","Maximum demand data"], a:1,
  why:"Appendix 6 contains the model certificates and reports \u2013 the EIC, MEIWC and EICR templates with their schedules. When a question asks where the model forms live, it is Appendix 6." }
,
/* ---------------- PART 1 ---------------- */
{ p:1, reg:"110.3", q:"BS 7671 is issued jointly by the IET and which other body?", o:["The HSE","BSI (British Standards Institution)","Ofgem","The NICEIC"], a:1,
  why:"The front matter and 110.3 identify the Regulations as a joint IET/BSI publication, published as BS 7671. If unsure, the title page and the foreword name the two issuing bodies." },
{ p:1, reg:"114.1", q:"Do the Regulations have legal force in their own right?", o:["Yes, they are an Act of Parliament","No, but they may be cited to show compliance with statutory law","Yes, breach is automatically a criminal offence","No, and they cannot be referred to in law"], a:1,
  why:"114 explains the relationship with statutory regulations. BS 7671 is non-statutory, but compliance is widely accepted as meeting the requirements of laws such as the Electricity at Work Regulations. Look at Chapter 11/Chapter 14 introductory text." },
{ p:1, reg:"131.1", q:"Chapter 13 sets out the fundamental principles. What is its overriding purpose?", o:["To list cable sizes","Protection of persons, livestock and property","To define the certification forms","To set inspection intervals"], a:1,
  why:"131.1 opens Chapter 13 by stating the safety aims: protecting people, livestock and property from dangers arising from an installation. The chapter heading in the Part 1 contents points you straight there." },
{ p:1, reg:"132.16", q:"When an addition or alteration is made to an installation, what must be confirmed about the existing parts it relies on?", o:["That they are the newest model","That they are adequate for the altered circumstances","That they were installed by the same person","That they carry a CE mark"], a:1,
  why:"132.16 deals with additions and alterations. The existing earthing, bonding and circuit arrangements that the new work depends on must be verified as adequate. Search the Chapter 13 contents for 'Additions and alterations'." },
{ p:1, reg:"133.1.1", q:"What is the principal rule when selecting equipment for an installation?", o:["It must be the cheapest available","It must comply with the relevant British or Harmonised Standard","It must be UK-manufactured","It must be at least IP65"], a:1,
  why:"133.1 covers selection of equipment, and 133.1.1 requires conformity with the applicable standard. Where no standard exists, 133.1.3 applies. The Chapter 13 contents list 'Compliance with standards'." },
{ p:1, reg:"120.3", q:"If strict application of a regulation is not possible, what does BS 7671 require of the designer?", o:["Ignore the regulation","Provide a degree of safety not less than that intended by the Regulations","Obtain written permission from BSI","Use the previous edition instead"], a:1,
  why:"120.3 allows departures, but only where the resulting safety is no less than that intended by the Regulations. Any such departure must be recorded on the certificate. See the Chapter 12 contents for 'Departures'." },
{ p:1, reg:"131.8", q:"Fundamental principles require that supplies for safety services and standby supplies are treated how?", o:["As optional extras","As needing assessment where specified or required","As never permitted","As exempt from the Regulations"], a:1,
  why:"131.8 covers supplies for safety services and standby. Where such supplies are specified, their characteristics must be assessed. The Chapter 13 contents heading 'Supplies for safety services' locates it." },

/* ---------------- PART 2 ---------------- */
{ p:2, reg:"Part 2", q:"In BS 7671 terminology, what does a 'skilled person (electrically)' denote?", o:["Anyone over 18","A person with relevant education and experience to avoid dangers electricity can create","A person holding a driving licence","Any employee of a contractor"], a:1,
  why:"Part 2 is the definitions chapter, alphabetical. Find 'Skilled person'. The defining feature is education/experience enabling them to perceive and avoid electrical danger." },
{ p:2, reg:"Part 2", q:"How does Part 2 define 'basic protection'?", o:["Protection against indirect contact only","Protection against electric shock under fault conditions","Protection against electric shock under normal (fault-free) conditions","Protection against overcurrent"], a:2,
  why:"Look up 'Basic protection' in the alphabetical Part 2 list. It is protection against contact with live parts under normal conditions — the modern term that replaced 'direct contact'." },
{ p:2, reg:"Part 2", q:"What is an 'exposed-conductive-part'?", o:["A live busbar","A conductive part of equipment that can be touched and may become live under fault","Any metal pipe in a building","The earth electrode"], a:1,
  why:"Part 2 definitions. An exposed-conductive-part is a conductive part of equipment, touchable, that is not normally live but could become live if basic insulation fails — e.g. a metal appliance casing." },
{ p:2, reg:"Part 2", q:"How is an 'extraneous-conductive-part' best described?", o:["A part of the electrical installation","A conductive part liable to introduce a potential, generally earth potential, and not part of the installation","A double-insulated appliance","A circuit protective conductor"], a:1,
  why:"Part 2. An extraneous-conductive-part is something like a metal water or gas pipe entering the building — not part of the electrical installation but able to introduce a potential. This is why main bonding exists." },
{ p:2, reg:"Part 2", q:"What does the abbreviation 'PEN conductor' stand for?", o:["Protective earth neutral","Combined protective earthing and neutral conductor","Permanent electrical node","Primary earthing network"], a:1,
  why:"Part 2 definitions / Appendix abbreviations. A PEN conductor combines the functions of a protective (earthing) conductor and a neutral conductor, as found in TN-C and the supply side of TN-C-S systems." },

/* ---------------- PART 3 ---------------- */
{ p:3, reg:"312.2", q:"Which arrangement of live conductors is being described by 'single-phase two-wire'?", o:["Three lines and a neutral","One line and one neutral","Two lines only","Three lines only"], a:1,
  why:"312.2 lists the recognised arrangements of live conductors. Single-phase two-wire is one line conductor plus a neutral. The Chapter 31 contents heading 'Live conductors' points here." },
{ p:3, reg:"313.1", q:"Which of the following is a characteristic of the supply that must be determined?", o:["The decorator's colour scheme","The nominal voltage","The number of light fittings","The client's budget"], a:1,
  why:"313.1 requires the supply characteristics — nominal voltage, frequency, prospective fault current, earthing arrangement and so on — to be determined. Chapter 31 contents 'Supplies' locates it." },
{ p:3, reg:"314.1", q:"Why must an installation be divided into circuits (division of installation)?", o:["To use more cable","To minimise danger and inconvenience and to facilitate safe operation, inspection and testing","To increase the bill","Purely for appearance"], a:1,
  why:"314.1 gives the reasons for dividing an installation into circuits: limiting the consequences of a fault, reducing inconvenience on isolation, and easing inspection and testing. See Chapter 31 contents." },
{ p:3, reg:"311.1", q:"'Maximum demand and diversity' in Chapter 31 is assessed primarily to do what?", o:["Decorate the consumer unit","Determine the size of supply and distribution equipment","Choose paint","Set the inspection interval"], a:1,
  why:"311.1 covers maximum demand and diversity, used to size the supply and the distribution circuits economically without under-rating. The Chapter 31 contents heading names it directly." },
{ p:3, reg:"322.1", q:"Which external influence does the classification code 'AD' describe?", o:["Presence of water","Ambient temperature","Presence of corrosive substances","Mechanical impact"], a:0,
  why:"External influence codes are given in Chapter 32 and Appendix 5. The first letter A = environment, second letter sets the category; AD denotes presence of water. Appendix 5 tabulates every code." },
{ p:3, reg:"Appendix 5", q:"In the external-influence coding system, what does the first letter of the three-part code represent?", o:["The installer","The general category of influence (environment, utilisation, building)","The voltage","The cable type"], a:1,
  why:"Appendix 5 explains the coding. First letter = category (A environment, B utilisation, C building construction); second letter = nature; number = class. Cross-referenced from Chapter 32." },
{ p:3, reg:"313.1", q:"Which earthing arrangement has the supply neutral and the protective function combined in one conductor for part of the system, then separated at the origin?", o:["TT","TN-S","TN-C-S","IT"], a:2,
  why:"System types are defined around 312/313 and illustrated in Chapter 31. TN-C-S combines neutral and earth in the supply (PEN) then splits them at the origin — the common PME arrangement." },

/* ---------------- PART 4 ---------------- */
{ p:4, reg:"411.3.3", q:"In a domestic location, socket-outlets rated up to 32 A must generally have additional protection by an RCD of what rating?", o:["100 mA","300 mA","30 mA","500 mA"], a:2,
  why:"411.3.3 requires 30 mA RCD additional protection for socket-outlets up to 32 A for general use. The figure 30 mA recurs throughout Chapter 41 for additional protection — commit it to memory." },
{ p:4, reg:"411.3.4", q:"Within a domestic (household) installation, what additional protection is required for AC final circuits supplying luminaires?", o:["None","A 30 mA RCD","A 100 mA RCD","A surge arrester only"], a:1,
  why:"411.3.4 extends 30 mA RCD additional protection to AC final circuits supplying luminaires in dwellings. Look in Chapter 41 contents under 'Additional protection'." },
{ p:4, reg:"415.1.1", q:"Additional protection by a 30 mA RCD is recognised as protection against what?", o:["Overload only","Basic protection by itself","A backup where basic or fault protection fails, and against careless use","Lightning"], a:2,
  why:"415.1 describes additional protection: a 30 mA RCD is not a substitute for basic or fault protection but a further layer for when those fail or where there is carelessness. Chapter 41 contents 'Additional protection'." },
{ p:4, reg:"411.4.4", q:"In a TN system, the characteristics of the protective device and circuit impedances must satisfy which key requirement?", o:["Zs x Ia <= Uo","Zs x Ia >= Uo","Zs <= Uo/Ia","Zs >= Uo x Ia"], a:2,
  why:"411.4.4 gives the TN disconnection condition Zs x Ia <= Uo, rearranged to Zs <= Uo/Ia. Knowing the loop-impedance inequality lets you check any TN circuit. See Chapter 41 contents 'TN systems'." },
{ p:4, reg:"411.3.2.2", q:"For a final circuit not exceeding 32 A in a TN system at 230 V, what is the maximum disconnection time?", o:["5 s","0.4 s","1 s","0.2 s"], a:1,
  why:"Table 41.1 gives 0.4 s for TN final circuits up to 63 A (32 A included) at 230 V. Distribution circuits and those over 63 A get 5 s (411.3.2.3). Go straight to Table 41.1 in Chapter 41." },
{ p:4, reg:"411.3.2.3", q:"For a distribution circuit in a TN system, what maximum disconnection time is permitted?", o:["0.2 s","0.4 s","5 s","Instantaneous"], a:2,
  why:"411.3.2.3 allows 5 s for distribution circuits in TN systems, against the 0.4 s for small final circuits. The contrast between final and distribution times is a frequent exam point — Table 41.1." },
{ p:4, reg:"411.3.2.4", q:"In a TT system, what maximum disconnection time applies to a final circuit not exceeding 32 A at 230 V?", o:["0.4 s","0.2 s","1 s","5 s"], a:1,
  why:"Table 41.1 sets 0.2 s for TT final circuits up to 63 A at 230 V — shorter than the TN 0.4 s because TT relies on RCDs. Read the TT column of Table 41.1." },
{ p:4, reg:"411.5.3", q:"In a TT system, the product of the RCD rated residual operating current and the earth electrode resistance must not exceed which value?", o:["230 V","50 V","12 V","115 V"], a:1,
  why:"411.5.3 gives Ra x I-delta-n <= 50 V. Keeping the touch voltage at or below 50 V is the safety basis for TT RCD protection. Chapter 41 contents 'TT systems'." },
{ p:4, reg:"421.1.201", q:"In domestic premises, consumer units and similar switchgear assemblies must generally have enclosures made of what, or be otherwise contained?", o:["Wood","Non-combustible material","Cardboard","Clear plastic only"], a:1,
  why:"421.1.201 requires consumer units in dwellings to have a non-combustible enclosure (or be in a non-combustible cabinet) following the metal consumer unit amendment. Chapter 42 contents 'Precautions where particular risks of fire exist'." },
{ p:4, reg:"422.2.1", q:"In a location with risk of fire due to the nature of processed or stored materials (condition BE2), wiring systems should as far as practicable do what?", o:["Be left unprotected","Not pass through such locations unless necessary, and be limited in spread of fire","Use the cheapest cable","Be installed only in timber"], a:1,
  why:"422.3/422.2 deal with BE2 fire-risk locations. Cables should avoid the location where practicable and otherwise resist fire propagation. Search Chapter 42 contents 'Conditions of evacuation / fire'." },
{ p:4, reg:"433.1.1", q:"For overload protection, the relationship between design current Ib, device rating In and cable capacity Iz requires which to hold first?", o:["Iz <= In","In <= Ib","Ib <= In <= Iz","Iz <= Ib"], a:2,
  why:"433.1.1 gives the coordination rule Ib <= In <= Iz (with the second condition I2 <= 1.45 Iz). The first inequality string is the one to memorise. Chapter 43 contents 'Protection against overload current'." },
{ p:4, reg:"434.5.2", q:"The adiabatic equation S = sqrt(I^2 x t) / k is used to check what?", o:["Voltage drop","That a conductor withstands the thermal effects of a fault for the disconnection time","Cable colour","Maximum demand"], a:1,
  why:"434.5.2 gives the adiabatic equation. It confirms the conductor cross-section can survive the let-through energy during a fault before the device operates. Chapter 43 contents 'Protection against fault current'." },
{ p:4, reg:"443.4", q:"Protection against transient overvoltages of atmospheric origin is assessed using which method in the current edition?", o:["Guesswork","A risk assessment (or where consequences justify, SPDs are provided)","Always omitting SPDs","Only for industrial sites"], a:1,
  why:"Chapter 44 (443) was revised so transient-overvoltage protection is decided by risk assessment; certain consequences (e.g. risk to human life) mandate SPDs. Chapter 44 contents 'Protection against overvoltages'." },
{ p:4, reg:"514.1", q:"Where additional protection by RCD is provided, the rated residual operating current must not exceed what for it to count as 'additional protection'?", o:["100 mA","30 mA","300 mA","10 mA"], a:1,
  why:"Throughout Chapter 41, additional protection means a 30 mA RCD. Anything higher (100/300 mA) is for fire or fault protection, not additional protection. Reinforce with 415.1.1." },
{ p:4, reg:"411.3.1.1", q:"Protective equipotential bonding connects extraneous-conductive-parts to which point?", o:["The nearest socket","The main earthing terminal","The neutral bar only","The roof"], a:1,
  why:"411.3.1.1 requires main protective bonding conductors to connect extraneous-conductive-parts to the main earthing terminal. The MET is the common reference. Chapter 41 contents 'Protective equipotential bonding'." },
{ p:4, reg:"419.3", q:"Where automatic disconnection within the required time cannot be achieved, which alternative measures may be used?", o:["Do nothing","Supplementary equipotential bonding or other measures of Section 419","Increase the fuse size","Remove the earth"], a:1,
  why:"419.3 covers situations where disconnection times cannot be met, allowing supplementary bonding to limit touch voltage. Chapter 41 contents 'Where automatic disconnection... is not feasible'." },
{ p:4, reg:"434.5.1", q:"A device providing fault-current protection must have a breaking capacity not less than what?", o:["Half the prospective fault current","The prospective fault current at its point of installation","10 A","The cable rating"], a:1,
  why:"434.5.1 requires the device's rated breaking capacity to be at least the prospective fault current at that point (unless back-up protection applies). Chapter 43 contents 'Breaking capacity'." },
{ p:4, reg:"431.1", q:"Overcurrent comprises which two phenomena?", o:["Voltage drop and harmonics","Overload current and fault current","Resistance and reactance","Heat and light"], a:1,
  why:"431.1 defines overcurrent protection as covering both overload (in a healthy circuit) and fault current (short-circuit or earth fault). Chapter 43 contents opening paragraph." },
{ p:4, reg:"416.1", q:"Basic protection by insulation of live parts requires the insulation to be removable only how?", o:["By hand","By destruction","By a coin","It need not be fixed"], a:1,
  why:"416.1 states basic insulation must be capable of removal only by destruction, so it cannot be casually taken off to expose live parts. Chapter 41 contents 'Basic protection — insulation of live parts'." },
{ p:4, reg:"416.2.1", q:"For basic protection by barriers or enclosures, the minimum protection against contact with live parts from the top of a horizontal surface is to what degree?", o:["IP2X","IPXXB","IP4X","IPXXD"], a:2,
  why:"416.2.1 requires at least IP4X (or IPXXD) on readily accessible horizontal top surfaces, and IP2X/IPXXB elsewhere. Chapter 41 contents 'Barriers or enclosures'." },
{ p:4, reg:"442.2.1", q:"Chapter 44 protection against faults between high-voltage and low-voltage systems chiefly limits what?", o:["Voltage drop","Overvoltages appearing on the LV system due to an HV earth fault","Cable colour","Harmonics"], a:1,
  why:"442 addresses overvoltages on LV installations arising from HV system earth faults, setting permissible stress voltages and durations. Chapter 44 contents 'Protection... between... systems'." },
{ p:4, reg:"435.1", q:"Where overload and fault protection are provided by separate devices, their characteristics must be what?", o:["Identical","Coordinated so the energy let through by the fault device does not exceed what the overload device and conductors withstand","Unrelated","Both removed"], a:1,
  why:"435.1 requires coordination between separate overload and short-circuit devices so let-through energy stays within limits. Chapter 43 contents 'Coordination of overload and fault current protection'." },
{ p:4, reg:"signage", q:"Where different nominal voltages exist in one installation, what does Chapter 51/Part 4 practice require?", o:["No action","A clear warning/notice and means to identify the voltages present","Painting everything red","Only one voltage allowed"], a:1,
  why:"Warning of differing voltages is required so anyone working on it is aware. This is reinforced in Chapter 51 (514) labelling, cross-referenced from protection requirements. Look under 'Warning notices'." },

/* ---------------- PART 5 ---------------- */
{ p:5, reg:"514.3.1", q:"Conductors should be identifiable. By what means is identification usually achieved?", o:["Smell","Colour and/or lettering or numbering","Weight","Sound"], a:1,
  why:"514.3.1 allows identification by colour, or by letters/numbers, particularly at terminations. Chapter 51 contents 'Identification of conductors'." },
{ p:5, reg:"514.4.2", q:"What colour identifies a protective conductor (including earthing and bonding)?", o:["Blue","Brown","Green-and-yellow","Black"], a:2,
  why:"514.4 and Table 51 fix green-and-yellow for protective conductors. This bi-colour is reserved exclusively for protective conductors. Go to Table 51 in Chapter 51." },
{ p:5, reg:"Table 51", q:"In a single-phase AC installation, which colour is the neutral conductor?", o:["Brown","Blue","Grey","Green-and-yellow"], a:1,
  why:"Table 51 gives blue for the neutral. Line is brown. The green-and-yellow is protective only. Table 51 is the quick reference for all conductor colours." },
{ p:5, reg:"521.10.202", q:"Wiring systems in escape routes must be supported such that they will not do what prematurely in a fire?", o:["Change colour","Collapse and obstruct escape (no 'plastic-clip-only' support)","Cost too much","Make noise"], a:1,
  why:"521.10.202 requires metallic supports/fixings so cables do not fall and impede escape when plastic supports fail in fire — the post-Lakanal change. Chapter 52 contents 'Installation of wiring systems'." },
{ p:5, reg:"522.6.202", q:"A cable installed in a wall at a depth less than 50 mm, not in a safe zone or mechanically protected, must have what?", o:["Nothing extra","30 mA RCD protection (or earthed metallic covering / mechanical protection)","A larger fuse","A label only"], a:1,
  why:"522.6.202/203 require buried cables that are shallow and outside prescribed zones to be protected by a 30 mA RCD, or armoured/mechanically protected. Chapter 52 contents 'Cables concealed in walls'." },
{ p:5, reg:"522.6.201", q:"Cables concealed in a wall at a depth of at least 50 mm are still required to be installed where, if not mechanically protected?", o:["Anywhere","In prescribed safe zones (e.g. horizontally/vertically from accessories)","Only in the loft","Behind tiles only"], a:1,
  why:"522.6.201 defines the permitted zones (horizontal/vertical to points and accessories, or within 150 mm of corners/ceilings). Outside them, extra protection applies. Chapter 52 contents." },
{ p:5, reg:"521.5.1", q:"Single-core cables armoured with steel wire should generally be installed how, for AC circuits?", o:["Singly through separate ferrous holes","With all line and neutral cables of a circuit in the same ferromagnetic enclosure/grouped to avoid eddy heating","Spread far apart","Not at all"], a:1,
  why:"521.5.1 addresses electromagnetic effects: conductors of an AC circuit should be grouped so circulating eddy currents and overheating in surrounding ferrous material are avoided. Chapter 52 contents." },
{ p:5, reg:"526.1", q:"Every connection between conductors must provide what, electrically and mechanically?", o:["The cheapest joint","Durable, sound continuity and adequate mechanical strength and protection","A decorative finish","Maximum resistance"], a:1,
  why:"526.1 requires connections to be electrically continuous, mechanically strong and durable. The accessibility rule (526.3) follows. Chapter 52 contents 'Electrical connections'." },
{ p:5, reg:"526.3", q:"Where must connections generally be accessible for inspection, testing and maintenance, unless an exception applies?", o:["Never","They must be accessible unless listed exceptions (e.g. maintenance-free, buried compound) apply","Always behind plaster","Only outdoors"], a:1,
  why:"526.3 requires accessibility of joints with specific exceptions (e.g. compound-filled, maintenance-free MF connections, buried in the ground in approved enclosures). Chapter 52 contents." },
{ p:5, reg:"537.2.2", q:"A device used for isolation must do what to the supply?", o:["Reduce it slightly","Cut off the installation/circuit from every source of electrical energy","Only dim it","Increase it"], a:1,
  why:"537.2 defines isolation as secure disconnection from all sources of energy. The device must provide the required contact separation. Chapter 53 contents 'Isolation'." },
{ p:5, reg:"537.3.2", q:"Functional switching is provided to do what?", o:["Isolate for maintenance","Control (switch on/off or vary) a circuit in normal service","Provide earth fault protection","Measure current"], a:1,
  why:"537.3 distinguishes functional switching — everyday on/off control — from isolation and emergency switching. Chapter 53 contents 'Functional switching'." },
{ p:5, reg:"537.4", q:"Emergency switching is intended to do what as quickly as possible?", o:["Save energy","Remove a hazard by cutting off the supply (e.g. emergency stop)","Reset a timer","Test the RCD"], a:1,
  why:"537.4 covers emergency switching/stopping to rapidly remove an unexpected danger. The operating means must be readily accessible. Chapter 53 contents 'Emergency switching off'." },
{ p:5, reg:"543.1.1", q:"The cross-sectional area of a protective conductor may be determined by which two recognised approaches?", o:["Guessing or copying","Calculation (adiabatic) or selection from Table 54.7","Weight or colour","Length or cost"], a:1,
  why:"543.1.1 permits either calculation using the adiabatic method (543.1.3) or selection from Table 54.7. Both are valid. Chapter 54 contents 'Cross-sectional areas'." },
{ p:5, reg:"Table 54.7", q:"By Table 54.7, if a line conductor is 16 mm^2, the minimum protective conductor (same material) is what?", o:["6 mm^2","16 mm^2","25 mm^2","4 mm^2"], a:1,
  why:"Table 54.7: for line conductors up to and including 16 mm^2, the CPC equals the line CSA; so 16 mm^2 line gives 16 mm^2 CPC. Above 16 up to 35 it becomes 16; over 35 it is half. Read Table 54.7 directly." },
{ p:5, reg:"544.1.1", q:"The main protective bonding conductor for a typical domestic PME (TN-C-S) supply must be at least what, related to the supply neutral?", o:["Half the neutral but min 6 mm^2 (per Table 54.8)","The same as a lighting circuit","Always 2.5 mm^2","Always 25 mm^2"], a:0,
  why:"544.1.1 and Table 54.8 size main bonding from the PEN/neutral; for PME it is generally half the neutral CSA subject to a 10 mm^2 minimum in many cases, but never less than 6 mm^2. Read Table 54.8 with the supply size." },
{ p:5, reg:"543.7.1.203", q:"A protective conductor whose CSA is below 10 mm^2 used to satisfy high protective conductor current requirements may need what?", o:["A second CPC or one of at least 10 mm^2","Painting","Removal","A bigger fuse"], a:0,
  why:"543.7 addresses installations with high protective conductor current (e.g. lots of IT loads), requiring a high-integrity CPC arrangement such as a single 10 mm^2 conductor or duplicate CPCs. Chapter 54 contents." },
{ p:5, reg:"559.5.1", q:"For luminaires, the manufacturer's instructions and markings determine what?", o:["The price","Suitability for the mounting surface, minimum distances and lamp ratings","The colour of the room","The cable colour only"], a:1,
  why:"Section 559 (luminaires) relies on equipment markings such as the 'F' mounting symbol and spacing/temperature data. Chapter 55 contents 'Luminaires and lighting installations'." },
{ p:5, reg:"522.8.10", q:"A flexible cable used for fixed wiring or where subject to movement must be selected for what?", o:["Decoration","The mechanical stresses and any movement it will experience","Maximum resistance","Minimum cost"], a:1,
  why:"522.8 covers mechanical stresses; flexible cables must suit the duty and any flexing. Chapter 52 contents 'Other mechanical stresses'." },
{ p:5, reg:"512.1.1", q:"Equipment must be selected so its characteristics are appropriate for what?", o:["The installer's preference","The nominal voltage, current, frequency, power and the conditions of installation","The colour scheme","The day of the week"], a:1,
  why:"512.1 lists the electrical characteristics equipment must suit — voltage, current, frequency, power — plus the conditions (512.2). Chapter 51 contents 'Common rules'." },
{ p:5, reg:"533.1.1", q:"A protective device for overcurrent should be selected so its nominal current relates to the circuit how?", o:["Below Ib","Not less than Ib but not exceeding the cable Iz","Exactly ten times Ib","Irrelevant"], a:1,
  why:"533.1 reinforces the Ib <= In <= Iz coordination from Chapter 43 when actually selecting the device. Chapter 53 contents 'Devices for protection against overcurrent'." },

/* ---------------- PART 6 ---------------- */
{ p:6, reg:"643.3.2", q:"Continuity of protective conductors is verified using a test at what kind of voltage?", o:["High voltage (500 V+)","Low voltage with a low-resistance ohmmeter","Mains 230 V live","No test needed"], a:1,
  why:"Continuity testing (643.2/643.3) uses a low-resistance ohmmeter (typically 200 mA, 4-24 V dc/ac). It confirms a sound, continuous protective conductor. Chapter 64 contents 'Inspection and testing'." },
{ p:6, reg:"643.3.3", q:"Insulation resistance for a 230/400 V circuit must be tested at what dc test voltage, with a minimum acceptable value of 1.0 MΩ?", o:["250 V","500 V","1000 V","50 V"], a:1,
  why:"Table 64 gives 500 V dc for circuits up to 500 V, with a 1.0 MΩ minimum. SELV/PELV use 250 V. Read Table 64 in Chapter 64." },
{ p:6, reg:"643.7.1", q:"Earth fault loop impedance Zs is measured to confirm what?", o:["Voltage drop","That disconnection will occur within the required time (Zs <= Uo/Ia)","Cable colour","Power factor"], a:1,
  why:"643.7 checks that measured Zs satisfies the disconnection requirement; compare against the maximum Zs for the device and time. Chapter 64 contents 'Earth fault loop impedance'." },
{ p:6, reg:"643.8", q:"Functional testing of an RCD by the test button confirms what?", o:["The trip times","Only that the mechanical tripping operates","Insulation resistance","Loop impedance"], a:1,
  why:"The integral test button only proves the mechanical trip; instrument testing is needed for trip times/currents (643.8). Chapter 64 contents 'Functional testing'." },
{ p:6, reg:"641.1", q:"Before a new installation is energised, what must be carried out?", o:["A coat of paint","Initial verification (inspection and testing) to confirm compliance","Nothing","Only a visual glance"], a:1,
  why:"641.1 requires initial verification — inspection plus testing — before the installation is put into service, with results recorded. Chapter 64 contents 'Initial verification'." },
{ p:6, reg:"651.2", q:"Periodic inspection and testing results are recorded on which document?", o:["An EIC","An EICR (Electrical Installation Condition Report)","A delivery note","A risk assessment only"], a:1,
  why:"Section 651/653 cover periodic inspection; the output is an EICR with observation codes. New work uses an EIC. Chapter 65 contents 'Periodic inspection and testing'." },
{ p:6, reg:"643.2.1", q:"During inspection, the use of correct protective devices and their settings is checked against what?", o:["The weather","The design / circuit details and the Regulations","The installer's mood","Random choice"], a:1,
  why:"643 inspection items confirm devices, ratings and settings match the design and comply. The schedule of inspections in Appendix 6 lists the items. Chapter 64 contents." },
{ p:6, reg:"polarity", q:"Polarity testing confirms that single-pole devices and fuses are connected where?", o:["In the neutral","In the line conductor only","In the earth","Anywhere"], a:1,
  why:"Polarity verification (within 643) ensures switches, fuses and single-pole devices are in the line conductor, and that socket/lampholder connections are correct. Chapter 64 contents 'Polarity'." },

/* ---------------- PART 7 ---------------- */
{ p:7, reg:"701.411.3.3", q:"In a location containing a bath or shower, which additional protection applies to circuits serving the location?", o:["100 mA RCD","30 mA RCD","No RCD","300 mA RCD"], a:1,
  why:"Section 701 requires 30 mA RCD additional protection for circuits serving a bath/shower room. Go to Section 701 in Part 7. The 30 mA figure recurs across special locations." },
{ p:7, reg:"701.32", q:"Bathroom zones are numbered to indicate risk. Which zone is inside the bath or shower basin itself?", o:["Zone 0","Zone 1","Zone 2","Outside zones"], a:0,
  why:"701 defines Zone 0 as the interior of the bath/shower basin — the wettest, highest-risk zone, where only SELV at 12 V AC/30 V DC equipment of suitable IP is allowed. See Section 701 zone definitions." },
{ p:7, reg:"701.512.2", q:"Within Zone 1 of a bathroom, equipment must have a minimum degree of protection of at least what?", o:["IP20","IPX4","IP2X","No requirement"], a:1,
  why:"701.512.2 sets minimum IPX4 in zones exposed to water (Zone 1/2), higher where water jets are used. Section 701 in Part 7 lists the IP requirements by zone." },
{ p:7, reg:"702.410.3.4.1", q:"For a swimming pool location, the principal additional shock measure in zones 0 and 1 relies heavily on what?", o:["Higher voltage","SELV (typically 12 V) and strict equipment selection","Bare conductors","Ignoring earthing"], a:1,
  why:"Section 702 (swimming pools) requires SELV in the highest-risk zones with the source outside the zones. Go to Section 702 in Part 7." },
{ p:7, reg:"705.411.1", q:"Agricultural and horticultural premises require enhanced RCD protection partly to protect what?", o:["Only the farmer","Livestock, which are sensitive to lower touch voltages","Tractors","Crops"], a:1,
  why:"Section 705 reflects that livestock tolerate lower touch voltages; socket-outlets up to 32 A need 30 mA RCDs and other circuits up to 100 mA. Section 705 in Part 7." },
{ p:7, reg:"706", q:"Conducting locations with restricted movement call for which measures because of the high shock risk?", o:["Normal domestic measures","SELV or other measures suited to confined conductive spaces","No measures","Higher voltages"], a:1,
  why:"Section 706 (conducting locations with restricted movement, e.g. inside a metal tank) requires SELV for hand-held tools/lamps and similar restrictive measures. Section 706 in Part 7." },
{ p:7, reg:"708", q:"Caravan and camping park electrical supplies: socket-outlets must be provided with what individual protection?", o:["Shared 100 mA RCD","Individual 30 mA RCD per socket and one socket per pitch","No RCD","One RCD for the whole park"], a:1,
  why:"Section 708 requires each pitch socket-outlet to have its own 30 mA RCD, and limits sockets per pitch. Section 708 in Part 7 (parks); 721 covers the caravan unit itself." },
{ p:7, reg:"711", q:"Exhibitions, shows and stands (Section 711) require which protection for temporary installations accessible to the public?", o:["None","RCD protection and robust mechanical/segregation measures","Higher voltage","Permanent wiring only"], a:1,
  why:"Section 711 addresses temporary public installations needing RCDs, mechanical protection and clear isolation. Section 711 in Part 7." },
{ p:7, reg:"712", q:"Solar PV systems (Section 712) require that the DC side is treated as what until proven otherwise?", o:["Dead during daylight","Live and a potential hazard whenever illuminated","Low risk","Disconnected automatically"], a:1,
  why:"Section 712 (PV) stresses the DC side can be live whenever there is light and cannot simply be switched off at source; isolation and labelling are critical. Section 712 in Part 7." },
{ p:7, reg:"714", q:"Outdoor lighting installations (Section 714) include what scope?", o:["Indoor lamps only","Highway, amenity and similar external lighting","Only Christmas lights","Battery torches"], a:1,
  why:"Section 714 covers fixed outdoor lighting such as road, amenity and floodlighting (excluding road traffic signal systems). Section 714 in Part 7." },
{ p:7, reg:"717", q:"Mobile or transportable units (Section 717) are, for example, what?", o:["Fixed houses","Containerised or vehicle-based units such as welfare cabins","Underground cables","Overhead lines"], a:1,
  why:"Section 717 applies to mobile/transportable units like trailers and containers used as workplaces or facilities, with rules on the incoming supply and protective measures. Section 717 in Part 7." },
{ p:7, reg:"722", q:"Section 722 of BS 7671 covers which increasingly common installation?", o:["Saunas","Electric vehicle charging installations","Marinas","Fountains"], a:1,
  why:"Section 722 is the EV charging section, with rules on RCD type (often Type B or equivalent for DC fault detection) and PME earthing restrictions. Section 722 in Part 7." },
{ p:7, reg:"722.531.3.101", q:"For an EV charging point on a PME supply, the open-PEN concern is typically addressed by which approaches?", o:["Ignoring it","An earth electrode / device detecting voltage or current anomalies, or not using PME earth","Bigger fuse","More sockets"], a:1,
  why:"722 restricts PME earthing for EV points unless protective measures detect a broken PEN (voltage/current monitoring) or a suitable TT electrode is used. Section 722 in Part 7." },
{ p:7, reg:"753", q:"Floor and ceiling heating systems (Section 753) require attention to what particular risk?", o:["Colour","Temperature limitation and additional 30 mA RCD protection","Noise","Smell"], a:1,
  why:"Section 753 covers embedded heating with temperature limits and 30 mA RCD protection of the heating circuits. Section 753 in Part 7." },
{ p:7, reg:"704", q:"Construction and demolition site installations (Section 704) need reduced disconnection or extra RCD protection because of what?", o:["The cost","The harsh environment and increased shock risk for workers","The colour scheme","The lighting"], a:1,
  why:"Section 704 applies enhanced protection — RCDs and reduced low-voltage systems (e.g. 110 V CTE) — for the rough conditions of construction sites. Section 704 in Part 7." },

/* ---------------- PART 8 (APPENDICES) ---------------- */
{ p:8, reg:"Appendix 3", q:"Appendix 3 of BS 7671 provides what?", o:["Cable colours","Time/current characteristics and maximum Zs values for protective devices","Definitions","Model forms"], a:1,
  why:"Appendix 3 gives the device time/current curves and the maximum earth fault loop impedance (Zs) tables for fuses and circuit-breakers. When a question needs a max Zs, go to Appendix 3." },
{ p:8, reg:"Appendix 4", q:"Where do you find the tabulated current-carrying capacities and voltage-drop data for cables?", o:["Appendix 1","Appendix 4","Appendix 6","Appendix 9"], a:1,
  why:"Appendix 4 holds the current-carrying capacity tables, the installation reference methods and the voltage-drop (mV/A/m) figures. It is one of the most-used appendices in the exam." },
{ p:8, reg:"Appendix 2", q:"Appendix 2 lists what kind of material?", o:["Model certificates","Statutory regulations and related memoranda","Cable ratings","Symbols"], a:1,
  why:"Appendix 2 sets out the relevant statutory regulations and associated guidance, showing how BS 7671 sits alongside the law. For 'which law applies', look in Appendix 2." }
];

/* Tag each question with its part name and a stable id, and validate. */
TRAINER_Q.forEach((q, i) => {
  q.id = i + 1;
  q.partName = TRAINER_PARTS[q.p];
});

</script>
<script>
document.addEventListener('DOMContentLoaded', function () {
  const app = document.getElementById('app');
  const navBtns = Array.from(document.querySelectorAll('#nav button'));

  /* Test Yourself pool = the 27 MCQs + the 197 Answer-Finder questions (mapped to MCQ shape) */
  const QUIZ_POOL = MCQS.concat(TRAINER_Q.map(function(t){
    return { topic:(t.p<=7?('Part '+t.p):'Appendices'), q:t.q, options:t.o, correct:t.a, explain:t.why };
  }));

  /* icons */
  const IC = {
    book:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 5a2 2 0 012-2h12v16H6a2 2 0 00-2 2V5z"/><path d="M4 19a2 2 0 012-2h12"/></svg>',
    search:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4"/></svg>',
    cards:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="6" width="14" height="14" rx="2"/><path d="M7 3h13a1 1 0 011 1v12"/></svg>',
    check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 11l3 3 8-8"/><path d="M21 12v6a2 2 0 01-2 2H5a2 2 0 01-2-2V6a2 2 0 012-2h11"/></svg>',
    target:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/></svg>',
    skills:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3l2.5 5 5.5.8-4 3.9.9 5.5L12 21l-5-2.9.9-5.5-4-3.9L9.5 8z"/></svg>',
    sections:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="9" y1="6" x2="20" y2="6"/><line x1="9" y1="12" x2="20" y2="12"/><line x1="9" y1="18" x2="20" y2="18"/><path d="M4 6h.01M4 12h.01M4 18h.01"/></svg>'
  };

  /* ---------- ROUTER ---------- */
  window.go = function (view, arg) {
    navBtns.forEach(b => b.classList.toggle('active', b.dataset.view === view || (view === 'part' && b.dataset.view === 'parts')));
    window.scrollTo({top:0,behavior:'smooth'});
    const render = ({home:renderHome,parts:renderParts,part:()=>renderPart(arg),index:renderIndex,definitions:renderDefinitions,figures:renderFigures,
      flashcards:renderFlash,quiz:renderQuiz,keyword:renderKeyword,examskills:renderExam,trainer:function(){window.renderTrainer();},a4:renderA4}[view]) || renderHome;
    render();
  };
  navBtns.forEach(b => b.addEventListener('click', () => go(b.dataset.view)));

  /* ---------- HOME ---------- */
  const PART_EMOJI = {p1:'📖',p2:'🔤',p3:'⚡',p4:'🛡️',p5:'🛠️',p6:'🔍',p7:'🛁',p8:'🔋',appx:'📎'};

  /* ---------- AMENDMENT 4 : 2026 — What's New ---------- */
  function renderA4(){
    const card = r => `<div class="reg" onclick="this.classList.toggle('open')">
        <div class="reg-head"><span class="ref">${r.ref}</span><span class="what">${r.topic}</span>
          <svg class="reg-chev" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 6l6 6-6 6"/></svg></div>
        <div class="reg-detail"><div class="reg-detail-inner">${r.detail}</div></div>
      </div>`;
    const groups = [
      { t:"Part 1 — Scope", emoji:"📖", items:[
        {ref:"110.1.1", topic:"Scope extended to batteries and PoE", detail:"The scope of BS 7671 now expressly covers two new types of installation: <b>stationary secondary batteries</b> for the storage and supply of electrical installations, and <b>Power over Ethernet (PoE)</b>. Both bring their own new chapters/sections (Chapter 57 and Section 716)."}
      ]},
      { t:"Part 2 — Terms & Definitions", emoji:"🔤", items:[
        {ref:"Part 2", topic:"New terms for the extended scope", detail:"New/expanded definitions include <b>Battery</b>, <b>Primary cell</b> (not rechargeable), <b>Secondary cell</b> (rechargeable), <b>Transfer switching equipment (TSE)</b>, <b>Balanced cable</b> (twisted pairs/quads for data), and <b>Protective Neutral Bonding (PNB)</b> — a TN-C-S arrangement earthed at a single point near the consumer."},
        {ref:"545.1 / 825.1", topic:"New symbols & abbreviations", detail:"New abbreviated terms appear, e.g. <b>MFET</b> — main functional earthing terminal (545.1) — and <b>EEMS</b> — electrical energy management system (825.1) — supporting the new ICT-earthing and battery chapters."}

        {ref:"422.2.201", topic:"Cables in fire-fighting shafts / protected stairways", detail:"New UK regulation: cables and electrical equipment must <b>not</b> be installed in a fire-fighting shaft or a protected stairway of a protected escape route <em>unless</em> they serve (a) an essential fire-safety or related system, (b) general-needs lighting, or (c) socket-outlets for cleaning/maintenance."},
        {ref:"422.2.202", topic:"Fire-rated cable in a fire-resisting enclosure", detail:"New UK regulation clarifying that fire-rated cables run inside a suitably rated fire-resisting enclosure within a protected escape route are <b>deemed to be outside</b> that route — so they are acceptable. This effectively permits wiring in protected escape routes where it previously seemed barred. Appendix 13 has been rewritten to match."},
        {ref:"434.2.1", topic:"'Inherently short-circuit proof and earth-fault proof'", detail:"Section 434 (protection against fault current) is redrafted and introduces the term <b>'inherently short-circuit proof and earth fault proof'</b> — equipment/assemblies protected by suitable design and erection. A note reminds designers this may only hold under certain conditions of use, and that a non-combustible enclosure (e.g. metal conduit/trunking) reduces risk."}
      ]},
      { t:"Part 5 — Selection & Erection (most affected)", emoji:"🛠️", items:[
        {ref:"Table 51", topic:"Pink functional-earth identification & new symbols", detail:"Table 51 gains symbols for identifying <b>functional earthing/bonding</b> and combined protective + functional bonding conductors. The colour for functional earthing/bonding is <b>pink</b> (it replaced cream back in A2:2022). These conductors may be required by Section 444 (EMC) and installed to the new Section 545."},
        {ref:"521.10.202", topic:"Cable support — intent clarified", detail:"A note clarifies the rule is about preventing the <b>general collapse</b> of wiring that would hinder evacuation, rescue or firefighter access — it is <em>not</em> about maintaining circuit integrity for life-safety systems under fire (that is Chapter 56 and codes such as BS 5266, BS 5839, BS 8519)."},
        {ref:"Table 52.1", topic:"New table — cables concealed in walls/partitions", detail:"A new Table 52.1 consolidates the Group 522.6 rules for cables concealed in a wall or partition (depth, prescribed safe zones, 30 mA RCD, and walls with/without metallic parts) into one streamlined reference."},
        {ref:"522.8.10", topic:"Buried cables — marking and protection", detail:"Buried cables must incorporate an earthed armour/metal sheath suitable as a protective conductor (unless in conduit/duct giving equivalent protection), be <b>marked by cable covers or marker tape</b>, and be at sufficient depth. A note recognises N750-rated underground conduits (BS EN 50626-1 / BS EN 61386-24) as equivalent mechanical protection."},
        {ref:"526.9.1 / Table 52.4", topic:"Connections — conductor class", detail:"Connections must take account of the <b>conductor class</b> (new Table 52.4: Class 1 solid, Class 2 stranded, Class 5 fine, Class 6 very fine). To stop fine/very-fine wires spreading at a terminal, suitable terminals or treated ends (e.g. crimp ferrules) may be needed."},
        {ref:"530.3.201", topic:"Unidirectional vs bidirectional devices", detail:"You must take account of whether a protective device is <b>unidirectional or bidirectional</b> — critical where power can flow both ways (PV, battery, V2G). Devices may be marked in/out, line/load or with arrows. First introduced in A3:2024 and now consolidated into the book."},
        {ref:"531.3.3", topic:"RCD types in series — avoid 'blinding'", detail:"A new note and diagram (Fig A53.2) address RCDs in series. To avoid <b>RCD 'blinding'</b>, a less-capable type should not sit upstream of a more-capable one — e.g. don't fit a Type AC upstream of A/F/B, or a Type A upstream of F/B, or a Type F upstream of B — unless the manufacturer declares the arrangement suitable."},
        {ref:"536.4.202", topic:"Assembly coordination + load curtailment", detail:"Redrafted coordination between a low-voltage switchgear/controlgear assembly (e.g. a consumer unit or distribution board) and its overload device. One of three conditions must be met, now including <b>load curtailment</b> to limit maximum demand. Diversity may <em>not</em> be used as a means of load curtailment or overload protection."},
        {ref:"537", topic:"Isolation — 'disconnector' & 'switch-disconnector'", detail:"Table 537.4 is amended and the devices recognised for isolation now include a <b>disconnector</b> (a no-load device) and a <b>switch-disconnector</b> (an isolating switch suitable for on-load isolation), alongside the isolating switch. 537.4.2: a firefighter's switch is required where specified by the fire engineer (e.g. HV outdoor lighting, LV indoor discharge lighting)."},
        {ref:"545 (new)", topic:"Functional earthing & bonding for ICT", detail:"A brand-new section for <b>functional earthing and functional-equipotential-bonding for information & communication technology (ICT)</b> — data centres, broadcast/comms kit. It sets minimum CSA, identification (pink), continuity, the main functional earthing terminal (MFET) and equipotential bonding ring conductors, to reduce electromagnetic interference (links to Section 444)."},
        {ref:"551.7", topic:"Generating sets & batteries — bidirectional flow", detail:"551.7.1 adds a requirement for a suitable protective device where energy flow is bidirectional, and prohibits connecting a source on the load side of an RCD under certain conditions. 551.7.2: the generating set must be on the supply side of all protective devices, and <b>stationary batteries are treated as a generating set, not a load</b>."}
      ]},
      { t:"New Chapter 57 — Stationary Secondary Batteries", emoji:"🔋", items:[
        {ref:"Chapter 57 (new)", topic:"Battery energy storage systems (EESS)", detail:"An entirely new chapter (18+ regulations) for stationary secondary battery installations used to store and supply an installation. It covers selection of the battery, power conversion equipment (PCE) and electrical energy management system (EEMS); earthing; shock protection and ADS by RCD; <b>DC-side fault protection</b>; isolation (stored energy can remain after isolation); and identification/notices. References <b>BSI PAS 63100</b> for fire-safe siting."},

        {ref:"710", topic:"Medical locations — fully revised", detail:"Section 710 is comprehensively revised and aligned with NHS requirements. Group 2 locations need <b>two independent supplies plus a UPS</b> (710.313.1.102 / BS 8519). Use <b>25 V AC</b> (not 50 V) for the TT RCD fault-protection condition; RCD additional protection is not used on medical-IT circuits; the MED-IMD is specified (710.411.6.3.101). A new Annex B710 schedule requires the <b>measured resistance of each supplementary bonding conductor</b> to be recorded at initial (710.64) and periodic (710.65) verification."},

        {ref:"722.421.1.7.201", topic:"EV charging — AFDDs not required", detail:"Clarifies that <b>AFDDs are not required</b> for circuits supplying EV charging equipment conforming to the BS EN 61851 series that incorporate socket-outlets or vehicle connectors to BS EN IEC 62196-2."}

  /* ---------- INDEX FINDER ---------- */
  function renderIndex(){
    app.innerHTML = `
      <div class="crumb">Index Finder</div>
      <div class="sec-title"><span class="n">${IC.search}</span>Index Finder</div>
      <p class="sec-sub">Type a keyword <em>or a phrase</em> the way it appears in an exam question — word order doesn't matter, every word just has to appear somewhere in the entry. The index shows the regulation number and the Part it lives in.</p>
      <div class="searchwrap">${IC.search}<input id="idxSearch" placeholder="e.g. cables in walls · supplementary bonding bathroom · RCD socket · EV charging…" autocomplete="off"></div>
      <div class="idx-count" id="idxCount"></div>
      <div class="idx-list" id="idxList"></div>`;
    const input = document.getElementById('idxSearch');
    const list = document.getElementById('idxList');
    const count = document.getElementById('idxCount');
    const sorted = INDEX_ENTRIES.slice().sort((a,b)=>a.term.localeCompare(b.term));
    function esc(s){return s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');}
    const norm = s => s.toLowerCase().replace(/[’'`]/g,'');
    function draw(q){
      const raw = q.trim();
      const tokens = norm(raw).split(/\s+/).filter(Boolean);
      const rows = sorted.filter(e => {
        if(!tokens.length) return true;
        const hay = norm(e.term + ' ' + e.ref + ' ' + e.part);
        return tokens.every(t => hay.includes(t)); // phrase = every word must appear
      });
      count.textContent = raw ? `${rows.length} match${rows.length!==1?'es':''} for “${raw}”` : `${sorted.length} indexed terms — type a word or phrase to filter`;
      const re = tokens.length ? new RegExp('('+tokens.map(esc).join('|')+')','ig') : null;
      list.innerHTML = rows.length ? rows.map(e=>{
        let term = e.term;
        if(re) term = term.replace(re,'<span class="hl">$1</span>');
        return `<div class="idx-row"><span class="term">${term}</span><span class="ppart">${e.part}</span><span class="ref">${e.ref}</span></div>`;
      }).join('') : `<div class="idx-row"><span class="term" style="color:var(--ink-soft)">No match. Try fewer or broader words — the index uses the main nouns (e.g. “cables walls”, “bonding bathroom”).</span></div>`;
    }
    input.addEventListener('input',()=>draw(input.value));
    draw('');
    input.focus();
  }

  function renderDefinitions(){
    const cats = Array.from(new Set(DEFINITIONS.map(d=>d.cat))).sort();
    app.innerHTML = `
      <div class="crumb"><b>Part 2</b> &nbsp;›&nbsp; Definitions</div>
      <div class="sec-title"><span class="n">A→Z</span>Definitions</div>
      <p class="sec-sub">Part 2 of BS 7671 is the dictionary, and exam questions love testing a precise definition. Search a word or phrase, or tap a category to filter. Explanations are in plain English for study.</p>
      <div class="searchwrap">${IC.search}<input id="defSearch" placeholder="e.g. extraneous · fault protection · SELV · earthing system · skilled person…" autocomplete="off"></div>
      <div class="toolbar" id="defChips"><button class="chip on" data-c="All">All</button>${cats.map(c=>`<button class="chip" data-c="${c}">${c}</button>`).join('')}</div>
      <div class="idx-count" id="defCount"></div>
      <div id="defList"></div>`;
    const input = document.getElementById('defSearch');
    const list = document.getElementById('defList');
    const count = document.getElementById('defCount');
    const sorted = DEFINITIONS.slice().sort((a,b)=>a.term.localeCompare(b.term));
    let activeCat = 'All';
    function esc(s){return s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');}
    const norm = s => s.toLowerCase().replace(/[’'`]/g,'');
    function draw(q){
      const raw = q.trim();
      const tokens = norm(raw).split(/\s+/).filter(Boolean);
      const rows = sorted.filter(d => {
        if(activeCat!=='All' && d.cat!==activeCat) return false;
        if(!tokens.length) return true;
        const hay = norm(d.term + ' ' + d.def + ' ' + d.cat);
        return tokens.every(t => hay.includes(t));
      });
      const note = (raw?`${rows.length} match${rows.length!==1?'es':''} for “${raw}”`:`${rows.length} term${rows.length!==1?'s':''}`) + (activeCat!=='All'?` in ${activeCat}`:'');
      count.textContent = note;
      const re = tokens.length ? new RegExp('('+tokens.map(esc).join('|')+')','ig') : null;
      // group by first letter
      let html = '', lastLetter = '';
      rows.forEach(d=>{
        const L = d.term[0].toUpperCase();
        if(L!==lastLetter){ if(lastLetter) html+='</div>'; html+=`<div class="def-letter">${L}</div><div class="def-group">`; lastLetter=L; }
        let term = d.term, def = d.def;
        if(re){ term = term.replace(re,'<span class="hl">$1</span>'); def = def.replace(re,'<span class="hl">$1</span>'); }
        html += `<div class="def-row"><div class="def-head"><span class="def-term">${term}</span><span class="def-cat">${d.cat}</span></div><div class="def-text">${def}</div></div>`;
      });
      if(lastLetter) html+='</div>';
      list.innerHTML = rows.length ? html : `<div class="idx-list"><div class="idx-row"><span class="term" style="color:var(--ink-soft)">No matching definition. Try a broader word, e.g. “bonding”, “protection” or “voltage”.</span></div></div>`;
    }
    document.querySelectorAll('#defChips .chip').forEach(c=>c.addEventListener('click',()=>{
      document.querySelectorAll('#defChips .chip').forEach(x=>x.classList.remove('on'));
      c.classList.add('on'); activeCat=c.dataset.c; draw(input.value);
    }));
    input.addEventListener('input',()=>draw(input.value));
    draw('');
    input.focus();
  }

  function renderFigures(){
    app.innerHTML = `
      <div class="crumb">Table of Figures</div>
      <div class="sec-title"><span class="n">▣</span>Table of Figures</div>
      <p class="sec-sub">The diagrams in BS 7671 — earthing systems, conductor arrangements, zones and bonding. Search by figure number or topic (phrases work too). Where your copy's page number is known it's shown; otherwise the related section is given, which is the surest way to find a figure in the open-book exam.</p>
      <div class="searchwrap">${IC.search}<input id="figSearch" placeholder="e.g. TN-C-S · earthing systems · bathroom zones · arm's reach…" autocomplete="off"></div>
      <div class="idx-count" id="figCount"></div>
      <div class="idx-list" id="figList"></div>`;
    const input = document.getElementById('figSearch');
    const list = document.getElementById('figList');
    const count = document.getElementById('figCount');
    function esc(s){return s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');}
    const norm = s => s.toLowerCase().replace(/[’'`]/g,'');
    function draw(q){
      const raw = q.trim();
      const tokens = norm(raw).split(/\s+/).filter(Boolean);
      const rows = FIGURES.filter(f => {
        if(!tokens.length) return true;
        const hay = norm(f.fig + ' ' + f.title + ' ' + f.ref + ' ' + (f.page||''));
        return tokens.every(t => hay.includes(t));
      });
      count.textContent = raw ? `${rows.length} figure${rows.length!==1?'s':''} for “${raw}”` : `${FIGURES.length} figures — type to filter`;
      const re = tokens.length ? new RegExp('('+tokens.map(esc).join('|')+')','ig') : null;
      list.innerHTML = rows.length ? rows.map(f=>{
        let title = f.title, fig = f.fig;
        if(re){ title = title.replace(re,'<span class="hl">$1</span>'); fig = fig.replace(re,'<span class="hl">$1</span>'); }
        const where = f.page ? `p.${f.page}` : f.ref;
        return `<div class="idx-row"><span class="ref" style="background:var(--copper-soft);color:var(--copper-d)">${fig}</span><span class="term">${title}</span><span class="ppart">${f.ref}</span><span class="ref">${where}</span></div>`;
      }).join('') : `<div class="idx-row"><span class="term" style="color:var(--ink-soft)">No matching figure. Try a broader term such as “system”, “zone” or “bonding”.</span></div>`;
    }
    input.addEventListener('input',()=>draw(input.value));
    draw('');
    input.focus();
  }

  /* ---------- FLASH CARDS ---------- */
  let fcSet=[], fcPos=0;
  function renderFlash(){
    const topics = ['All', ...Array.from(new Set(FLASHCARDS.map(c=>c.topic))).sort((a,b)=>{
      const k=s=>s==='Appendices'?99:(parseInt(s.replace(/[^0-9]/g,''),10)||98);
      return k(a)-k(b);
    })];
    app.innerHTML = `
      <div class="crumb">Flash Cards</div>
      <div class="sec-title"><span class="n">${IC.cards}</span>Flash Cards</div>
      <p class="sec-sub">Tap the card to reveal the answer. Filter by Part, or shuffle the whole deck.</p>
      <div class="toolbar" id="fcChips">${topics.map((t,i)=>`<button class="chip ${i===0?'on':''}" data-t="${t}">${t}</button>`).join('')}
        <button class="chip" id="fcShuffle">⤮ Shuffle</button></div>
      <div class="fc-stage"><div class="flashcard" id="flashcard"><div class="fc-inner">
        <div class="fc-face fc-front"><div class="kicker" id="fcTopic"></div><div class="q" id="fcQ"></div><div class="fc-hint">click to flip ↻</div></div>
        <div class="fc-face fc-back"><div class="kicker">Answer</div><div class="a" id="fcA"></div><div class="fc-hint">click to flip back ↻</div></div>
      </div></div></div>
      <div class="fc-controls">
        <button class="btn btn-ghost" id="fcPrev">← Prev</button>
        <span class="fc-progress" id="fcProg"></span>
        <button class="btn btn-primary" id="fcNext">Next →</button>
      </div>`;
    setFcSet('All');
    const card=document.getElementById('flashcard');
    card.addEventListener('click',()=>card.classList.toggle('flip'));
    document.getElementById('fcNext').addEventListener('click',()=>moveFc(1));
    document.getElementById('fcPrev').addEventListener('click',()=>moveFc(-1));
    document.getElementById('fcShuffle').addEventListener('click',()=>{
      document.querySelectorAll('#fcChips .chip').forEach(c=>c.classList.remove('on'));
      fcSet=FLASHCARDS.slice().sort(()=>Math.random()-0.5);fcPos=0;showFc();
    });
    document.querySelectorAll('#fcChips .chip[data-t]').forEach(c=>c.addEventListener('click',()=>{
      document.querySelectorAll('#fcChips .chip').forEach(x=>x.classList.remove('on'));
      c.classList.add('on');setFcSet(c.dataset.t);
    }));
  }
  function setFcSet(t){fcSet=(t==='All')?FLASHCARDS.slice():FLASHCARDS.filter(c=>c.topic===t);fcPos=0;showFc();}
  function showFc(){
    const c=fcSet[fcPos];if(!c)return;
    const card=document.getElementById('flashcard');card.classList.remove('flip');
    setTimeout(()=>{
      document.getElementById('fcTopic').textContent=c.topic;
      document.getElementById('fcQ').innerHTML=c.q;
      document.getElementById('fcA').innerHTML=c.a;
    },card.classList.contains('flip')?300:0);
    document.getElementById('fcProg').textContent=`${fcPos+1} / ${fcSet.length}`;
    document.getElementById('fcPrev').disabled=fcPos===0;
    document.getElementById('fcNext').disabled=fcPos===fcSet.length-1;
  }
  function moveFc(d){const n=fcPos+d;if(n<0||n>=fcSet.length)return;fcPos=n;showFc();}

  /* ---------- QUIZ ---------- */
  let qSet=[], qPos=0, qScore=0, qAnswered=false;
  function renderQuiz(){
    const topics=['All',...Array.from(new Set(QUIZ_POOL.map(q=>q.topic))).sort((a,b)=>{
      const k=s=>s==='Appendices'?99:(parseInt(s.replace(/[^0-9]/g,''),10)||98);
      return k(a)-k(b);
    })];
    app.innerHTML=`
      <div class="crumb">Test Yourself</div>
      <div class="sec-title"><span class="n">${IC.check}</span>Test Yourself</div>
      <p class="sec-sub">Pick a topic or take the lot. Each answer reveals a worked explanation pointing to the regulation.</p>
      <div class="toolbar" id="qChips">${topics.map((t,i)=>`<button class="chip ${i===0?'on':''}" data-t="${t}">${t}</button>`).join('')}</div>
      <div id="quizBody"></div>`;
    document.querySelectorAll('#qChips .chip').forEach(c=>c.addEventListener('click',()=>{
      document.querySelectorAll('#qChips .chip').forEach(x=>x.classList.remove('on'));
      c.classList.add('on');startQuiz(c.dataset.t);
    }));
    startQuiz('All');
  }
  function startQuiz(t){
    qSet=((t==='All')?QUIZ_POOL.slice():QUIZ_POOL.filter(q=>q.topic===t)).sort(()=>Math.random()-0.5);
    qPos=0;qScore=0;showQ();
  }
  function showQ(){
    const body=document.getElementById('quizBody');const q=qSet[qPos];qAnswered=false;
    const pct=Math.round((qPos/qSet.length)*100);
    body.innerHTML=`
      <div class="quiz-card">
        <div class="progbar"><span style="width:${pct}%"></span></div>
        <div class="quiz-meta"><span>Question ${qPos+1} of ${qSet.length} · <b style="color:var(--copper-d)">${q.topic}</b></span>
          <span class="scorepill">Score ${qScore}/${qPos}</span></div>
        <div class="quiz-q">${q.q}</div>
        <div id="opts">${q.options.map((o,i)=>`<button class="opt" data-i="${i}"><span class="ltr">${'ABCD'[i]}</span>${o}</button>`).join('')}</div>
        <div class="explain" id="explain"></div>
        <div class="quiz-foot"><span></span><button class="btn btn-primary" id="qNext" style="display:none">${qPos===qSet.length-1?'See results':'Next question'} →</button></div>
      </div>`;
    document.querySelectorAll('#opts .opt').forEach(b=>b.addEventListener('click',()=>answerQ(+b.dataset.i)));
    document.getElementById('qNext').addEventListener('click',()=>{if(qPos===qSet.length-1)showResult();else{qPos++;showQ();}});
  }
  function answerQ(i){
    if(qAnswered)return;qAnswered=true;const q=qSet[qPos];
    const opts=document.querySelectorAll('#opts .opt');
    opts.forEach((b,j)=>{b.classList.add('locked');if(j===q.correct)b.classList.add('correct');if(j===i&&i!==q.correct)b.classList.add('wrong');});
    if(i===q.correct)qScore++;
    const ex=document.getElementById('explain');
    ex.innerHTML=`<b>${i===q.correct?'✓ Correct.':'✗ Not quite.'}</b> ${q.explain}`;
    ex.classList.add('show');
    document.getElementById('qNext').style.display='inline-block';
    document.querySelector('.scorepill').textContent=`Score ${qScore}/${qPos+1}`;
  }
  function showResult(){
    const pct=Math.round((qScore/qSet.length)*100);
    let msg = pct>=80?'Exam-ready on this topic. Strong navigation instincts.':pct>=55?'Solid — review the ones you missed and the regs they point to.':'Keep going. Re-read the relevant Part, then retry.';
    document.getElementById('quizBody').innerHTML=`
      <div class="quiz-card result">
        <div class="big">${pct}%</div>
        <h3>${qScore} out of ${qSet.length}</h3>
        <p style="color:var(--ink-soft);margin-bottom:22px">${msg}</p>
        <button class="btn btn-primary" onclick="document.querySelector('#qChips .chip.on').click()">Try again</button>
        <button class="btn btn-ghost" onclick="go('keyword')">Train keyword spotting →</button>
      </div>`;
  }

  /* ---------- KEYWORD TRAINER ---------- */
  let kwPos=0;
  function renderKeyword(){
    app.innerHTML=`
      <div class="crumb">Keyword Trainer</div>
      <div class="sec-title"><span class="n">${IC.target}</span>Keyword Trainer</div>
      <p class="sec-sub">Read the question. <b>Try to spot the trigger words yourself first</b>, then reveal each step to check your method: keywords → which Part/Chapter → the regulation → the answer.</p>
      <div class="toolbar">
        <button class="btn btn-ghost" id="kwPrev">← Previous</button>
        <span class="fc-progress" id="kwProg"></span>
        <button class="btn btn-ghost" id="kwNext">Next question →</button>
        <button class="btn btn-primary" id="kwRand" style="margin-left:auto">⤮ Random</button>
      </div>
      <div id="kwBody"></div>`;
    document.getElementById('kwPrev').addEventListener('click',()=>{if(kwPos>0){kwPos--;showKw();}});
    document.getElementById('kwNext').addEventListener('click',()=>{if(kwPos<KEYWORD_EXERCISES.length-1){kwPos++;showKw();}});
    document.getElementById('kwRand').addEventListener('click',()=>{kwPos=Math.floor(Math.random()*KEYWORD_EXERCISES.length);showKw();});
    showKw();
  }
  function showKw(){
    const e=KEYWORD_EXERCISES[kwPos];
    document.getElementById('kwProg').textContent=`${kwPos+1} / ${KEYWORD_EXERCISES.length}`;
    document.getElementById('kwPrev').disabled=kwPos===0;
    document.getElementById('kwNext').disabled=kwPos===KEYWORD_EXERCISES.length-1;
    const steps=[
      ['1','Spot the keywords',`<div class="kwlist">${e.keywords.map(k=>`<span>${k}</span>`).join('')}</div><p style="margin-top:8px">${e.keywordNote}</p>`],
      ['2','Decide where to look',`<p>${e.look}</p>`],
      ['3','Find the regulation',`<p>The relevant regulation reference is:</p><span class="reftag">${e.reg}</span>`],
      ['4','The answer',`<p>${e.answer}</p>`]
    ].map(([n,t,b])=>`
      <div class="kw-step" onclick="this.classList.toggle('open')">
        <div class="kw-step-h"><div class="sn">${n}</div><div class="st">${t}</div>
          <svg class="chev" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 6l6 6-6 6"/></svg></div>
        <div class="kw-step-b"><div class="inner">${b}</div></div>
      </div>`).join('');
    document.getElementById('kwBody').innerHTML=`
      <div class="kw-card">
        <div class="kw-tag">Exam-style question ${kwPos+1}</div>
        <div class="kw-q">${e.q}</div>
        <p style="font-size:.84rem;color:var(--ink-soft);margin:6px 2px 2px">Reveal each step in order:</p>
        ${steps}
      </div>`;
  }

  /* ---------- EXAM SKILLS ---------- */
  function renderExam(){
    const steps=[
      ['1','Read the whole question first','Don\'t reach for the book yet. Read it once for meaning. Exam questions are written to sound complicated — strip them back to "what are they actually asking?"'],
      ['2','Underline the trigger words','Certain words point to a Part almost on their own. "Socket-outlet", "disconnection time", "bonding", "bathroom", "RCD type", "EV charging" — each has a home in the book. Circle them.'],
      ['3','Map keyword → Part','Shock, RCDs, disconnection, AFDD, SPD → Part 4. Cable sizing, colours, devices, earthing → Part 5. Testing & certificates → Part 6. Any named location → Part 7. Lookup tables → Appendices.'],
      ['4','Use the Index, not your memory','In an open-book exam the Index is faster than flicking through chapters. Search the main noun ("bonding"), get the regulation number, turn straight to it. Practise this in the Index Finder.'],
      ['5','Confirm in the regulation, then answer','Land on the reg, read the exact wording (numbers, exceptions, "shall" vs "should"), and answer from the text — not from what you half-remember. The detail is usually in the exceptions.']
    ].map(([n,t,d],i)=>`
      <div class="method-step"><div class="mn">${n}</div><div><h3>${t}</h3><p>${d}</p></div></div>
      ${i<4?'<div class="arrow-down">↓</div>':''}`).join('');
    app.innerHTML=`
      <div class="crumb">Exam Skills</div>
      <div class="sec-title"><span class="n">${IC.skills}</span>The Open-Book Method</div>
      <p class="sec-sub">The 18th Edition exam is open-book and timed. You're not tested on memorising the regs — you're tested on <em>finding</em> them quickly and reading them precisely. Here's the method.</p>
      ${steps}
      <div class="callout">
        <b>The keyword habit.</b> Most marks are lost by people who know the content but search the wrong Part. Build the reflex: see a trigger word → name the Part out loud → confirm via the Index. Drill it in the <a href="#" onclick="go('keyword');return false" style="color:var(--copper-d);font-weight:600">Keyword Trainer</a>.
      </div>
      <div class="callout" style="background:#eef3fb;border-color:var(--navy-2);border-left-color:var(--navy-2)">
        <b>"Shall" vs "should".</b> In BS 7671, <b>shall</b> = a requirement you must meet; <b>should</b> = a recommendation. Exam questions often hinge on this single word, so read it carefully when you land on the regulation.
      </div>
      <div class="toolbar" style="margin-top:24px">
        <button class="btn btn-primary" onclick="go('keyword')">Start the Keyword Trainer →</button>
        <button class="btn btn-ghost" onclick="go('index')">Open the Index Finder</button>
      </div>`;
  }

  /* boot */
  go('home');
});
</script>
