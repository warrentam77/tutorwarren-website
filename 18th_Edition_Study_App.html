<script>
/* ============================================================================
   18th Edition — Answer-Finding Trainer  (tutorwarren.com)
   Self-contained module bolted onto the Study App's view router.
   Data: TRAINER_Q (197), TRAINER_PARTS, TRAINER_BLUEPRINT (defined above).
   ============================================================================ */
(function(){
  "use strict";
  var app, LET=['A','B','C','D'];
  function el(){ return document.getElementById('app'); }
  function esc(s){return String(s).replace(/[&<>]/g,function(c){return({'&':'&amp;','<':'&lt;','>':'&gt;'})[c];});}
  function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
  function pLabel(p){var n=TRAINER_PARTS[p];return n.split('\u2013')[1]?n.split('\u2013')[1].trim():n;}
  function pHead(p){return TRAINER_PARTS[p].split('\u2013')[0].trim();}

  /* persistence */
  var mem={};
  function get(k){try{var v=localStorage.getItem(k);return v===null?mem[k]:v;}catch(e){return mem[k];}}
  function set(k,v){try{localStorage.setItem(k,v);}catch(e){mem[k]=v;}}
  function loadSeen(){try{return JSON.parse(get('tw18_seen')||'{}');}catch(e){return {};}}
  var seen=loadSeen();
  function markSeen(id){if(!seen[id]){seen[id]=1;set('tw18_seen',JSON.stringify(seen));}}
  function countByPart(){var c={};TRAINER_Q.forEach(function(q){c[q.p]=(c[q.p]||0)+1;});return c;}

  var TGT='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/></svg>';

  /* ---------------- LANDING ---------------- */
  window.renderTrainer=function(){
    app=el(); stopTimer();
    var best=get('tw18_best'); var nseen=Object.keys(seen).length;
    app.innerHTML=
      '<div class="crumb"><b>Answer Finder</b></div>'+
      '<div class="sec-title"><span class="n">'+TGT+'</span>Answer-Finding Trainer</div>'+
      '<p class="sec-sub">The exam is open-book. Marks are won by knowing <em>where</em> to look in BS&nbsp;7671. Every answer here walks you to the regulation.</p>'+
      '<div class="tw-stats">'+
        '<div class="tw-stat"><div class="n">'+TRAINER_Q.length+'</div><div class="l">Questions</div></div>'+
        '<div class="tw-stat"><div class="n">'+nseen+'</div><div class="l">Attempted</div></div>'+
        '<div class="tw-stat"><div class="n">'+(best?best+'%':'\u2014')+'</div><div class="l">Best mock</div></div>'+
      '</div>'+
      '<div class="tw-modes">'+
        '<div class="feat" onclick="twParts()"><div class="ic">'+
          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 5a2 2 0 012-2h12v16H6a2 2 0 00-2 2V5z"/><path d="M4 19a2 2 0 012-2h12"/></svg></div>'+
          '<h3>Practice by Part</h3><p>Drill one Part of the Regs at a time. Instant feedback and a route to the relevant regulation after every answer.</p></div>'+
        '<div class="feat" onclick="twMockSetup()"><div class="ic">'+
          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2 2"/><path d="M5 3 2 6"/><path d="m22 6-3-3"/></svg></div>'+
          '<h3>Mock Exam</h3><p>60 questions in the authentic part-by-part proportions, a 2-hour countdown and a 70% pass mark \u2014 just like the real paper.</p></div>'+
      '</div>';
  };

  /* ---------------- PART PICKER ---------------- */
  window.twParts=function(){
    app=el(); stopTimer();
    var c=countByPart(), rows='';
    Object.keys(TRAINER_PARTS).forEach(function(p){
      var n=c[p]||0; if(!n)return;
      rows+='<button class="tw-part" onclick="twStartPractice('+p+')">'+
        '<span class="pn">'+(p==8?'A':p)+'</span>'+
        '<span><span class="pt">'+esc(pLabel(p))+'</span><br><span class="pm">'+esc(pHead(p))+'</span></span>'+
        '<span class="pc">'+n+' Q</span></button>';
    });
    app.innerHTML='<div class="crumb"><b onclick="renderTrainer()" style="cursor:pointer">Answer Finder</b> · Practice by Part</div>'+
      '<div class="sec-title"><span class="n">'+TGT+'</span>Practice by Part</div>'+
      '<p class="sec-sub">Pick a Part of BS&nbsp;7671 to drill.</p>'+
      '<div class="tw-parts">'+rows+'</div>';
  };

  /* ---------------- PRACTICE ---------------- */
  var prac={list:[],i:0};
  window.twStartPractice=function(part){
    prac.list=shuffle(TRAINER_Q.filter(function(q){return q.p===part;}));
    prac.i=0; prac.list.forEach(function(q){q._o=null;});
    twRenderPrac();
  };
  function twRenderPrac(){
    app=el(); var q=prac.list[prac.i];
    var order=q._o||(q._o=shuffle([0,1,2,3]));
    var pct=Math.round(prac.i/prac.list.length*100);
    var opts=order.map(function(oi,d){return '<button class="opt" data-oi="'+oi+'" onclick="twAnsPrac('+oi+')"><span class="ltr">'+LET[d]+'</span>'+esc(q.o[oi])+'</button>';}).join('');
    app.innerHTML='<div class="crumb"><b onclick="renderTrainer()" style="cursor:pointer">Answer Finder</b> · '+
        '<b onclick="twParts()" style="cursor:pointer">Practice</b> · '+esc(pHead(q.p))+'</div>'+
      '<div class="quiz-card">'+
        '<div class="progbar"><span style="width:'+pct+'%"></span></div>'+
        '<div class="quiz-meta"><span>Question '+(prac.i+1)+' of '+prac.list.length+' · <b style="color:var(--copper-d)">'+esc(q.reg)+'</b></span></div>'+
        '<div class="quiz-q">'+esc(q.q)+'</div>'+
        '<div id="opts">'+opts+'</div>'+
        '<div class="explain" id="explain"></div>'+
        '<div class="quiz-foot tw-navrow"><button class="btn btn-ghost" onclick="twPracNav(-1)"'+(prac.i===0?' disabled':'')+'>← Previous</button>'+
          '<span class="grow"></span>'+
          '<button class="btn btn-primary" id="twNext" style="display:none" onclick="twPracNav(1)">'+(prac.i===prac.list.length-1?'Finish':'Next question →')+'</button></div>'+
      '</div>';
  }
  window.twAnsPrac=function(chosen){
    var q=prac.list[prac.i]; markSeen(q.id);
    var opts=document.querySelectorAll('#opts .opt');
    Array.prototype.forEach.call(opts,function(b){
      var oi=+b.getAttribute('data-oi'); b.classList.add('locked'); b.disabled=true;
      if(oi===q.a)b.classList.add('correct'); else if(oi===chosen)b.classList.add('wrong'); else b.classList.add('dim');
    });
    var right=chosen===q.a, ex=document.getElementById('explain');
    ex.innerHTML='<b>'+(right?'\u2713 Correct.':'\u2717 Not quite.')+'</b> '+esc(q.why)+
      '<div class="tw-route"><b>In the book:</b> '+esc(q.reg)+'</div>';
    ex.classList.add('show');
    document.getElementById('twNext').style.display='inline-block';
  };
  window.twPracNav=function(d){
    if(d<0&&prac.i>0){prac.i--;twRenderPrac();}
    else if(d>0){ if(prac.i<prac.list.length-1){prac.i++;twRenderPrac();} else twParts(); }
  };

  /* ---------------- MOCK SETUP ---------------- */
  window.twMockSetup=function(){
    app=el(); stopTimer();
    var rows='';
    Object.keys(TRAINER_BLUEPRINT).forEach(function(p){
      var need=TRAINER_BLUEPRINT[p], pct=Math.round(need/60*100);
      rows+='<div class="tw-brow"><span class="bn">'+esc(pHead(p))+' · '+esc(pLabel(p))+'</span>'+
        '<span class="bb"><i style="width:'+pct+'%"></i></span><span class="bs">'+need+' Q</span></div>';
    });
    app.innerHTML='<div class="crumb"><b onclick="renderTrainer()" style="cursor:pointer">Answer Finder</b> · Mock Exam</div>'+
      '<div class="sec-title"><span class="n">'+TGT+'</span>Mock Exam</div>'+
      '<p class="sec-sub">60 questions · 2 hours · 70% to pass. Assembled in the same proportions the awarding bodies use.</p>'+
      '<div class="quiz-card"><div class="tw-break">'+rows+'</div>'+
        '<div class="tw-navrow"><button class="btn btn-primary grow" onclick="twStartMock()">Begin mock exam</button></div>'+
        '<p style="font-size:.8rem;color:var(--ink-soft);margin-top:12px;text-align:center">The timer runs for two hours. You can flag and revisit any question before submitting.</p></div>';
  };

  /* ---------------- MOCK RUN ---------------- */
  var mock={list:[],ans:[],i:0,left:0,tick:null};
  function assembleMock(){
    var picked=[];
    Object.keys(TRAINER_BLUEPRINT).forEach(function(p){
      var need=TRAINER_BLUEPRINT[p], pool=shuffle(TRAINER_Q.filter(function(q){return q.p===+p;}));
      for(var k=0;k<need&&k<pool.length;k++)picked.push(pool[k]);
    });
    if(picked.length<60){var used={};picked.forEach(function(q){used[q.id]=1;});
      var extra=shuffle(TRAINER_Q.filter(function(q){return !used[q.id];}));
      for(var j=0;picked.length<60&&j<extra.length;j++)picked.push(extra[j]);}
    return shuffle(picked).slice(0,Math.min(60,picked.length));
  }
  window.twStartMock=function(){
    mock.list=assembleMock(); mock.ans=mock.list.map(function(){return null;});
    mock.list.forEach(function(q){q._o=shuffle([0,1,2,3]);});
    mock.i=0; mock.left=2*60*60;
    twRenderMock(); startTimer();
  };
  function startTimer(){ stopTimer(); updTimer();
    mock.tick=setInterval(function(){
      if(!document.getElementById('twMockCard')){stopTimer();return;} // navigated away
      mock.left--; updTimer();
      if(mock.left<=0){stopTimer();twFinish(true);}
    },1000);
  }
  function stopTimer(){if(mock.tick){clearInterval(mock.tick);mock.tick=null;}}
  function updTimer(){var t=Math.max(0,mock.left),h=Math.floor(t/3600),m=Math.floor((t%3600)/60),s=t%60;
    var e=document.getElementById('twTimer'); if(!e)return;
    e.textContent=h+':'+('0'+m).slice(-2)+':'+('0'+s).slice(-2); e.classList.toggle('low',t<=300);}
  function twRenderMock(){
    app=el(); var q=mock.list[mock.i], chosen=mock.ans[mock.i];
    var opts=q._o.map(function(oi,d){var sel=chosen===oi?' style="border-color:var(--navy);background:#eef1f7"':'';
      return '<button class="opt" data-oi="'+oi+'"'+sel+' onclick="twPick('+oi+')"><span class="ltr">'+LET[d]+'</span>'+esc(q.o[oi])+'</button>';}).join('');
    var pills=mock.list.map(function(qq,idx){var cls='tw-pill'+(mock.ans[idx]!==null?' done':'')+(idx===mock.i?' cur':'');
      return '<button class="'+cls+'" onclick="twJump('+idx+')">'+(idx+1)+'</button>';}).join('');
    app.innerHTML='<div class="crumb"><b onclick="renderTrainer()" style="cursor:pointer">Answer Finder</b> · Mock Exam</div>'+
      '<div class="tw-exambar"><span class="tw-timer" id="twTimer">2:00:00</span>'+
        '<div class="progbar" style="flex:1;margin:0"><span style="width:'+((mock.i+1)/mock.list.length*100)+'%"></span></div>'+
        '<span class="pos">'+(mock.i+1)+' / '+mock.list.length+'</span></div>'+
      '<div class="quiz-card" id="twMockCard">'+
        '<div class="quiz-meta"><span><b style="color:var(--copper-d)">'+esc(pHead(q.p))+'</b></span></div>'+
        '<div class="quiz-q">'+esc(q.q)+'</div><div id="opts">'+opts+'</div></div>'+
      '<div class="tw-pills">'+pills+'</div>'+
      '<div class="tw-navrow"><button class="btn btn-ghost" onclick="twStep(-1)"'+(mock.i===0?' disabled':'')+'>← Previous</button>'+
        '<button class="btn btn-ghost" onclick="twStep(1)"'+(mock.i===mock.list.length-1?' disabled':'')+'>Next →</button>'+
        '<span class="grow"></span><button class="btn btn-primary" onclick="twSubmit()">Submit</button></div>';
    updTimer();
  }
  window.twPick=function(oi){mock.ans[mock.i]=oi;twRenderMock();};
  window.twJump=function(i){mock.i=i;twRenderMock();};
  window.twStep=function(d){var n=mock.i+d;if(n>=0&&n<mock.list.length){mock.i=n;twRenderMock();}};
  window.twSubmit=function(){
    var un=mock.ans.filter(function(a){return a===null;}).length;
    var msg=un>0?('You have '+un+' unanswered question'+(un>1?'s':'')+'. Submit anyway?'):'Submit your exam for marking?';
    if(confirm(msg))twFinish(false);
  };

  function twFinish(timedOut){
    stopTimer(); app=el();
    mock.list.forEach(function(q){markSeen(q.id);});
    var correct=0; mock.list.forEach(function(q,i){if(mock.ans[i]===q.a)correct++;});
    var total=mock.list.length, pct=Math.round(correct/total*100), pass=pct>=70;
    var best=parseInt(get('tw18_best')||'0',10); if(pct>best)set('tw18_best',String(pct));
    var R=52,C=2*Math.PI*R,off=C*(1-pct/100);
    var ring='<svg class="tw-ring" viewBox="0 0 120 120">'+
      '<circle cx="60" cy="60" r="'+R+'" fill="none" stroke="var(--line)" stroke-width="12"/>'+
      '<circle cx="60" cy="60" r="'+R+'" fill="none" stroke="'+(pass?'var(--green)':'var(--red)')+'" stroke-width="12" stroke-linecap="round" stroke-dasharray="'+C+'" stroke-dashoffset="'+off+'" transform="rotate(-90 60 60)"/>'+
      '<text x="60" y="58" text-anchor="middle" class="num">'+pct+'%</text>'+
      '<text x="60" y="76" text-anchor="middle" class="lbl">'+correct+' / '+total+'</text></svg>';
    var pt={},pc={}; mock.list.forEach(function(q,i){pt[q.p]=(pt[q.p]||0)+1;if(mock.ans[i]===q.a)pc[q.p]=(pc[q.p]||0)+1;});
    var brk=Object.keys(pt).sort().map(function(p){var t=pt[p],c=pc[p]||0,r=Math.round(c/t*100);
      return '<div class="tw-brow"><span class="bn">'+esc(pHead(p))+'</span><span class="bb"><i style="width:'+r+'%;background:'+(r>=70?'var(--green)':'var(--copper)')+'"></i></span><span class="bs">'+c+'/'+t+'</span></div>';}).join('');
    var rev=mock.list.map(function(q,idx){var your=mock.ans[idx];
      var os=q.o.map(function(opt,oi){var cls='',tag='';if(oi===q.a){cls='c';tag=' \u2713';}else if(oi===your){cls='x';tag=' \u2717 your answer';}
        return cls?'<div class="ro '+cls+'"><span class="l">'+LET[oi]+'</span><span>'+esc(opt)+esc(tag)+'</span></div>':'';}).join('');
      var st=your===q.a?'correct':(your===null?'skipped':'incorrect');
      return '<div class="tw-rev"><div class="quiz-meta"><span><b style="color:var(--copper-d)">'+esc(q.reg)+'</b> · Q'+(idx+1)+' · '+st+'</span></div>'+
        '<div class="rq">'+esc(q.q)+'</div>'+os+'<div class="rw"><b>How to find it:</b> '+esc(q.why)+'</div></div>';}).join('');
    app.innerHTML='<div class="crumb"><b onclick="renderTrainer()" style="cursor:pointer">Answer Finder</b> · Mock Result</div>'+
      '<div class="quiz-card">'+ring+
        '<div class="tw-verdict '+(pass?'pass':'fail')+'">'+(pass?'Pass':'Below pass mark')+'</div>'+
        '<div class="tw-vsub">'+(timedOut?'Time expired. ':'')+(pass?'You cleared the 70% threshold \u2014 strong navigation.':'The pass mark is 70%. Review the regulations below and try again.')+'</div>'+
        '<div class="tw-break">'+brk+'</div>'+
        '<div class="tw-navrow" style="margin-top:20px"><button class="btn btn-primary grow" onclick="twMockSetup()">New mock exam</button>'+
          '<button class="btn btn-ghost" onclick="renderTrainer()">Trainer home</button></div></div>'+
      '<div class="sec-title" style="font-size:1.15rem"><span class="n">'+TGT+'</span>Full review</div>'+
      '<div class="quiz-card">'+rev+'</div>';
  }
})();
</script>
