ontrols{display:flex;gap:10px;justify-content:space-between;margin-top:20px;flex-wrap:wrap}.btn{background:var(--accent);color:white;border:0;border-radius:12px;padding:12px 18px;font-weight:bold;cursor:pointer}.btn.secondary{background:#6c7a86}.btn:disabled{opacity:.45;cursor:not-allowed}.results{text-align:center}.score{font-size:2rem;color:#0b5c8e;font-weight:bold}.review{margin-top:18px;text-align:left}.reviewItem{padding:12px;border-bottom:1px solid #e1eef5}.svgbox{background:#fff;border:1px solid #dbe7ef;border-radius:12px;padding:10px;text-align:center;margin:12px auto;max-width:520px}.watermark{position:fixed;bottom:7px;right:12px;font-size:.8rem;color:#0b5c8e77;pointer-events:none}

<header><h1>ELEC2/05A Electrical Installation Methods, Procedures and Regulations</h1><p>Revision Paper 1 — Interactive Self-Marking Quiz</p></header>
<div class="wrap"><div class="card" id="app"></div></div><div class="watermark">tutorwarren.com</div>
<script>
const questions = [{"q": "The tool shown is used to:", "img": "image1.jpeg", "opts": {"A": "Ensure that the job is square", "B": "Ensure that the job is level", "C": "Ensure that the job is the correct distance", "D": "Ensure that the job is the correct voltage"}, "ans": "B", "exp": "The tool shown is a spirit level. It is used to check whether work is level or plumb."}, {"q": "Which one of the following tools should be used to measure a distance of 1.2 m from the floor?", "opts": {"A": "Spirit level", "B": "Plumb line", "C": "Tape measure", "D": "Engineers square"}, "ans": "C", "exp": "A tape measure is used to measure set distances, such as 1.2 m from floor level."}, {"q": "When installing conduit a plumb line is used to:", "opts": {"A": "Ensure the conduit is level", "B": "Ensure the conduit is the correct distance of the floor", "C": "Ensure the conduit is square", "D": "Ensure the conduit drops are vertical"}, "ans": "D", "exp": "A plumb line uses gravity to show a true vertical line, so it checks that conduit drops are vertical."}, {"q": "A number of electrical enclosures have to be mounted to ensure that all the fixing holes are accurate. Which one of the following is used?", "opts": {"A": "Faceplate", "B": "Template", "C": "Spirit level", "D": "Engineers rule"}, "ans": "B", "exp": "A template is used to mark repeated fixing holes accurately and consistently."}, {"q": "An engineer’s square is used to:", "opts": {"A": "Ensure that the job is square", "B": "Ensure that the job is level", "C": "Ensure that the job is the correct distance", "D": "Ensure that the job is the correct voltage"}, "ans": "A", "exp": "An engineer’s square checks right angles, normally 90°."}, {"q": "For marking out accurate hole positions which one of the following should be used:", "opts": {"A": "Pen", "B": "Pencil", "C": "Marker", "D": "Scriber"}, "ans": "D", "exp": "A scriber makes a fine accurate line on metal, giving more accurate marking out than a pen or pencil."}, {"q": "Question 7.1: Identify this tool.", "img": "image2.jpeg", "opts": {"A": "Flat file", "B": "Conduit reamer", "C": "Side cutters", "D": "Combination pliers", "E": "Pozidriv screwdriver (PZ2)", "F": "Ratchet crimping tool", "G": "Hacksaw", "H": "Mole grips"}, "ans": "A", "exp": "A flat file is used to smooth metal edges and remove burrs."}, {"q": "Question 7.2: Identify this tool.", "img": "image3.jpeg", "opts": {"A": "Flat file", "B": "Conduit reamer", "C": "Side cutters", "D": "Combination pliers", "E": "Pozidriv screwdriver (PZ2)", "F": "Ratchet crimping tool", "G": "Hacksaw", "H": "Mole grips"}, "ans": "B", "exp": "A conduit reamer removes burrs from the inside edge of cut conduit, preventing cable damage."}, {"q": "Question 7.3: Identify this tool.", "img": "image4.jpeg", "opts": {"A": "Flat file", "B": "Conduit reamer", "C": "Side cutters", "D": "Combination pliers", "E": "Pozidriv screwdriver (PZ2)", "F": "Ratchet crimping tool", "G": "Hacksaw", "H": "Mole grips"}, "ans": "C", "exp": "Side cutters are used for cutting conductors and small cables."}, {"q": "Question 7.4: Identify this tool.", "img": "image5.jpeg", "opts": {"A": "Flat file", "B": "Conduit reamer", "C": "Side cutters", "D": "Combination pliers", "E": "Pozidriv screwdriver (PZ2)", "F": "Ratchet crimping tool", "G": "Hacksaw", "H": "Mole grips"}, "ans": "D", "exp": "Combination pliers can grip, twist, bend and cut conductors."}, {"q": "Question 7.5: Identify this tool.", "img": "image6.jpeg", "opts": {"A": "Flat file", "B": "Conduit reamer", "C": "Side cutters", "D": "Combination pliers", "E": "Pozidriv screwdriver (PZ2)", "F": "Ratchet crimping tool", "G": "Hacksaw", "H": "Mole grips"}, "ans": "E", "exp": "A Pozidriv screwdriver is commonly used on electrical accessory screws."}, {"q": "Question 7.6: Identify this tool.", "img": "image7.jpeg", "opts": {"A": "Flat file", "B": "Conduit reamer", "C": "Side cutters", "D": "Combination pliers", "E": "Pozidriv screwdriver (PZ2)", "F": "Ratchet crimping tool", "G": "Hacksaw", "H": "Mole grips"}, "ans": "F", "exp": "A ratchet crimping tool is used to crimp terminals onto conductors."}, {"q": "Which one of the following drills would you use when fixing trunking to a brick wall?", "imggrid": [["A", "image8.jpeg"], ["B", "image9.jpeg"], ["C", "image10.jpeg"], ["D", "image11.jpeg"]], "opts": {"A": "Hole saw", "B": "Flat / spade bit", "C": "Auger bit", "D": "Masonry drill bit"}, "ans": "D", "exp": "Brickwork requires a masonry drill bit. The other bits are mainly for cutting holes in other materials such as wood or sheet materials."}, {"q": "Which tool is best suited to pulling a cable through a small aperture?", "opts": {"A": "Mole-grips", "B": "Side-cutters", "C": "Long-nosed pliers", "D": "Bull-nosed pliers"}, "ans": "C", "exp": "Because the aperture is small, long-nosed pliers are the best choice. Their slim jaws can reach into small openings to grip and pull a cable."}, {"q": "Why is it necessary to visually inspect an extension lead prior to use?", "opts": {"A": "To check for signs of damage", "B": "To ensure it is yellow", "C": "To check it has been PAT tested", "D": "To ensure it is not dirty"}, "ans": "A", "exp": "A visual inspection checks for obvious damage such as cracked casing, damaged insulation, loose plug parts or exposed conductors."}, {"q": "Which tool is used when installing metallic conduit to metal socket 'backboxes'?", "opts": {"A": "Torx key", "B": "Allen key", "C": "Bush key", "D": "Alien key"}, "ans": "C", "exp": "A bush key is used to tighten conduit bushes when terminating conduit into metal boxes."}, {"q": "Portable electric tools used on a construction site should be supplied at a voltage of:", "opts": {"A": "230 volts", "B": "400 volts", "C": "110 volts", "D": "25 volts"}, "ans": "C", "exp": "110 V tools are commonly used on construction sites to reduce electric shock risk, usually supplied through a centre-tapped transformer."}, {"q": "The type of conduit joint shown is which one of the following?", "img": "image12.png", "opts": {"A": "Joining coupler", "B": "Running coupler", "C": "Female bush and locknut coupler", "D": "Male bush and coupler coupler"}, "ans": "B", "exp": "The diagram shows a running coupler arrangement, used where conduit cannot simply be rotated to tighten a normal coupler."}, {"q": "If a hole had to be produced by a hand drill in a masonry wall, which one of the settings should the drill be set on?", "opts": {"A": "Hammer", "B": "Chisel", "C": "Screwdriver", "D": "Reverse"}, "ans": "A", "exp": "Masonry drilling requires hammer action to help break into brick or blockwork."}, {"q": "The tool shown is which one of the following?", "img": "image13.jpeg", "opts": {"A": "Tray bender", "B": "Basket bender", "C": "Conduit bender", "D": "Cable bender"}, "ans": "C", "exp": "The tool shown is a conduit bender, used to form bends in steel conduit."}, {"q": "The type of saddle shown is used for fixing conduit. What is it called?", "img": "image14.jpeg", "opts": {"A": "Stamp saddle", "B": "Distance saddle", "C": "Spacer bar saddle", "D": "Hospital saddle"}, "ans": "C", "exp": "The image shows a spacer bar saddle, which supports conduit away from the fixing surface."}, {"q": "Which one of the following would you use to attach 20 mm steel conduit to a back box?", "opts": {"A": "Male brass bush and coupling", "B": "Female brass bush and coupling", "C": "Lock nut and male brass bush", "D": "Super glue"}, "ans": "A", "exp": "For this paper, the expected answer is male brass bush and coupling. The bush provides a smooth protected entry for the cable and the coupling connects to the conduit thread."}, {"q": "The following picture shows which one of the following?", "img": "image15.jpeg", "opts": {"A": "Galvanised Trunking Internal Bend", "B": "Galvanised Trunking Tee Piece", "C": "Galvanised Trunking Flat Bend", "D": "Galvanised Trunking Coupler"}, "ans": "A", "exp": "The fitting shown is a galvanised trunking internal bend, used where trunking changes direction around an internal corner."}, {"q": "Why is cable tray NOT to be used as an 'earthing conductor'?", "opts": {"A": "Cable tray CAN be used as an earthing conductor", "B": "Because electrical continuity cannot be guaranteed", "C": "Because electrical insulation cannot be guaranteed", "D": "Because cable tray cannot conduct electricity"}, "ans": "B", "exp": "Cable tray is metal, but the continuity across joints and fixings cannot always be guaranteed, so it should not be relied upon as an earthing conductor."}, {"q": "Which one of the following must be used if fixing a light switch to a plasterboard wall?", "opts": {"A": "Gutter bolt", "B": "Rawl plug", "C": "Gravity toggles", "D": "No nails"}, "ans": "C", "exp": "Gravity toggles are suitable cavity fixings for plasterboard walls where there is no solid masonry behind."}, {"q": "A cable installed under a floor or above a ceiling without mechanical protection should be run at least:", "opts": {"A": "25 mm from the top or bottom of the joist", "B": "50 mm from the top or bottom of the joist", "C": "75 mm from the top or bottom of the joist", "D": "100 mm from the top or bottom of the joist"}, "ans": "B", "exp": "The cable should be at least 50 mm from the top or bottom of the joist to reduce the risk of damage from nails and screws."}, {"q": "Which one of the following diagrams shows the incorrect cable routing where the cable is concealed within a wall at a depth of less than 50 mm from the surface?", "svg22": true, "opts": {"A": "A", "B": "B", "C": "C", "D": "D"}, "ans": "A", "exp": "Diagram A shows a diagonal cable route. Cables concealed less than 50 mm deep should be routed in recognised safe zones, normally vertically or horizontally from accessories."}, {"q": "What is the function of the small 'copper strap' that links two pieces of metallic trunking together?", "opts": {"A": "To strengthen the connection", "B": "To help ensure a continuous earth", "C": "To allow for the attachment of extra fittings", "D": "To allow for expansion"}, "ans": "B", "exp": "The copper strap bonds the two pieces together and helps maintain earth continuity across the trunking joint."}, {"q": "Where would a 'fire barrier' be fitted?", "opts": {"A": "Where trunking passes between walls", "B": "Every 0.5 metres inside trunking", "C": "Where trunking passes between floors or walls", "D": "Where trunking passes between floors"}, "ans": "C", "exp": "Fire barriers are used where services pass through building compartments, such as floors or walls, to reduce fire and smoke spread."}, {"q": "What is the function of 'compartmented' trunking?", "opts": {"A": "To separate BAND II and BAND III circuits", "B": "To separate BAND I and BAND II circuits", "C": "To separate single and 3-phase circuits", "D": "To separate lighting and power circuits"}, "ans": "B", "exp": "Compartmented trunking provides segregation between different voltage bands, such as Band I and Band II circuits."}, {"q": "Which test proves that the 'live' conductor is connected to the centre-pin in an ES (Edison-screw) light fitting?", "opts": {"A": "Polarity", "B": "Continuity of ring final circuit", "C": "Continuity of cpc", "D": "Insulation resistance"}, "ans": "A", "exp": "A polarity test confirms that the line conductor is connected to the correct terminal, including the centre contact of an ES lampholder."}, {"q": "Which test is used to prove that the circuit under test has no dangerous short-circuits PRIOR to the circuit being made 'live'?", "opts": {"A": "Polarity", "B": "Continuity of ring final conductors", "C": "Continuity of cpc", "D": "Insulation resistance"}, "ans": "D", "exp": "Insulation resistance testing checks that conductors are not shorted together and that insulation is sound before energising."}, {"q": "What setting is used for conducting a Polarity test?", "opts": {"A": "k Amps", "B": "m Seconds", "C": "M ohms", "D": "Low ohms"}, "ans": "D", "exp": "Polarity testing is a continuity test, so the meter is set to low ohms."}, {"q": "Which ONE of the following organizations is responsible for the 'maintenance and service of electrical installations and associated equipment'?", "opts": {"A": "Electrical maintenance company", "B": "Instrumentation company", "C": "Panel building company", "D": "Computer Network Installations"}, "ans": "A", "exp": "An electrical maintenance company is responsible for maintaining and servicing electrical installations and associated equipment."}, {"q": "Who is responsible for paying for completed works?", "opts": {"A": "Architect", "B": "Main contractor", "C": "Sub-contractor", "D": "Client"}, "ans": "D", "exp": "The client is the person or organisation who has requested the work and is ultimately responsible for paying for completed works."}];

let current=0, firstTryCorrect=0, answered=false, attempts=[], chosen=[];
function letterText(opts){return Object.entries(opts).map(([k,v])=>`<button class="option" data-choice="${k}"><b>${k}.</b> ${v}</button>`).join('')}
function safeZoneSVG(){return `<div class="svgbox"><svg viewBox="0 0 520 360" width="100%" height="auto" aria-label="Cable routing diagrams A B C D"><style>.box{fill:white;stroke:#222;stroke-width:3}.line{stroke:#222;stroke-width:4;fill:none}.lbl{font:bold 22px Arial;fill:#333}</style><rect class="box" x="70" y="45" width="28" height="28"/><rect class="box" x="230" y="145" width="28" height="28"/><path class="line" d="M98 73 L230 145"/><text class="lbl" x="145" y="125">A</text><rect class="box" x="70" y="260" width="28" height="28"/><rect class="box" x="230" y="190" width="28" height="28"/><path class="line" d="M98 274 L245 274 L245 218"/><text class="lbl" x="145" y="250">B</text><rect class="box" x="330" y="45" width="28" height="28"/><rect class="box" x="450" y="45" width="28" height="28"/><rect class="box" x="330" y="155" width="28" height="28"/><path class="line" d="M344 155 L344 58 L450 58"/><text class="lbl" x="390" y="126">C</text><rect class="box" x="330" y="260" width="28" height="28"/><rect class="box" x="450" y="200" width="28" height="28"/><path class="line" d="M344 260 L344 214 L450 214"/><text class="lbl" x="390" y="260">D</text></svg></div>`}
function render(){
 const q=questions[current]; answered=false;
 const pct=Math.round((current)/questions.length*100);
 let media='';
 if(q.img) media=`<img class="qimg" src="${images[q.img]}" alt="question image">`;
 if(q.imggrid) media=`<div class="gridimg">${q.imggrid.map(([l,n])=>`<div class="imgopt">${l}<img src="${images[n]}" alt="option ${l} image"></div>`).join('')}</div>`;
 if(q.svg22) media=safeZoneSVG();
 document.getElementById('app').innerHTML=`<div class="topbar"><span class="pill">Question ${current+1} of ${questions.length}</span><div class="progress"><div class="bar" style="width:${pct}%"></div></div><span class="pill">First-attempt score: ${firstTryCorrect}</span></div><div class="qtitle">${q.q}</div>${media}<div class="options">${letterText(q.opts)}</div><div id="feedback" class="feedback"></div><div class="controls"><button class="btn secondary" onclick="prevQ()" ${current===0?'disabled':''}>Previous</button><button class="btn" id="nextBtn" onclick="nextQ()" disabled>${current===questions.length-1?'Finish':'Next Question'}</button></div>`;
 document.querySelectorAll('.option').forEach(b=>b.addEventListener('click',()=>choose(b)));
}
function choose(btn){
 if(answered) return;
 const q=questions[current]; const choice=btn.dataset.choice; chosen[current]=choice;
 let fb=document.getElementById('feedback');
 if(!attempts[current]) attempts[current]=0; attempts[current]++;
 if(choice===q.ans){
   btn.classList.add('correct'); answered=true;
   if(attempts[current]===1) firstTryCorrect++;
   fb.className='feedback good'; fb.innerHTML=`<b>Correct ✅</b><br><b>${q.ans} – ${q.opts[q.ans]}</b><br>${q.exp}`;
   document.getElementById('nextBtn').disabled=false;
 } else {
   btn.classList.add('wrong');
   fb.className='feedback bad'; fb.innerHTML=`<b>Not quite ❌</b><br>Try again. Hint: ${hint(q)}`;
 }
}
function hint(q){
 const e=q.exp; return e.length>120 ? e.slice(0,120)+'…' : e;
}
function nextQ(){ if(current<questions.length-1){current++;render()}else{showResults()} }
function prevQ(){ if(current>0){current--;render()} }
function showResults(){
 const percent=Math.round(firstTryCorrect/questions.length*100);
 document.getElementById('app').innerHTML=`<div class="results"><h2>Quiz Complete</h2><div class="score">${firstTryCorrect} / ${questions.length}</div><p>First-attempt score: <b>${percent}%</b></p><p>This score only counts answers selected correctly on the first attempt. Learners were allowed to try again to learn from mistakes.</p><button class="btn" onclick="restart()">Restart Quiz</button></div><div class="review">${questions.map((q,i)=>`<div class="reviewItem"><b>Q${i+1}:</b> ${q.q}<br><b>Correct answer:</b> ${q.ans} – ${q.opts[q.ans]}<br><b>Explanation:</b> ${q.exp}</div>`).join('')}</div>`;
}
function restart(){current=0;firstTryCorrect=0;answered=false;attempts=[];chosen=[];render()}
render();
</script>
</body>
</html>
